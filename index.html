<script>/* ---- feedback.js ---- */
/* OnsAms beta: feedback module (CSS prefix fb-). The testing instrument for Team 5.
   Routes: feedback (tester form), results (team view), both under the "me" tab.
   Exposes: OA.feedback.prompt() -> bottom sheet "Got a minute? Help Team 5 test this".
   Storage: OA.fb (core.js). Entries live under their own key and survive "Restart demo".
   Saved entry shape:
     { id, at, visited, points,            <- added by OA.fb.save (visited = screens this tester opened)
       role: 'resident'|'hospitality'|'nature'|'visitor'|'student'|'other',
       name: '' (optional first name),
       ratings: { understand, use, change, trust }  (1..5 each),
       comments: { like, stop, change }  (strings, may be ''),
       quoteOk: true|false,
       appRole: 'visitor'|'resident'|null (the demo profile active while testing) } */
/* icons: home, room_service, eco, luggage, school, person, check, check_circle, radio_button_unchecked, format_quote, content_copy, delete, delete_sweep, rate_review, forum, touch_app, arrow_forward, restart_alt, bar_chart, close, person_add, select_all, warning */
(function () {
  'use strict';
  var OA = window.OA;
  if (!OA || !OA.h || !OA.ui) return;
  var P = OA.h, html = P.html, ui = OA.ui, cx = OA.cx;
  var useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;

  /* ---------- the instrument ---------- */
  var ROLES = [
    { id: 'resident', label: 'Resident', short: 'Resident', sub: 'I live in Amsterdam', icon: 'home', req: true, color: '#F26A1F' },
    { id: 'hospitality', label: 'Hospitality', short: 'Hospitality', sub: 'I work in a hotel, café or tourism', icon: 'room_service', req: true, color: '#3E7F9C' },
    { id: 'nature', label: 'Nature & environment', short: 'Nature', sub: 'I speak up for water, parks and wildlife', icon: 'eco', req: true, color: '#3F8A57' },
    { id: 'visitor', label: 'Visitor', short: 'Visitor', sub: 'I\'m visiting the city', icon: 'luggage', color: '#D99A21' },
    { id: 'student', label: 'Student', short: 'Student', sub: 'I study here', icon: 'school', color: '#6E4A7E' },
    { id: 'other', label: 'Other', short: 'Other', sub: 'Something else', icon: 'person', color: '#8E837C' }
  ];
  var REQ = ROLES.filter(function (r) { return r.req; });
  var QS = [
    { id: 'understand', text: 'I understand what OnsAms does', short: 'Understand' },
    { id: 'use', text: 'I would use it', short: 'Would use' },
    { id: 'change', text: 'It would change where I go or spend', short: 'Changes' },
    { id: 'trust', text: 'I trust where the points go', short: 'Trust' }
  ];
  var OPEN = [
    { id: 'like', text: 'What did you like?', ph: 'The part that worked for you' },
    { id: 'stop', text: 'What would stop you from using it?', ph: 'Anything that would hold you back' },
    { id: 'change', text: 'What should we change?', ph: 'One thing you would do differently' }
  ];
  var LOW = 'Strongly disagree', HIGH = 'Strongly agree';

  /* Friendly names for the screens a tester opened (from state.visited). */
  var SCREEN_NAMES = {
    welcome: 'Sign-up', signup: 'Sign-up', interests: 'Sign-up', intro: 'Sign-up',
    'v-home': 'Home', 'r-home': 'Resident home', me: 'Profile', impact: 'Impact', about: 'About',
    explore: 'Explore map', nature: 'Nature guide', earn: 'Earn', ticket: 'Booking', use: 'Use points',
    chat: 'Host chat', done: 'Redeeming', host: 'Hosting', 'host-new': 'Create an offer', fund: 'Fund', proposal: 'Fund'
  };
  var SKIP = { splash: 1, feedback: 1, results: 1, 'art-gallery': 1 };

  function roleOf(id) {
    for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
    return ROLES[ROLES.length - 1];
  }
  function pretty(k) { k = String(k).replace(/[-_]+/g, ' '); return k.charAt(0).toUpperCase() + k.slice(1); }
  function tried(visited) {
    var out = [];
    Object.keys(visited || {}).forEach(function (k) {
      if (SKIP[k]) return;
      var n = SCREEN_NAMES[k] || pretty(k);
      if (out.indexOf(n) < 0) out.push(n);
    });
    return out;
  }
  function rating(e, q) { var v = e && e.ratings && Number(e.ratings[q]); return v >= 1 && v <= 5 ? v : 0; }
  function comment(e, k) { var c = e && e.comments && e.comments[k]; return typeof c === 'string' ? c.trim() : ''; }
  function when(iso) { return OA.fmt.day(iso) + ', ' + OA.fmt.time(iso); }
  function avg(list, q) {
    var s = 0, n = 0;
    list.forEach(function (e) { var v = rating(e, q); if (v) { s += v; n++; } });
    return { avg: n ? s / n : 0, n: n };
  }
  function fmtAvg(v) { return v ? v.toFixed(1) : '–'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function scrollTop() { var v = document.getElementById('oa-viewport'); if (v) v.scrollTop = 0; }
  function byNewest(a, b) { return (a.at || '') < (b.at || '') ? 1 : -1; }
  function counts(list) {
    var c = {}; ROLES.forEach(function (r) { c[r.id] = 0; });
    list.forEach(function (e) { c[roleOf(e.role).id]++; });
    return c;
  }

  /* ---------- feedback: the tester form ---------- */
  function blank() { return { role: null, name: '', ratings: {}, comments: { like: '', stop: '', change: '' }, quoteOk: false }; }

  function Scale(p) {
    var q = p.q, v = p.value || 0;
    return html`<div class=${cx('fb-q', v && 'done')} data-q=${q.id}>
      <div class="fb-q-t" id=${'fb-q-' + q.id}>${q.text}</div>
      <div class="fb-scale" role="radiogroup" aria-labelledby=${'fb-q-' + q.id}>
        ${[1, 2, 3, 4, 5].map(function (n) {
          return html`<button type="button" role="radio" aria-checked=${n === v ? 'true' : 'false'} data-v=${n}
            aria-label=${n + ' of 5' + (n === 1 ? ', ' + LOW.toLowerCase() : n === 5 ? ', ' + HIGH.toLowerCase() : '')}
            class=${cx('fb-pt', n === v && 'on')} onClick=${function () { p.onChange(n); }}>${n}</button>`;
        })}
      </div>
      <div class="fb-ends" aria-hidden="true"><span>${LOW}</span><span>${HIGH}</span></div>
    </div>`;
  }

  function TriedLine() {
    var s = OA.get();
    var names = tried(s.visited);
    var shown = names.slice(0, 6);
    return html`<p class="fb-tried"><${ui.Icon} name="touch_app"/>
      <span>${names.length
        ? html`You tried: <b>${shown.join(', ')}${names.length > shown.length ? ' and ' + (names.length - shown.length) + ' more' : ''}</b>`
        : 'You haven\'t opened other screens yet. You can still rate the idea.'}</span></p>`;
  }

  function FeedbackScreen() {
    OA.useStore();
    var st = useState(blank), f = st[0], setF = st[1];
    var sv = useState(null), saved = sv[0], setSaved = sv[1];
    function upd(patch) { setF(function (o) { return Object.assign({}, o, patch); }); }
    function rate(q, n) { setF(function (o) { var r = Object.assign({}, o.ratings); r[q] = n; return Object.assign({}, o, { ratings: r }); }); }
    function say(k, t) { setF(function (o) { var c = Object.assign({}, o.comments); c[k] = t; return Object.assign({}, o, { comments: c }); }); }

    if (saved) return html`<${ThankYou} entry=${saved}/>`;

    var rated = QS.filter(function (q) { return f.ratings[q.id]; }).length;
    var doneN = (f.role ? 1 : 0) + rated, total = 1 + QS.length;
    var ready = doneN === total;
    var left = QS.length - rated;
    var hint = ready ? 'Ready to save. The rest is optional.'
      : !f.role && !rated ? 'Start with who you are'
      : !f.role ? 'Pick who you are'
      : 'Rate ' + left + ' more statement' + (left === 1 ? '' : 's');

    function jump() {
      var sel = !f.role ? '#fb-sec-role' : null;
      if (!sel) for (var i = 0; i < QS.length; i++) if (!f.ratings[QS[i].id]) { sel = '.fb-q[data-q="' + QS[i].id + '"]'; break; }
      var el = sel && document.querySelector(sel);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('fb-flash'); void el.offsetWidth; el.classList.add('fb-flash');
    }
    function save() {
      if (!ready) return;
      var comments = {};
      OPEN.forEach(function (o) { comments[o.id] = (f.comments[o.id] || '').trim(); });
      var e = OA.fb.save({
        role: f.role, name: (f.name || '').trim().slice(0, 40), ratings: Object.assign({}, f.ratings),
        comments: comments, quoteOk: !!f.quoteOk, appRole: OA.get().role || null
      });
      setSaved(e);
      scrollTop();
    }

    return html`<div class="screen fb">
      <${ui.Header} title="Give feedback" sub="About 2 minutes"
        right=${html`<${ui.IconBtn} name="bar_chart" label="See test results (team)" onClick=${function () { OA.nav.go('results'); }}/>`}/>
      <div class="fb-intro">
        <span class="eyebrow">Help Team 5 test OnsAms</span>
        <h1 class="h1">What do you think?</h1>
        <p class="lede">Tap a few answers and add a sentence if you like. Your answers stay on this phone.</p>
        <${TriedLine}/>
      </div>

      <section class="fb-sec" id="fb-sec-role">
        <h2 class="fb-st"><span class="fb-n">1</span>Who are you?</h2>
        <div class="fb-roles" role="radiogroup" aria-label="Who are you?">
          ${ROLES.map(function (r) {
            var on = f.role === r.id;
            return html`<button type="button" role="radio" aria-checked=${on ? 'true' : 'false'} data-role=${r.id}
              class=${cx('fb-role', on && 'on')} onClick=${function () { upd({ role: r.id }); }}>
              <span class="fb-role-ic"><${ui.Icon} name=${r.icon} fill=${on}/></span>
              <span class="fb-role-t">${r.label}</span><span class="fb-role-s">${r.sub}</span>
              ${on && html`<span class="fb-role-ck"><${ui.Icon} name="check" size=${16}/></span>`}
            </button>`;
          })}
        </div>
        <${ui.Field} id="fb-name" label="Your first name (optional)" value=${f.name} placeholder="First name" max=${40}
          hint="Leave it empty to stay anonymous." onInput=${function (v) { upd({ name: v }); }}/>
      </section>

      <section class="fb-sec" id="fb-sec-rate">
        <h2 class="fb-st"><span class="fb-n">2</span>How much do you agree?</h2>
        ${QS.map(function (q) { return html`<${Scale} key=${q.id} q=${q} value=${f.ratings[q.id]} onChange=${function (n) { rate(q.id, n); }}/>`; })}
      </section>

      <section class="fb-sec">
        <h2 class="fb-st"><span class="fb-n">3</span>Tell us more <span class="fb-opt">Optional</span></h2>
        ${OPEN.map(function (o) {
          return html`<${ui.Field} key=${o.id} id=${'fb-' + o.id} label=${o.text} multiline rows=${2} max=${600}
            value=${f.comments[o.id]} placeholder=${o.ph} onInput=${function (v) { say(o.id, v); }}/>`;
        })}
        <label class="fb-consent" for="fb-quote">
          <input type="checkbox" id="fb-quote" checked=${f.quoteOk} onChange=${function (e) { upd({ quoteOk: e.target.checked }); }}/>
          <span class="fb-box" aria-hidden="true"><${ui.Icon} name="check" size=${20}/></span>
          <span class="fb-consent-t">OK to quote you anonymously in our presentation</span>
        </label>
      </section>

      <div class="fb-foot">
        <button type="button" class="fb-hint" onClick=${jump} aria-live="polite">
          <span class="fb-dots" aria-hidden="true">${Array.apply(null, Array(total)).map(function (_, i) { return html`<i class=${i < doneN ? 'on' : ''}></i>`; })}</span>
          <span class="fb-hint-t">${hint}</span>
        </button>
        <${ui.Btn} class="fb-save" icon="check" disabled=${!ready} onClick=${save}>Save</${ui.Btn}>
      </div>
    </div>`;
  }

  function ThankYou(p) {
    var n = OA.fb.all().length;
    function fresh() { OA.resetState(); OA.nav.reset('splash'); }
    return html`<div class="screen fb fb-thanks">
      <div class="fb-thanks-art"><${ui.Art} name="give" tone="sun"/><span class="fb-thanks-badge"><${ui.Icon} name="check" size=${34}/></span></div>
      <div class="fb-thanks-txt">
        <span class="eyebrow">Saved on this phone · tester ${n}</span>
        <h1 class="h1 h1-orange">Dank je wel!</h1>
        <p class="lede">Please hand the phone back to the team.</p>
      </div>
      <div class="stack">
        <${ui.Btn} full icon="restart_alt" class="fb-fresh" onClick=${fresh}>Start fresh for the next tester</${ui.Btn}>
        <${ui.Btn} full kind="soft" icon="bar_chart" onClick=${function () { OA.nav.go('results'); }}>See results</${ui.Btn}>
      </div>
      <p class="small muted center">Starting fresh clears the demo profile for the next person. Saved feedback stays on this phone.</p>
    </div>`;
  }

  /* ---------- results: the team view ---------- */
  function Summary(p) {
    var c = p.counts, list = p.list;
    var missing = REQ.filter(function (r) { return !c[r.id]; });
    var others = ROLES.filter(function (r) { return !r.req; });
    return html`<div class="card fb-sum">
      <div class="fb-sum-top">
        <div class="fb-sum-n"><span class="fb-big">${list.length}</span><span class="fb-big-l">${list.length === 1 ? 'tester' : 'testers'}</span></div>
        <div class=${cx('fb-sum-st', !missing.length && 'ok')}>
          <${ui.Icon} name=${missing.length ? 'warning' : 'check_circle'} fill size=${20}/>
          <span>${missing.length ? 'Still needed: ' + missing.map(function (r) { return r.short; }).join(', ') : 'All three required groups tested'}</span>
        </div>
      </div>
      <div class="fb-req-h">Required groups</div>
      <div class="fb-req">${REQ.map(function (r) {
        var ok = c[r.id] > 0;
        return html`<div class=${cx('fb-req-t', ok && 'ok')} style=${'--rc:' + r.color}>
          <span class="fb-req-ic"><${ui.Icon} name=${r.icon} fill size=${18}/></span>
          <span class="fb-req-n">${c[r.id]}</span>
          <span class="fb-req-l">${r.short}</span>
          <span class="fb-req-ck"><${ui.Icon} name=${ok ? 'check_circle' : 'radio_button_unchecked'} fill=${ok} size=${18}/>${ok ? 'Tested' : 'Needed'}</span>
        </div>`;
      })}</div>
      <div class="fb-others"><span class="fb-others-h">Also</span>${others.map(function (r) {
        return html`<span class="fb-who" style=${'--rc:' + r.color}><i></i>${r.short} <b>${c[r.id]}</b></span>`;
      })}</div>
    </div>`;
  }

  function ScoreChart(p) {
    var q = p.q, list = p.list;
    var all = avg(list, q.id);
    var rows = [{ id: 'all', label: 'All testers', avg: all.avg, n: all.n, all: true }];
    ROLES.forEach(function (r) {
      var sub = list.filter(function (e) { return roleOf(e.role).id === r.id; });
      if (!sub.length) return;
      var a = avg(sub, q.id);
      rows.push({ id: r.id, label: r.short, avg: a.avg, n: a.n });
    });
    return html`<div class="fb-chart" data-q=${q.id}>
      <div class="fb-chart-t">${q.text}</div>
      <div class="fb-bars" role="table" aria-label=${'Average score: ' + q.text}>
        ${rows.map(function (r) {
          var tip = r.label + ': ' + (r.n ? fmtAvg(r.avg) + ' average from ' + plural(r.n, 'tester') : 'no ratings');
          return html`<div class=${cx('fb-br', r.all && 'all')} role="row" title=${tip}>
            <span class="fb-br-l" role="rowheader">${r.label}<small>${r.n}</small></span>
            <span class="fb-track" role="presentation"><span class="fb-fill" style=${'width:' + (r.avg / 5 * 100).toFixed(1) + '%'}></span></span>
            <span class="fb-br-v num" role="cell">${fmtAvg(r.avg)}</span>
          </div>`;
        })}
        <div class="fb-br fb-axis" aria-hidden="true"><span></span>
          <span class="fb-ticks">${[0, 1, 2, 3, 4, 5].map(function (i) { return html`<i style=${'left:' + i * 20 + '%'}>${i}</i>`; })}</span><span></span></div>
      </div>
    </div>`;
  }

  function Comments(p) {
    var list = p.list;
    return html`<div class="fb-cqs">${OPEN.map(function (o) {
      var items = list.filter(function (e) { return comment(e, o.id); });
      return html`<div class="fb-cq" key=${o.id}>
        <div class="fb-cq-h"><span class="fb-cq-t">${o.text}</span><span class="fb-cq-n">${plural(items.length, 'answer')}</span></div>
        ${items.length ? items.map(function (e) {
          var r = roleOf(e.role);
          return html`<figure class=${cx('fb-cmt', e.quoteOk && 'quote')} key=${e.id + o.id}>
            <blockquote>${comment(e, o.id)}</blockquote>
            <figcaption>
              <span class="fb-who" style=${'--rc:' + r.color}><i></i>${r.label}</span>
              <span class="fb-cmt-at">${when(e.at)}</span>
              ${e.quoteOk && html`<span class="fb-qok"><${ui.Icon} name="format_quote" fill size=${16}/>Quote OK</span>`}
            </figcaption>
          </figure>`;
        }) : html`<p class="fb-none">No answers yet.</p>`}
      </div>`;
    })}</div>`;
  }

  function Tried(p) {
    var list = p.list, agg = {}, order = [];
    list.forEach(function (e) {
      tried(e.visited).forEach(function (n) { if (!agg[n]) { agg[n] = 0; order.push(n); } agg[n]++; });
    });
    var rows = order.sort(function (a, b) { return agg[b] - agg[a] || order.indexOf(a) - order.indexOf(b); });
    if (!rows.length) return html`<p class="fb-none">No screens recorded yet. Testers rated the idea from the pitch.</p>`;
    var shown = rows.slice(0, 10);
    return html`<div class="card fb-tried-card">
      ${shown.map(function (n) {
        return html`<div class="fb-tr" key=${n}>
          <span class="fb-tr-l">${n}</span>
          <span class="fb-tr-track"><span style=${'width:' + (agg[n] / list.length * 100).toFixed(1) + '%'}></span></span>
          <span class="fb-tr-v num">${agg[n]} of ${list.length}</span>
        </div>`;
      })}
      ${rows.length > shown.length && html`<p class="fb-none">And ${rows.length - shown.length} more screens.</p>`}
    </div>`;
  }

  function Entry(p) {
    var e = p.e, r = roleOf(e.role), names = tried(e.visited);
    var hasCmt = OPEN.filter(function (o) { return comment(e, o.id); }).length;
    return html`<div class=${cx('fb-ent', p.confirming && 'confirming')} data-id=${e.id}>
      <div class="fb-ent-top">
        <span class="fb-ent-who"><span class="fb-ent-ic" style=${'--rc:' + r.color}><${ui.Icon} name=${r.icon} fill size=${18}/></span>
          <span class="fb-ent-txt"><b>${e.name || 'Anonymous'}</b><span>${r.label} · ${when(e.at)}</span></span></span>
        <button type="button" class="fb-del iconbtn" aria-label=${'Delete the entry from ' + (e.name || 'this tester')} onClick=${p.onAsk}><${ui.Icon} name="delete"/></button>
      </div>
      <div class="fb-ent-scores">${QS.map(function (q) {
        var v = rating(e, q.id);
        return html`<span class="fb-sc" title=${q.text}><b class="num">${v || '–'}</b><small>${q.short}</small></span>`;
      })}</div>
      <p class="fb-ent-meta">${hasCmt ? plural(hasCmt, 'comment') : 'No comments'} · ${e.quoteOk ? 'quote OK' : 'not for quoting'}${names.length ? ' · tried ' + names.join(', ') : ''}</p>
      ${p.confirming && html`<div class="fb-confirm" role="alertdialog" aria-label="Confirm delete">
        <span>Delete this entry? This cannot be undone.</span>
        <div class="fb-confirm-b">
          <${ui.Btn} small kind="ghost" onClick=${p.onCancel}>Cancel</${ui.Btn}>
          <${ui.Btn} small kind="dark" class="fb-danger fb-del-yes" icon="delete" onClick=${p.onDelete}>Delete</${ui.Btn}>
        </div>
      </div>`}
    </div>`;
  }

  function reportText(list) {
    var c = counts(list), L = [];
    var oldest = list[list.length - 1], newest = list[0];
    L.push('OnsAms beta: tester feedback');
    L.push('Team 5 (Residents), Regenerative Design, Hotelschool The Hague');
    L.push('Exported ' + when(new Date().toISOString()) + '. ' + plural(list.length, 'tester') +
      (list.length ? ', ' + (OA.fmt.day(oldest.at) === OA.fmt.day(newest.at) ? OA.fmt.day(oldest.at) : OA.fmt.day(oldest.at) + ' to ' + OA.fmt.day(newest.at)) : '') + '.');
    L.push('');
    L.push('WHO TESTED');
    ROLES.forEach(function (r) {
      L.push('- ' + r.label + ': ' + c[r.id] + (r.req ? (c[r.id] ? ' (required group, tested)' : ' (required group, STILL NEEDED)') : ''));
    });
    L.push('');
    L.push('AVERAGE SCORES (1 = ' + LOW.toLowerCase() + ', 5 = ' + HIGH.toLowerCase() + ')');
    QS.forEach(function (q) {
      var a = avg(list, q.id);
      L.push(q.text);
      L.push('  All testers: ' + fmtAvg(a.avg) + ' (n=' + a.n + ')');
      ROLES.forEach(function (r) {
        var sub = list.filter(function (e) { return roleOf(e.role).id === r.id; });
        if (!sub.length) return;
        var b = avg(sub, q.id);
        L.push('  ' + r.label + ': ' + fmtAvg(b.avg) + ' (n=' + b.n + ')');
      });
    });
    L.push('');
    L.push('WHAT TESTERS SAID ("quote OK" = agreed to be quoted anonymously)');
    OPEN.forEach(function (o) {
      L.push(o.text);
      var items = list.filter(function (e) { return comment(e, o.id); });
      if (!items.length) L.push('- (no answers yet)');
      items.forEach(function (e) {
        L.push('- "' + comment(e, o.id).replace(/\s*\n+\s*/g, ' / ') + '" (' + roleOf(e.role).label + ', ' + when(e.at) + (e.quoteOk ? ', quote OK' : ', not for quoting') + ')');
      });
      L.push('');
    });
    L.push('WHAT TESTERS TRIED (screens opened before giving feedback)');
    var agg = {}, order = [];
    list.forEach(function (e) { tried(e.visited).forEach(function (n) { if (!agg[n]) { agg[n] = 0; order.push(n); } agg[n]++; }); });
    order.sort(function (a, b) { return agg[b] - agg[a]; });
    if (!order.length) L.push('- (no screens recorded)');
    order.forEach(function (n) { L.push('- ' + n + ': ' + agg[n] + ' of ' + list.length); });
    L.push('');
    L.push('ALL ENTRIES (newest first; scores: understand / would use / changes where I go / trust)');
    list.forEach(function (e, i) {
      var t = tried(e.visited);
      L.push((i + 1) + '. ' + roleOf(e.role).label + (e.name ? ' (' + e.name + ')' : '') + ', ' + when(e.at) +
        ' | scores ' + QS.map(function (q) { return rating(e, q.id) || '-'; }).join(' / ') +
        ' | ' + (e.quoteOk ? 'quote OK' : 'not for quoting') + (t.length ? ' | tried: ' + t.join(', ') : ''));
    });
    return L.join('\n');
  }

  function ExportFallback(p) {
    var ref = useRef(null);
    useEffect(function () {
      var t = ref.current; if (!t) return;
      try { t.focus({ preventScroll: true }); t.select(); } catch (e) { /* selection is optional */ }
      t.scrollIntoView({ block: 'nearest' });
    }, [p.text]);
    function selectAll() { var t = ref.current; if (t) { t.focus(); t.select(); try { t.setSelectionRange(0, t.value.length); } catch (e) { /* ok */ } } }
    return html`<div class="fb-export" role="region" aria-label="Results as text">
      <div class="fb-export-h"><b>Copying is blocked here</b>
        <${ui.IconBtn} name="close" label="Hide the text" onClick=${p.onClose}/></div>
      <p class="small muted">Select the text below and copy it yourself.</p>
      <textarea ref=${ref} class="fb-export-t" readOnly=${true} rows="10" value=${p.text} aria-label="All results as plain text"
        onFocus=${function (e) { e.target.select(); }}></textarea>
      <${ui.Btn} small kind="soft" icon="select_all" onClick=${selectAll}>Select all</${ui.Btn}>
    </div>`;
  }

  function ResultsScreen() {
    OA.useStore();
    var c1 = useState(null), confirmId = c1[0], setConfirmId = c1[1];
    var c2 = useState(false), confirmAll = c2[0], setConfirmAll = c2[1];
    var c3 = useState(null), fallback = c3[0], setFallback = c3[1];
    var list = OA.fb.all().sort(byNewest);
    var give = function () { OA.nav.go('feedback'); };

    if (!list.length) {
      return html`<div class="screen fb-res">
        <${ui.Header} title="Test results" sub="Team view"/>
        <${ui.Empty} icon="forum" title="No testers yet." text="Hand the phone to someone and tap 'Give feedback'.">
          <${ui.Btn} icon="rate_review" onClick=${give}>Give feedback</${ui.Btn}>
        </${ui.Empty}>
        <p class="small muted center">Feedback is saved on this phone only. "Restart demo" keeps it.</p>
      </div>`;
    }

    var c = counts(list);
    var oldest = list[list.length - 1], newest = list[0];
    var span = OA.fmt.day(oldest.at) === OA.fmt.day(newest.at) ? OA.fmt.day(oldest.at) : OA.fmt.day(oldest.at) + ' to ' + OA.fmt.day(newest.at);

    function copyAll() {
      var text = reportText(list), settled = false;
      var fail = function () { if (settled) return; settled = true; setFallback(text); };
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return fail();
        var timer = setTimeout(fail, 1500);
        navigator.clipboard.writeText(text).then(function () {
          clearTimeout(timer);
          if (settled) return;
          settled = true; setFallback(null);
          OA.toast('Copied ' + plural(list.length, 'result') + '. Paste them into your notes', { icon: 'content_copy' });
        }, function () { clearTimeout(timer); fail(); });
      } catch (e) { fail(); }
    }
    function del(id) { OA.fb.remove(id); setConfirmId(null); OA.toast('Entry deleted', { icon: 'delete' }); }
    function clearAll() { OA.fb.clear(); setConfirmAll(false); setConfirmId(null); setFallback(null); OA.toast('All results cleared', { icon: 'delete_sweep' }); }

    return html`<div class="screen fb-res">
      <${ui.Header} title="Test results" sub=${'Team view · ' + plural(list.length, 'tester')}/>
      <div class="fb-intro">
        <span class="eyebrow">Team 5 · OnsAms beta testing</span>
        <h1 class="h1">What testers told us</h1>
        <p class="small muted">${plural(list.length, 'tester')} · ${span} · saved on this phone</p>
      </div>

      <${Summary} list=${list} counts=${c}/>

      <div class="fb-actions">
        <${ui.Btn} icon="content_copy" class="fb-copy" onClick=${copyAll}>Copy all as text</${ui.Btn}>
        <${ui.Btn} kind="soft" icon="person_add" onClick=${give}>Add a tester</${ui.Btn}>
      </div>
      ${fallback && html`<${ExportFallback} text=${fallback} onClose=${function () { setFallback(null); }}/>`}

      <${ui.Section} title="Average scores" sub=${'1 = ' + LOW.toLowerCase() + ', 5 = ' + HIGH.toLowerCase() + '. Small numbers show how many testers rated.'}>
        <div class="card fb-charts">${QS.map(function (q) { return html`<${ScoreChart} key=${q.id} q=${q} list=${list}/>`; })}</div>
      </${ui.Section}>

      <${ui.Section} title="What testers said" sub="Newest first. Quote OK means the tester agreed to be quoted anonymously.">
        <${Comments} list=${list}/>
      </${ui.Section}>

      <${ui.Section} title="What testers tried" sub="Screens each tester opened before giving feedback.">
        <${Tried} list=${list}/>
      </${ui.Section}>

      <${ui.Section} title="Every tester" sub="Scores in order: understand, would use, changes where I go, trust.">
        <div class="stack">${list.map(function (e) {
          return html`<${Entry} key=${e.id} e=${e} confirming=${confirmId === e.id}
            onAsk=${function () { setConfirmId(confirmId === e.id ? null : e.id); }}
            onCancel=${function () { setConfirmId(null); }} onDelete=${function () { del(e.id); }}/>`;
        })}</div>
      </${ui.Section}>

      <div class="fb-clearzone">
        ${confirmAll
          ? html`<div class="fb-confirm fb-confirm-all" role="alertdialog" aria-label="Confirm clear all">
              <span><b>Delete all ${plural(list.length, 'entry', 'entries')}?</b> This removes every tester's answers from this phone and cannot be undone.</span>
              <div class="fb-confirm-b">
                <${ui.Btn} small kind="ghost" onClick=${function () { setConfirmAll(false); }}>Cancel</${ui.Btn}>
                <${ui.Btn} small kind="dark" class="fb-danger fb-clear-yes" icon="delete_sweep" onClick=${clearAll}>Yes, clear all</${ui.Btn}>
              </div>
            </div>`
          : html`<${ui.Btn} kind="ghost" full class="fb-clear" icon="delete_sweep" onClick=${function () { setConfirmAll(true); }}>Clear all results</${ui.Btn}>`}
        <p class="small muted center">Saved on this phone only. "Restart demo" keeps these results.</p>
      </div>
    </div>`;
  }

  /* ---------- prompt sheet ---------- */
  function PromptSheet() {
    function go() {
      var cur = OA.nav.current();
      if (cur && cur.name === 'feedback') return OA.nav.closeSheet();
      OA.nav.go('feedback');
    }
    return html`<${ui.SheetBody}>
      <div class="fb-prompt">
        <span class="fb-prompt-ic"><${ui.Icon} name="rate_review" fill size=${28}/></span>
        <h2 class="h2">Got a minute? Help Team 5 test this</h2>
        <p class="muted">A few taps and three short, optional questions. It takes about 2 minutes, and your answers stay on this phone.</p>
        <div class="stack">
          <${ui.Btn} full icon="arrow_forward" class="fb-prompt-go" onClick=${go}>Give feedback</${ui.Btn}>
          <${ui.Btn} full kind="ghost" onClick=${OA.nav.closeSheet}>Not now</${ui.Btn}>
        </div>
      </div>
    </${ui.SheetBody}>`;
  }

  OA.feedback = {
    prompt: function () { OA.nav.sheet(function () { return html`<${PromptSheet}/>`; }, { title: 'Help Team 5 test this' }); },
    roles: ROLES,
    questions: QS,
    report: function () { return reportText(OA.fb.all().sort(byNewest)); }
  };

  OA.screen('feedback', FeedbackScreen, { tab: 'me', title: 'Give feedback' });
  OA.screen('results', ResultsScreen, { tab: 'me', title: 'Test results' });
})();

</script>
<script>/* ---- home.js ---- */
/* OnsAms beta: home module (owner: home agent). CSS prefix hm-.
   Routes: v-home (tab home), me (tab me, both roles), impact (tab me), about (tab me).
   Uses: OA.open, OA.nav.tab/go/reset, OA.points, OA.markDone, OA.loadDemo, OA.resetState,
         OA.feedback.prompt (guarded). Explore is opened with params {crowd:true} from the "Quieter right now" card.
   icons: search, star, favorite, wallet, qr_code_2, touch_app, check_circle, eco, chevron_right, groups, schedule,
          shopping_bag, volunteer_activism, add_circle, hotel, potted_plant, storefront, how_to_vote, park, autorenew,
          arrow_forward, arrow_back, arrow_upward, arrow_downward, insights, rate_review, info, swap_horiz, restart_alt,
          confirmation_number, bookmark, redeem, celebration, link, palette, refresh, map, local_florist, water_drop */
(function () {
  'use strict';
  var OA = window.OA, P = OA.h, html = P.html, ui = OA.ui, cx = OA.cx;
  var useState = P.useState;

  /* ---------- helpers ---------- */
  function D(k) { var d = OA.data && OA.data[k]; return Array.isArray(d) ? d : []; }
  function Dobj(k) { var d = OA.data && OA.data[k]; return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; }
  function fmt(n) { return OA.fmt.pts(n); }
  function nameOf(s) { return (s.name || '').trim() || (s.role === 'resident' ? 'neighbour' : 'there'); }
  function titleOf(it) { return (it && (it.name || it.title || it.text)) || ''; }
  function hour() { return new Date().getHours(); }
  function greeting() { var h = hour(); return h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 18 ? 'Good afternoon' : 'Good evening'; }
  function slotNow() { var h = hour(); return h < 12 ? 'morning' : h < 17 ? 'midday' : 'evening'; }
  function go(route, params) { return function () { OA.nav.go(route, params); }; }
  function tab(id) { return function () { OA.nav.tab(id); }; }
  function open(id) { return function () { OA.open(id); }; }
  function hoodName(id) { var h = D('neighbourhoods').filter(function (x) { return x.id === id; })[0]; return h ? h.name : ''; }
  function catOf(k) { return OA.cats[k] || OA.cats.community; }
  function openFeedbackPrompt() { if (OA.feedback && typeof OA.feedback.prompt === 'function') OA.feedback.prompt(); else OA.nav.go('feedback'); }
  /* readable ink on each category colour (community and culture are light) */
  var CAT_INK = { local: '#fff', culture: '#5A3410', community: '#6B2420', environment: '#fff' };
  var KIND = {
    earn: { icon: 'add_circle', verb: 'Earned' },
    spend: { icon: 'shopping_bag', verb: 'Spent' },
    give: { icon: 'volunteer_activism', verb: 'Gave' }
  };

  /* ---------- recommendations: places, activities and rewards matched to interests ---------- */
  var CAT_FOR = { arts: 'culture', heritage: 'culture', sights: 'culture', nature: 'environment', local: 'local', shopping: 'local', food: 'local', events: 'community', learn: 'community' };
  var KIND_FOR = {
    arts: ['art', 'gallery', 'museum', 'culture'], heritage: ['heritage', 'museum', 'history'], sights: ['sights', 'museum', 'art'],
    nature: ['nature', 'park', 'water', 'garden', 'wild', 'farm'], local: ['local', 'social'], shopping: ['shopping', 'shop', 'vintage'],
    food: ['food', 'cafe', 'drink'], events: ['social', 'event', 'events', 'music', 'festival'], learn: ['learn', 'workshop']
  };
  function score(it, ints) {
    var sc = 0, tags = Array.isArray(it.tags) ? it.tags : [];
    ints.forEach(function (i) {
      if (tags.indexOf(i) >= 0) sc += 3;
      if (it.kind && (KIND_FOR[i] || []).indexOf(it.kind) >= 0) sc += 2;
      if (CAT_FOR[i] && CAT_FOR[i] === it.cat) sc += 1;
    });
    return sc + (it.concept ? 0.5 : 0);
  }
  function recommend(s) {
    var ints = s.interests || [], done = s.done || [];
    function top(list, n, skip) {
      return list.filter(function (it) { return it && it.id && done.indexOf(it.id) < 0 && (!skip || skip.indexOf(it.id) < 0); })
        .map(function (it, i) { return { it: it, sc: score(it, ints), i: i }; })
        .sort(function (a, b) { return b.sc - a.sc || a.i - b.i; })
        .slice(0, n).map(function (x) { return x.it; });
    }
    var pl = top(D('places'), 4).map(function (it) { return { kind: 'place', it: it }; });
    var ac = top(D('activities'), 2).map(function (it) { return { kind: 'activity', it: it }; });
    // the Lobby Market has its own card further down
    var rw = top(D('rewards'), 2, ['lobby-market']).map(function (it) { return { kind: 'reward', it: it }; });
    var order = [pl[0], ac[0], rw[0], pl[1], ac[1], pl[2], rw[1], pl[3]];
    return order.filter(Boolean);
  }
  function tileFor(e) {
    var it = e.it;
    if (e.kind === 'reward') return { badge: 'Redeem', pts: it.pts, plus: false, sub: it.by ? 'by ' + it.by : it.area };
    if (e.kind === 'activity') return { badge: 'Join', pts: it.pts, sub: it.when || it.area };
    return { badge: 'Visit', pts: it.pts, sub: [it.area, it.rule].filter(Boolean).join(' · ') };
  }

  /* ---------- crowd helpers for the "Quieter right now" nudge ---------- */
  function crowdOf(p, sl) {
    var c = p.crowd;
    if (c && typeof c === 'object') c = c[sl] != null ? c[sl] : (c.midday != null ? c.midday : 0.5);
    c = Number(c);
    return isNaN(c) ? 0.5 : c;
  }

  /* ================= v-home ================= */
  function PointsCard() {
    var s = OA.useStore();
    var f = useState(false), flipped = f[0], setFlipped = f[1];
    var today = OA.points.earnedToday();
    var resident = s.role === 'resident';
    function flip() { setFlipped(!flipped); }
    function wallet() {
      var already = !!s.hmWallet;
      OA.set({ hmWallet: true });
      OA.toast(already ? 'Your card is already in your wallet (demo)' : 'Added to your phone wallet (demo)', { icon: 'wallet' });
    }
    var walletBtn = function (hidden) {
      return html`<button type="button" class="hm-wallet" tabIndex=${hidden ? -1 : 0} onClick=${wallet}>
        <${ui.Icon} name="wallet" size=${16}/>${s.hmWallet ? 'In wallet' : 'Add to wallet'}</button>`;
    };
    return html`<div class=${cx('hm-card', flipped && 'is-flipped')}>
      <div class="hm-flip">
        <div class="hm-face hm-front" aria-hidden=${flipped ? 'true' : 'false'}>
          <button type="button" class="hm-hit" tabIndex=${flipped ? -1 : 0} onClick=${flip}
            aria-label=${'Points card: ' + fmt(s.points) + ' points. Tap to show your code'}></button>
          <div class="hm-card-head"><div class="hm-card-t">Points Card</div><div class="hm-card-s">Your social points</div></div>
          <div class="hm-big num">${fmt(s.points)}</div>
          <div class="hm-card-foot">
            <span class="hm-fliphint"><${ui.Icon} name="qr_code_2" size=${16}/>Tap for your code</span>
            <span class="hm-today">${today > 0 ? '+' + fmt(today) + ' today' : 'Earn your first points today'}</span>
          </div>
          ${walletBtn(flipped)}
        </div>
        <div class="hm-face hm-back" aria-hidden=${flipped ? 'false' : 'true'}>
          <button type="button" class="hm-hit" tabIndex=${flipped ? 0 : -1} onClick=${flip} aria-label="Your OnsAms code. Tap to show your points"></button>
          <p class="hm-back-t">Show this at a partner place to earn or pay</p>
          <div class="hm-back-row">
            <${ui.QR} seed=${s.name || 'onsams'} size=${92}/>
            <div class="hm-back-id"><span class="hm-back-role">${resident ? 'Resident' : 'Visitor'}</span><span class="hm-back-name">${nameOf(s)}</span></div>
          </div>
          ${walletBtn(!flipped)}
        </div>
      </div>
    </div>`;
  }

  var ACTIONS = [
    { id: 'explore', icon: 'search', l1: 'Explore', l2: 'the city' },
    { id: 'earn', icon: 'star', l1: 'Earn', l2: 'points' },
    { id: 'use', icon: 'favorite', l1: 'Use', l2: 'points' }
  ];

  function Recommended() {
    var s = OA.useStore();
    var recs = recommend(s);
    if (!recs.length) return null;
    var ints = (s.interests || []).map(function (id) { return D('interests').filter(function (i) { return i.id === id; })[0]; }).filter(Boolean);
    var labels = ints.slice(0, 3).map(function (i) { return i.label; });
    var sub = labels.length ? 'Picked for ' + (labels.length > 1 ? labels.slice(0, -1).join(', ') + ' and ' + labels[labels.length - 1] : labels[0]).toLowerCase() : 'A mix of places, activities and treats';
    return html`<${ui.Section} title="Recommended for you" sub=${sub}>
      <${ui.Rail} class="hm-rail">${recs.map(function (e) {
        var t = tileFor(e);
        return html`<${ui.Tile} key=${e.it.id} art=${e.it.art} tone=${e.it.tone} title=${titleOf(e.it)} sub=${t.sub}
          pts=${t.pts} plus=${t.plus} badge=${t.badge} onClick=${open(e.it.id)}/>`;
      })}</${ui.Rail}>
    </${ui.Section}>`;
  }

  function Quiet() {
    var sl = slotNow();
    var places = D('places').filter(function (p) { return p && p.id; });
    if (!places.length) return null;
    var ranked = places.map(function (p) { return { p: p, c: crowdOf(p, sl) }; }).sort(function (a, b) { return a.c - b.c; });
    var calm = ranked.slice(0, 2);
    var lead = sl === 'midday' ? 'The centre is at its busiest now. These places are calm:'
      : sl === 'morning' ? 'Beat the crowds. These places are calm this morning:'
        : 'The centre fills up in the evening. These places stay calm:';
    var now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return html`<section class="hm-quiet" aria-labelledby="hm-quiet-t">
      <div class="hm-quiet-head">
        <span class="hm-quiet-ic"><${ui.Icon} name="groups" size=${22}/></span>
        <div class="hm-quiet-hd"><h2 id="hm-quiet-t" class="hm-quiet-t">Quieter right now</h2><span class="hm-quiet-now"><${ui.Icon} name="schedule" size=${14}/>Now, ${now}</span></div>
      </div>
      <p class="hm-quiet-lead">${lead}</p>
      <div class="hm-quiet-list">${calm.map(function (x) {
        var level = x.c < 0.35 ? 'Calm' : x.c < 0.6 ? 'Fairly quiet' : 'Getting busy';
        return html`<button type="button" class="hm-qrow" key=${x.p.id} onClick=${open(x.p.id)}>
          <${ui.Art} name=${x.p.art} tone=${x.p.tone} class="hm-qrow-art"/>
          <span class="hm-qrow-txt"><span class="hm-qrow-t">${titleOf(x.p)}</span>
            <span class="hm-qrow-s"><span class="hm-meter" aria-hidden="true"><i class="on"></i><i class=${x.c >= 0.35 ? 'on' : ''}></i><i class=${x.c >= 0.6 ? 'on' : ''}></i></span>${level}${x.p.area ? ' · ' + x.p.area : ''}</span></span>
          ${x.p.pts ? html`<span class="hm-qrow-pts">+${fmt(x.p.pts)}</span>` : null}
        </button>`;
      })}</div>
      <button type="button" class="hm-quiet-map" onClick=${function () { OA.nav.reset('explore', { crowd: true, layer: 'crowd', time: sl }); }}>
        <${ui.Icon} name="map" size=${18}/>Open the crowd map<${ui.Icon} name="chevron_right" size=${18}/></button>
    </section>`;
  }

  var GOOD_ICON = { environment: 'eco', local: 'storefront', community: 'volunteer_activism', culture: 'palette' };
  function GoodThing() {
    var s = OA.useStore();
    var o = useState(0), offset = o[0], setOffset = o[1];
    var j = useState(null), justDone = j[0], setJustDone = j[1];
    var list = D('goodThings').filter(function (g) { return g && g.id; });
    if (!list.length) return null;
    var day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
    var order = list.map(function (g, i) { return list[(day + i) % list.length]; });
    var rot = order.slice(offset % order.length).concat(order.slice(0, offset % order.length));
    var doneCount = list.filter(function (g) { return OA.has('done', g.id); }).length;
    var cur = justDone ? list.filter(function (g) { return g.id === justDone; })[0] : rot.filter(function (g) { return !OA.has('done', g.id); })[0];
    var isDone = cur && OA.has('done', cur.id);
    function doIt() {
      if (!cur || OA.has('done', cur.id)) return;
      OA.points.earn({ ref: cur.id, title: cur.text, pts: cur.pts || 10, cat: cur.cat || 'community', label: 'for one good thing' });
      OA.markDone(cur.id);
      setJustDone(cur.id);
    }
    function another() {
      setJustDone(null);
      var idx = order.indexOf(cur);
      setOffset(idx >= 0 ? idx + 1 : offset + 1);
    }
    var dots = html`<span class="hm-good-dots" aria-label=${doneCount + ' of ' + list.length + ' done'}>${list.map(function (g) {
      return html`<i class=${OA.has('done', g.id) ? 'on' : ''}></i>`;
    })}</span>`;
    if (!cur) {
      return html`<section class="hm-good hm-good-done" aria-label="One good thing today">
        <div class="hm-good-top"><span class="eyebrow">One good thing today</span>${dots}</div>
        <div class="hm-good-row"><span class="hm-good-ic is-done"><${ui.Icon} name="celebration" size=${26}/></span>
          <p class="hm-good-t">You did all ${list.length} good things. Dank je wel!</p></div>
      </section>`;
    }
    return html`<section class=${cx('hm-good', isDone && 'hm-good-done')} aria-label="One good thing today">
      <div class="hm-good-top"><span class="eyebrow">One good thing today</span>${dots}</div>
      <div class="hm-good-row">
        <span class=${cx('hm-good-ic', isDone && 'is-done')}><${ui.Icon} name=${isDone ? 'check_circle' : (cur.icon || GOOD_ICON[cur.cat] || 'eco')} fill=${isDone} size=${26}/></span>
        <p class="hm-good-t">${cur.text}</p>
      </div>
      ${isDone
        ? html`<div class="hm-good-act"><span class="hm-good-thanks">Dank je wel! +${fmt(cur.pts || 10)} points</span>
            ${doneCount < list.length ? html`<${ui.Btn} kind="ghost" small icon="refresh" onClick=${another}>Another one</${ui.Btn}>` : null}</div>`
        : html`<div class="hm-good-act">
            <${ui.Btn} small icon="check_circle" onClick=${doIt}>I did it · +${fmt(cur.pts || 10)}</${ui.Btn}>
            ${list.length - doneCount > 1 ? html`<button type="button" class="hm-good-skip" onClick=${another}>Show another</button>` : null}
          </div>`}
    </section>`;
  }

  function NatureEntry() {
    var n = D('nature').length;
    return html`<button type="button" class="hm-nature" onClick=${go('nature')}>
      <${ui.Art} name="heron" tone="leaf" class="hm-nature-art"/>
      <span class="hm-nature-txt">
        <${ui.Tag} kind="nature" icon="eco">Nature guide</${ui.Tag}>
        <span class="hm-nature-t">Meet the city's water, parks and wildlife</span>
        <span class="hm-nature-s">Where to go, how to visit kindly and how to help${n ? '. ' + n + (n === 1 ? ' spot' : ' spots') : ''}.</span>
      </span>
      <${ui.Icon} name="chevron_right" class="hm-chev"/>
    </button>`;
  }

  function LobbyPromo() {
    var lm = OA.find('rewards', 'lobby-market') || {};
    return html`<button type="button" class="hm-promo" onClick=${open('lobby-market')}>
      <span class="hm-promo-art"><${ui.Art} name="lobby-market" tone=${lm.tone || 'sun'}/>
        <span class="hm-promo-tag"><${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}></span></span>
      <span class="hm-promo-body">
        <span class="eyebrow">In your hotel lobby</span>
        <span class="hm-promo-t">Lobby Market</span>
        <span class="hm-promo-s">${lm.about || 'Local makers, second-hand stalls and food in the hotel lobby. Spend points at any stall.'}</span>
        <span class="hm-promo-foot"><span class="hm-promo-when"><${ui.Icon} name="schedule" size=${16}/>${lm.when || 'Sundays (pilot)'}</span>
          <span class="hm-promo-cta">See the market<${ui.Icon} name="chevron_right" size=${18}/></span></span>
      </span>
    </button>`;
  }

  function FeedbackInvite() {
    return html`<button type="button" class="hm-fb" onClick=${openFeedbackPrompt}>
      <span class="hm-fb-ic"><${ui.Icon} name="rate_review" size=${22}/></span>
      <span class="hm-fb-txt"><span class="hm-fb-t">Testing OnsAms with us?</span><span class="hm-fb-s">Tell Team 5 what works and what doesn't. It takes two minutes.</span></span>
      <${ui.Icon} name="chevron_right" class="hm-chev"/>
    </button>`;
  }

  function VHome() {
    var s = OA.useStore();
    return html`<div class="screen hm-home">
      <${ui.TopBar}/>
      <div class="hm-hello">
        <div class="hm-hello-txt"><div class="hm-hello-g">${greeting()},</div><h1 class="hm-hello-n">${nameOf(s)}</h1></div>
        <button type="button" class="hm-hello-av" onClick=${tab('me')} aria-label="Your profile"><${ui.Avatar} name=${s.name || 'You'} size=${48}/></button>
      </div>
      <${PointsCard}/>
      <section class="hm-do" aria-labelledby="hm-do-t">
        <h2 id="hm-do-t" class="sec-t">What would you like to do?</h2>
        <div class="hm-actions">${ACTIONS.map(function (a) {
          return html`<button type="button" class="hm-act" key=${a.id} onClick=${tab(a.id)} aria-label=${a.l1 + ' ' + a.l2}>
            <span class="hm-act-ic"><${ui.Icon} name=${a.icon} fill size=${34}/></span>
            <span class="hm-act-l"><b>${a.l1}</b><span>${a.l2}</span></span></button>`;
        })}</div>
      </section>
      <${Recommended}/>
      <${Quiet}/>
      <${GoodThing}/>
      <${NatureEntry}/>
      <${LobbyPromo}/>
      <${FeedbackInvite}/>
    </div>`;
  }

  /* ================= bars (impact chart, drawn to scale) ================= */
  function Bars(p) {
    var by = p.by || {}, keys = Object.keys(OA.cats), H = p.h || 128;
    var max = keys.reduce(function (m, k) { return Math.max(m, by[k] || 0); }, 0);
    var label = 'Points redirected by category: ' + keys.map(function (k) { return catOf(k).label + ' ' + fmt(by[k] || 0); }).join(', ');
    return html`<div class=${cx('hm-bars', p.mini && 'hm-bars-mini')} role="img" aria-label=${label} style=${'--hm-bar-h:' + H + 'px'}>
      ${keys.map(function (k) {
        var v = by[k] || 0, h = max && v ? Math.max(4, Math.round((v / max) * H)) : 0;
        return html`<div class="hm-bar-col" key=${k} title=${catOf(k).label + ': ' + fmt(v) + ' points'}>
          ${p.mini ? null : html`<span class="hm-bar-v num">${fmt(v)}</span>`}
          <span class=${cx('hm-bar', !v && 'is-zero')} style=${'height:' + (v ? h : 3) + 'px;' + (v ? 'background:' + catOf(k).color : '')}></span>
          ${p.mini ? null : html`<span class="hm-bar-l">${catOf(k).label}</span>`}
        </div>`;
      })}
    </div>`;
  }

  /* ================= me ================= */
  function HistoryList(p) {
    var s = OA.useStore();
    var a = useState(false), all = a[0], setAll = a[1];
    var hist = s.history || [];
    if (!hist.length) {
      return html`<div class="hm-empty card-flat"><${ui.Icon} name="star" size=${28}/><div>
        <b>No points yet</b><p class="small muted">${s.role === 'resident' ? 'Host an experience or help plant a floating garden to earn your first points.' : 'Join an activity or visit a quiet place to earn your first points.'}</p></div></div>`;
    }
    var shown = all ? hist : hist.slice(0, 5);
    /* icons: add_circle, shopping_bag, volunteer_activism */
    return html`<div class="hm-hist">
      <ul class="hm-hist-list">${shown.map(function (h) {
        var k = KIND[h.kind] || KIND.earn, c = catOf(h.cat);
        var sign = h.kind === 'earn' ? '+' : '−';
        return html`<li class="hm-h" key=${h.id}>
          <span class="hm-h-ic" style=${'background:' + c.color + ';color:' + (CAT_INK[h.cat] || '#fff')}><${ui.Icon} name=${k.icon} size=${20}/></span>
          <span class="hm-h-txt"><span class="hm-h-t">${h.title || 'Points'}</span>
            <span class="hm-h-s">${k.verb} · ${c.label} · ${OA.fmt.day(h.at)}, ${OA.fmt.time(h.at)}</span></span>
          <span class=${cx('hm-h-n num', h.kind === 'earn' ? 'is-earn' : 'is-out')}>${sign}${fmt(h.pts)}</span>
        </li>`;
      })}</ul>
      ${hist.length > 5 ? html`<button type="button" class="hm-hist-more" onClick=${function () { setAll(!all); }}>${all ? 'Show less' : 'Show all ' + hist.length}</button>` : null}
    </div>`;
  }

  function Me() {
    var s = OA.useStore();
    var c = useState(false), confirmReset = c[0], setConfirmReset = c[1];
    var resident = s.role === 'resident';
    var hood = hoodName(s.hood);
    var red = OA.points.redirected();
    var earned = (s.history || []).reduce(function (a, h) { return a + (h.kind === 'earn' ? h.pts : 0); }, 0);
    var ints = (s.interests || []).map(function (id) { return D('interests').filter(function (i) { return i.id === id; })[0]; }).filter(Boolean);
    var saved = (s.saved || []).map(function (id) { return OA.findAny(id); }).filter(Boolean);
    var booked = (s.booked || []).map(function (id) { return OA.findAny(id); }).filter(Boolean);
    var other = resident ? 'visitor' : 'resident';
    var demo = (OA.data && OA.data.demo && OA.data.demo[other]) || {};
    var otherName = demo.name || (other === 'resident' ? 'Sam' : 'Alex');
    var otherHood = hoodName(demo.hood || 'oost');
    var votes = Object.keys(s.votes || {}).filter(function (k) { return s.votes[k]; }).length;
    var hosted = (s.hosted || []).length;
    function switchRole() {
      OA.loadDemo(other);
      OA.nav.reset(OA.homeRoute());
      OA.toast('You are now viewing the ' + other + ' demo as ' + otherName, { icon: 'swap_horiz' });
    }
    function restart() { OA.resetState(); OA.nav.reset('splash'); }
    function chev() { return html`<${ui.Icon} name="chevron_right"/>`; }
    return html`<div class="screen hm-me">
      <${ui.TopBar}/>
      <div class="hm-prof">
        <span class="hm-prof-av"><${ui.Avatar} name=${s.name || 'You'} size=${84} tone=${resident ? 'leaf' : 'sun'}/></span>
        <h1 class="hm-prof-n">${(s.name || '').trim() || 'Your profile'}</h1>
        <div class="hm-prof-r"><${ui.Icon} name=${resident ? 'home' : 'luggage'} size=${16}/>${resident ? 'Resident' + (hood ? ' of ' + hood : '') : 'Visitor' + (s.hotel ? ' · staying at a partner hotel' : '')}</div>
        ${ints.length ? html`<div class="hm-prof-ints">${ints.map(function (i) { return html`<span class="hm-int" key=${i.id}>${i.label}</span>`; })}</div>` : null}
      </div>

      <div class="hm-stats">

        <div class="hm-stat"><b class="num">${fmt(earned)}</b><span>earned</span></div>
        <div class="hm-stat"><b class="num">${fmt(red.total)}</b><span>redirected</span></div>
      </div>

      <button type="button" class="hm-impcta" onClick=${go('impact')}>

          <span class="hm-impcta-s">${red.total ? 'You put ' + fmt(red.total) + ' points back into the city. See where they went and how it all connects.' : 'See what your participation supports and how it all connects.'}</span></span>
        <span class="hm-impcta-viz"><${Bars} by=${red.total ? red.by : { local: 3, culture: 2, community: 1.5, environment: 1 }} mini h=${44}/></span>
      </button>

      ${resident ? html`<${ui.Section} title="Your neighbourhood">
        <div class="stack-s">
          <${ui.Row} icon="storefront" title="Your offers" sub=${hosted ? hosted + ' live offer' + (hosted > 1 ? 's' : '') + ' for visitors' : 'Host a walk, a meal or a workshop'} right=${chev()} onClick=${tab('host')}/>
          <${ui.Row} icon="how_to_vote" title="Your fund votes" sub=${votes + ' of 3 votes used' + (hood ? ' in ' + hood : '')} right=${chev()} onClick=${tab('fund')}/>
        </div></${ui.Section}>` : null}

      ${booked.length ? html`<${ui.Section} title="Your tickets">
        <div class="stack-s">${booked.map(function (it) {
          return html`<${ui.Row} key=${it.id} art=${it.art} tone=${it.tone} title=${titleOf(it)} sub=${it.when || 'Show your ticket to check in'} right=${html`<${ui.Icon} name="confirmation_number"/>`}

      <${ui.Section} title="Points history" sub="Earned, spent and given, by category">
        <${HistoryList}/>
      </${ui.Section}>

      <${ui.Section} title="Saved" sub=${saved.length ? saved.length + ' saved' : null}>
        ${saved.length
          ? html`<div class="stack-s">${saved.map(function (it) {
              return html`<${ui.Row} key=${it.id} art=${it.art} tone=${it.tone} title=${titleOf(it)} sub=${[it.area, it.kind || it.hostKind || it.byKind].filter(Boolean).join(' · ')} right=${chev()} onClick=${open(it.id)}/>`;
            })}</div>`
          : html`<div class="hm-empty card-flat"><${ui.Icon} name="bookmark" size=${28}/><div><b>Nothing saved yet</b>
              <p class="small muted">Tap Save on a place you like and it shows up here.</p>

      </${ui.Section}>

      <${ui.Section} title="More">
        <div class="stack-s">
          <${ui.Row} icon="insights" title="See your impact" sub="Points redirected and how it all connects" right=${chev()} onClick=${go('impact')}/>
          <${ui.Row} icon="rate_review" title="Give feedback" sub="Help Team 5 test this beta" right=${chev()} onClick=${go('feedback')}/>
          <${ui.Row} icon="info" title="About this prototype" sub="OnsAms, Lobby Market and Floating gardens" right=${chev()} onClick=${go('about')}/>
          <${ui.Row} icon="swap_horiz" title=${'Switch to the ' + other + ' demo'} sub=${other === 'resident' ? 'See the app as ' + otherName + ', a resident' + (otherHood ? ' of ' + otherHood : '') : 'See the app as ' + otherName + ', a visitor'} right=${chev()} onClick=${switchRole}/>
          ${confirmReset
            ? html`<div class="hm-confirm" role="group" aria-label="Restart the demo">

  }

  /* ================= impact ================= */
  /* The loop, drawn as a clockwise track on a 2 x 4 grid: down the right side, back up the left. */
  var ACTORS = {
    hotel: { label: 'Hospitality', bg: '#6E4A7E', fg: '#fff' },
    app: { label: 'OnsAms', bg: '#F26A1F', fg: '#fff' },
    visitor: { label: 'Visitors', bg: '#FFC46B', fg: '#5A3410' },
    resident: { label: 'Residents', bg: '#3F8A57', fg: '#fff' },
    hood: { label: 'Neighbourhood', bg: '#3E7F9C', fg: '#fff' }

  var LOOP = [
    { n: 1, r: 1, c: 1, who: 'hotel', icon: 'hotel', t: 'Hotel', s: 'gives points at check-in' },
