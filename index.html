.fb-thanks-txt .lede { font-size: var(--fs-l); color: var(--ink); }

/* ---------- prompt sheet ---------- */
.fb-prompt { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.fb-prompt-ic { width: 54px; height: 54px; border-radius: 18px; background: var(--peach); color: var(--orange); display: grid; place-items: center; }
.fb-prompt .h2 { padding-right: 8px; }
.fb-prompt .stack { margin-top: 4px; gap: 8px; }

/* ---------- results ---------- */
.fb-sum { display: flex; flex-direction: column; gap: 12px; }
.fb-sum-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fb-sum-n { display: flex; align-items: baseline; gap: 8px; }
.fb-big { font: 800 3rem/0.9 var(--f-display); color: var(--orange); letter-spacing: -0.02em; }
.fb-big-l { font: 700 var(--fs-l)/1 var(--f-display); color: var(--ink); }
.fb-sum-st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); font-weight: 700; color: #8A4B00; background: #FFF0D6; padding: 7px 10px; border-radius: 99px; }
.fb-sum-st.ok { color: #2D6B41; background: #DDEFE1; }
.fb-req-h { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.fb-req { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fb-req-t { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding: 10px 10px 9px; border-radius: var(--r-m); border: 1.5px dashed var(--ink-3); background: var(--cream); }
.fb-req-t.ok { border: 1.5px solid transparent; background: var(--cream); box-shadow: inset 0 0 0 1.5px var(--line); }
.fb-req-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--rc); margin-bottom: 4px; }
.fb-req-t:not(.ok) .fb-req-ic { background: var(--line); color: var(--ink-2); }
.fb-req-n { font: 800 var(--fs-2xl)/1 var(--f-display); color: var(--ink); }
.fb-req-l { font-size: var(--fs-s); font-weight: 700; line-height: 1.2; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-req-ck { display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; font-size: var(--fs-xs); font-weight: 700; color: #2D6B41; }
.fb-req-t:not(.ok) .fb-req-ck { color: var(--ink-2); }
.fb-others { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: var(--fs-s); color: var(--ink-2); padding-top: 10px; border-top: 1px solid var(--line); }
.fb-others-h { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; }
.fb-others b { color: var(--ink); font-variant-numeric: tabular-nums; }

.fb-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.fb-actions .btn { padding-inline: 14px; }
.fb-export { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--paper); border: 1.5px solid var(--sun); border-radius: var(--r-l); padding: 12px 14px 14px; }
.fb-export-h { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px -8px -4px 0; }
.fb-export-t { width: 100%; min-height: 200px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; background: var(--cream); font: 400 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); resize: vertical; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; }
.fb-export-t:focus { outline: none; border-color: var(--orange); }

.fb-charts { display: flex; flex-direction: column; gap: 18px; padding: 16px 14px 12px; }
.fb-chart { display: flex; flex-direction: column; gap: 8px; }
.fb-chart + .fb-chart { padding-top: 16px; border-top: 1px solid var(--line); }
.fb-chart-t { font-weight: 700; line-height: 1.3; }
.fb-bars { display: flex; flex-direction: column; }
.fb-br { display: grid; grid-template-columns: 96px 1fr 30px; align-items: center; gap: 8px; }
.fb-br-l { display: flex; align-items: baseline; gap: 4px; min-width: 0; font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-br-l small { font-size: 0.7rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fb-br.all .fb-br-l { color: var(--ink); font-weight: 700; }
.fb-track { position: relative; height: 24px; background: linear-gradient(to right, var(--line) 1px, transparent 1px) 0 0 / 20% 100% repeat-x; box-shadow: inset -1px 0 0 var(--line); }
.fb-track::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--ink-3); }
.fb-fill { position: absolute; left: 0; top: 6px; height: 12px; border-radius: 0 4px 4px 0; background: var(--orange); }
.fb-br.all .fb-fill { background: var(--ink); }
.fb-br-v { font-size: var(--fs-s); font-weight: 700; color: var(--ink); text-align: right; }
.fb-axis { height: 16px; }
.fb-ticks { position: relative; height: 16px; }
.fb-ticks i { position: absolute; top: 3px; transform: translateX(-50%); font: 600 0.68rem/1 var(--f-body); font-style: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.fb-cqs { display: flex; flex-direction: column; gap: 18px; }
.fb-cq { display: flex; flex-direction: column; gap: 8px; }
.fb-cq-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.fb-cq-t { font: 700 var(--fs-m)/1.25 var(--f-display); }
.fb-cq-n { flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); }
.fb-cmt { margin: 0; background: var(--paper); border-radius: var(--r-m); box-shadow: var(--shadow-s); padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
.fb-cmt blockquote { margin: 0; font-size: var(--fs-m); line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
.fb-cmt.quote blockquote::before { content: "\201C"; }
.fb-cmt.quote blockquote::after { content: "\201D"; }
.fb-cmt figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: var(--fs-xs); color: var(--ink-2); }
.fb-cmt figcaption .fb-who { font-weight: 700; color: var(--ink); }
.fb-qok { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; padding: 3px 8px 3px 5px; border-radius: 99px; background: var(--peach); color: var(--orange-deep); font-weight: 800; }

.fb-tried-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; }
.fb-tr { display: grid; grid-template-columns: minmax(0, 116px) 1fr auto; align-items: center; gap: 10px; min-height: 26px; }
.fb-tr-l { font-size: var(--fs-s); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-tr-track { position: relative; height: 10px; border-radius: 0 4px 4px 0; background: var(--cream); box-shadow: inset 1px 0 0 var(--ink-3); }
.fb-tr-track > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--orange); }
.fb-tr-v { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); min-width: 44px; text-align: right; }

.fb-ent { background: var(--paper); border-radius: var(--r-m); box-shadow: var(--shadow-s); padding: 10px 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.fb-ent.confirming { box-shadow: 0 0 0 2px var(--danger), var(--shadow-s); }
.fb-ent-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.fb-ent-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.fb-ent-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--rc); color: #fff; flex: none; }
.fb-ent-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.fb-ent-txt b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-ent-txt span { font-size: var(--fs-xs); color: var(--ink-2); }
.fb-del { color: var(--ink-3); flex: none; }
.fb-del:hover { color: var(--danger); }
.fb-ent-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-right: 6px; }
.fb-sc { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 5px; border-radius: var(--r-s); background: var(--cream); min-width: 0; }
.fb-sc b { font: 800 var(--fs-l)/1 var(--f-display); color: var(--ink); }
.fb-sc small { font-size: 0.66rem; line-height: 1.15; color: var(--ink-2); text-align: center; }
.fb-ent-meta { font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.35; padding-right: 6px; }
.fb-confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; margin-right: 6px; border-radius: var(--r-s); background: #FBE9E7; color: var(--ink); font-size: var(--fs-s); line-height: 1.35; }
.fb-confirm-b { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.fb-confirm-all { margin: 0; border-radius: var(--r-m); padding: 14px; }
.fb-clearzone { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.fb-clear { color: var(--danger); border-color: #F2C9C5; }
.fb-res .empty .btn .ms { color: inherit; }

/* ---- home.css ---- */
/* OnsAms beta: home module styles (v-home, me, impact, about). Every class is prefixed hm-. */

/* ---------- greeting ---------- */
.hm-hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -8px; }
.hm-hello-txt { min-width: 0; }
.hm-hello-g { font: 700 var(--fs-m)/1.2 var(--f-display); color: var(--orange); }
.hm-hello-n { font: 800 var(--fs-2xl)/1.05 var(--f-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.hm-hello-av { flex: none; border: 0; background: none; padding: 0; border-radius: 99px; width: 52px; height: 52px; display: grid; place-items: center; }
.hm-hello-av .avatar { box-shadow: 0 0 0 3px #fff, var(--shadow-s); }

/* ---------- points card (flips to the QR side) ---------- */
.hm-card { position: relative; height: 204px; perspective: 1400px; }
.hm-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3, .8, .25, 1); }
.hm-card.is-flipped .hm-flip { transform: rotateY(180deg); }
.hm-face { position: absolute; inset: 0; border-radius: var(--r-l); overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  padding: 18px 18px 14px; display: flex; flex-direction: column; }
.hm-front { color: #fff; box-shadow: 0 12px 26px rgba(201, 80, 15, 0.30);
  background: radial-gradient(circle at 0% 100%, rgba(255, 196, 107, 0.30) 0 70px, rgba(255, 196, 107, 0.16) 70px 120px, transparent 120px),
              linear-gradient(140deg, #F7803A 0%, var(--orange) 45%, #E85F14 100%); }
.hm-back { background: radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.35) 0 60px, transparent 60px), var(--sun); color: var(--ink);
  transform: rotateY(180deg); box-shadow: 0 12px 26px rgba(150, 90, 10, 0.22); }
.hm-hit { position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; margin: 0; background: transparent; border-radius: inherit; }
.hm-face > :not(.hm-hit):not(.hm-wallet) { position: relative; z-index: 2; pointer-events: none; }
.hm-card:not(.is-flipped) .hm-back, .hm-card:not(.is-flipped) .hm-back *,
.hm-card.is-flipped .hm-front, .hm-card.is-flipped .hm-front * { pointer-events: none; }
.hm-wallet { position: absolute; top: 14px; right: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px;
  background: var(--ink); color: #fff; padding: 0 11px; min-height: 36px; font: 700 0.75rem/1 var(--f-body); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18); }
.hm-wallet .ms { color: var(--sun); }
.hm-wallet::before { content: ""; position: absolute; inset: -5px; }
.hm-card-head { padding-right: 120px; }
.hm-card-t { font: 800 1.25rem/1.1 var(--f-display); letter-spacing: -0.01em; }
.hm-card-s { font-size: var(--fs-xs); opacity: .88; margin-top: 2px; }
.hm-big { margin-top: auto; text-align: right; font: 800 4.1rem/0.9 var(--f-display); letter-spacing: -0.035em; text-shadow: 0 2px 10px rgba(130, 40, 0, 0.15); }
.hm-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: var(--fs-xs); }
.hm-fliphint { display: inline-flex; align-items: center; gap: 4px; opacity: .9; }
.hm-today { font-weight: 800; background: rgba(255, 255, 255, 0.2); padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.hm-back-t { font: 700 var(--fs-s)/1.3 var(--f-body); color: #5A3410; max-width: 52%; }
.hm-back-row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hm-back-row .qr { flex: none; box-shadow: var(--shadow-s); }
.hm-back-id { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; text-align: right; }
.hm-back-role { font: 800 var(--fs-m)/1.1 var(--f-display); color: var(--orange-deep); }
.hm-back-name { font: 800 1.9rem/1 var(--f-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }

/* ---------- three actions ---------- */
.hm-do { display: flex; flex-direction: column; gap: 12px; }
.hm-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hm-act { position: relative; aspect-ratio: 1 / 0.9; min-height: 92px; border: 0; border-radius: var(--r-l); background: var(--orange); color: #fff; text-align: left;
  padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 8px 18px rgba(242, 106, 31, 0.28); transition: transform .12s, background .15s; }
.hm-act:hover { background: var(--orange-deep); }
.hm-act:active { transform: scale(0.97); }
.hm-act-ic { position: absolute; top: 9px; right: 9px; color: var(--sun); line-height: 0; }
.hm-act-l { display: flex; flex-direction: column; }
.hm-act-l b { font: 800 var(--fs-m)/1.1 var(--f-display); }
.hm-act-l span { font-size: var(--fs-s); opacity: .92; }
.hm-rail { padding-bottom: 14px; }
/* workaround: base.css uses .tile-s for both the small tile size and the tile subtitle; keep the subtitle a text line */
.hm-home .tile-txt > .tile-s { width: auto; height: auto; }

/* ---------- quieter right now ---------- */
.hm-quiet { background: #E3F0F6; border-radius: var(--r-l); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.hm-quiet-head { display: flex; align-items: center; gap: 12px; }
.hm-quiet-ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--canal); color: #fff; }
.hm-quiet-hd { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hm-quiet-t { font: 700 var(--fs-l)/1.2 var(--f-display); color: #12384B; }
.hm-quiet-now { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; color: #1F5670; }
.hm-quiet-lead { font-size: var(--fs-s); color: #1F4B60; }
.hm-quiet-list { display: flex; flex-direction: column; gap: 8px; }
.hm-qrow { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: var(--paper); border-radius: var(--r-m); padding: 8px 12px 8px 8px; text-align: left; box-shadow: 0 1px 4px rgba(20, 60, 80, 0.08); }
.hm-qrow-art { width: 44px; height: 44px; flex: none; border-radius: 10px; }
.hm-qrow-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hm-qrow-t { font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-qrow-s { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--ink-2); }
.hm-qrow-pts { flex: none; font: 800 var(--fs-xs)/1 var(--f-body); color: var(--orange-deep); background: var(--peach); padding: 6px 8px; border-radius: 99px; }
.hm-meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.hm-meter i { width: 4px; border-radius: 2px; background: #C4D9E3; }
.hm-meter i:nth-child(1) { height: 5px; } .hm-meter i:nth-child(2) { height: 8px; } .hm-meter i:nth-child(3) { height: 12px; }
.hm-meter i.on { background: var(--leaf); }
.hm-quiet-map { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--canal); color: #fff; font: 700 var(--fs-s)/1 var(--f-body);
  padding: 0 12px 0 14px; min-height: 44px; border-radius: 99px; }

/* ---------- one good thing today ---------- */
.hm-good { background: #FFF1D6; border: 1.5px dashed #F2C27A; border-radius: var(--r-l); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.hm-good-done { background: #E5F2E8; border-color: #A9D2B4; border-style: solid; }
.hm-good-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hm-good-dots { display: inline-flex; gap: 4px; }
.hm-good-dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(90, 52, 16, 0.18); }
.hm-good-dots i.on { background: var(--leaf); }
.hm-good-row { display: flex; align-items: center; gap: 12px; }
.hm-good-ic { width: 46px; height: 46px; flex: none; border-radius: 99px; display: grid; place-items: center; background: var(--sun); color: #5A3410; }
.hm-good-ic.is-done { background: var(--leaf); color: #fff; }
.hm-good-t { font: 700 var(--fs-l)/1.25 var(--f-display); }
.hm-good-act { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hm-good-skip { border: 0; background: none; color: var(--orange-deep); font-weight: 700; font-size: var(--fs-s); min-height: 44px; padding: 0 4px; }
.hm-good-thanks { font-weight: 800; color: var(--leaf); }

/* ---------- nature guide entry ---------- */
.hm-nature, .hm-fb { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; text-align: left; border-radius: var(--r-l); padding: 12px 10px 12px 12px; box-shadow: var(--shadow-s); }
.hm-nature { background: #EAF4EC; }
.hm-nature-art { width: 84px; height: 84px; flex: none; border-radius: 14px; }
.hm-nature-txt, .hm-fb-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.hm-nature-t { font: 700 var(--fs-l)/1.2 var(--f-display); color: #173F25; }
.hm-nature-s { font-size: var(--fs-s); color: #3D5A45; line-height: 1.3; }
.hm-chev { color: var(--ink-3); }

/* ---------- lobby market promo ---------- */
.hm-promo { display: block; width: 100%; border: 0; padding: 0; text-align: left; border-radius: var(--r-l); overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
.hm-promo-art { display: block; position: relative; height: 150px; }
.hm-promo-art .art { position: absolute; inset: 0; border-radius: 0; }
.hm-promo-tag { position: absolute; left: 12px; top: 12px; }
.hm-promo-tag .tag { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); }
.hm-promo-body { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; }
.hm-promo-t { font: 800 var(--fs-xl)/1.1 var(--f-display); }
.hm-promo-s { font-size: var(--fs-s); color: var(--ink-2); }
.hm-promo-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.hm-promo-when { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.hm-promo-cta { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: var(--fs-s); color: var(--orange-deep); }

/* ---------- feedback invite ---------- */
.hm-fb { background: var(--paper); border: 1.5px solid var(--line); box-shadow: none; }
.hm-fb-ic { width: 44px; height: 44px; flex: none; border-radius: 12px; background: #E4DAF0; color: #4E2F63; display: grid; place-items: center; }
.hm-fb-t { font-weight: 800; }
.hm-fb-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.3; }

/* ---------- me ---------- */
.hm-prof { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding-top: 4px; }
.hm-prof-av { margin-bottom: 6px; }
.hm-prof-av .avatar { box-shadow: 0 0 0 4px #fff, var(--shadow); }
.hm-prof-n { font: 800 var(--fs-2xl)/1.1 var(--f-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.hm-prof-r { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-size: var(--fs-s); font-weight: 600; }
.hm-prof-ints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
.hm-int { font: 600 var(--fs-xs)/1 var(--f-body); background: var(--paper); border: 1px solid var(--line); color: var(--ink-2); padding: 6px 10px; border-radius: 99px; }
.hm-stats { display: grid; grid-template-columns: 1.2fr 1fr 1fr; background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); }
.hm-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 6px; min-width: 0; }
.hm-stat + .hm-stat { border-left: 1px solid var(--line); }
.hm-stat b { font: 800 var(--fs-xl)/1.1 var(--f-display); }
.hm-stat-main b { color: var(--orange); }
.hm-stat span { font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; }
.hm-impcta { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; text-align: left; color: #fff; border-radius: var(--r-l); padding: 16px;
  background: linear-gradient(135deg, var(--orange) 0%, #E2570D 100%); box-shadow: 0 8px 18px rgba(242, 106, 31, 0.3); }
.hm-impcta-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hm-impcta-t { font: 800 var(--fs-l)/1.15 var(--f-display); }
.hm-impcta-s { font-size: var(--fs-s); line-height: 1.35; opacity: .95; }
.hm-impcta-viz { flex: none; background: #fff; border-radius: 14px; padding: 10px 10px 8px; }
.hm-empty { display: flex; gap: 12px; align-items: flex-start; }
.hm-empty > .ms { color: var(--orange); margin-top: 2px; }
.hm-link { border: 0; background: none; padding: 8px 0 0; color: var(--orange-deep); font-weight: 700; font-size: var(--fs-s); min-height: 36px; }
.hm-hist { background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); overflow: hidden; }
.hm-hist-list { list-style: none; margin: 0; padding: 4px 0; }
.hm-h { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.hm-h + .hm-h { border-top: 1px solid var(--line); }
.hm-h-ic { width: 38px; height: 38px; flex: none; border-radius: 99px; display: grid; place-items: center; }
.hm-h-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hm-h-t { font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-h-s { font-size: var(--fs-xs); color: var(--ink-2); }
.hm-h-n { flex: none; font: 800 var(--fs-m)/1 var(--f-display); }
.hm-h-n.is-earn { color: var(--leaf); }
.hm-h-n.is-out { color: var(--ink); }
.hm-hist-more { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px; min-height: 44px; color: var(--orange-deep); font-weight: 700; font-size: var(--fs-s); }
.hm-confirm { background: var(--paper); border: 1.5px solid var(--orange); border-radius: var(--r-m); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.hm-confirm-b { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.hm-ver { text-align: center; font-size: var(--fs-xs); color: var(--ink-3); margin-top: -10px; }
.hm-me .row-r .ms, .hm-me .row-r { color: var(--ink-3); }

/* ---------- impact ---------- */
.hm-imp-card { background: var(--paper); border: 2.5px solid var(--orange); border-radius: var(--r-xl); padding: 20px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: var(--shadow); }
.hm-imp-l { font-size: var(--fs-m); color: var(--ink-2); }
.hm-imp-n { font: 800 4.2rem/0.95 var(--f-display); color: var(--orange); letter-spacing: -0.035em; }
.hm-imp-p { color: var(--ink-3); font-size: var(--fs-s); max-width: 30ch; }
.hm-imp-p b { color: var(--ink); }
.hm-imp-foot { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 4px; }
.hm-bars { --hm-bar-h: 128px; position: relative; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.hm-bars::after { content: ""; position: absolute; left: 0; right: 0; bottom: 24px; height: 1px; background: var(--line); }
.hm-bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: calc(var(--hm-bar-h) + 46px); }
.hm-bar-v { font: 800 var(--fs-s)/1 var(--f-body); color: var(--ink); margin-bottom: 6px; }
.hm-bar { display: block; width: 40px; max-width: 80%; border-radius: 6px 6px 0 0; background: var(--line); transition: height .6s cubic-bezier(.2, .8, .2, 1); }
.hm-bar.is-zero { background: var(--line); border-radius: 2px; }
.hm-bar-l { height: 24px; display: flex; align-items: flex-end; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.hm-bars-mini { width: 76px; gap: 4px; margin: 0; }
.hm-bars-mini::after { bottom: 0; }
.hm-bars-mini .hm-bar-col { height: var(--hm-bar-h); }
.hm-bars-mini .hm-bar { width: 12px; max-width: none; border-radius: 3px 3px 0 0; }
.hm-imp-card .btn { margin-top: 10px; }
.hm-went { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hm-went-row { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: var(--paper); border-radius: var(--r-m); padding: 12px 14px; text-align: left; box-shadow: var(--shadow-s); }
.hm-went-dot { width: 12px; height: 12px; border-radius: 99px; flex: none; }
.hm-went-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hm-went-t { font-weight: 700; line-height: 1.25; }
.hm-went-s { font-size: var(--fs-xs); color: var(--ink-2); }
.hm-went-n { font: 800 var(--fs-m)/1 var(--f-display); color: var(--ink); }
.hm-together { background: var(--orange); color: #fff; border-radius: var(--r-xl); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 22px rgba(242, 106, 31, 0.3); }
.hm-tg-t { font: 800 var(--fs-xl)/1.15 var(--f-display); }
.hm-tg-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hm-tg-stats > div { display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, 0.14); border-radius: var(--r-m); padding: 12px; }
.hm-tg-stats b { font: 800 1.5rem/1 var(--f-display); letter-spacing: -0.01em; }
.hm-tg-stats span { font-size: var(--fs-xs); line-height: 1.3; opacity: .95; }
.hm-tg-l { font-size: var(--fs-xs); opacity: .85; }

/* the loop: 2 columns x 4 rows of nodes on a clockwise track */
.hm-loop-fig { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.hm-loop { --hm-n: 118px; --hm-g: 26px; --hm-mid: 30px; position: relative; display: grid;
  grid-template-columns: 1fr var(--hm-mid) 1fr;
  grid-template-rows: var(--hm-n) var(--hm-g) var(--hm-n) var(--hm-g) var(--hm-n) var(--hm-g) var(--hm-n); }
.hm-loop-mid { grid-row: 3 / 6; grid-column: 2; align-self: center; justify-self: center; z-index: 1; width: 40px; height: 40px; border-radius: 99px;
  display: grid; place-items: center; background: var(--orange); color: #fff; box-shadow: 0 4px 10px rgba(242, 106, 31, 0.35); }
.hm-loop-arr { z-index: 2; align-self: center; justify-self: center; width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center;
  background: var(--orange); color: #fff; box-shadow: 0 0 0 3px var(--cream); }
.hm-node { position: relative; z-index: 1; min-width: 0; background: var(--paper); border-radius: 16px; box-shadow: 0 3px 10px rgba(87, 45, 14, 0.12);
  border: 1px solid var(--line); padding: 10px 10px 9px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.hm-node-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.hm-node-ic { width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center; }
.hm-node-n { font: 800 0.7rem/1 var(--f-body); color: var(--ink-3); background: var(--cream); border-radius: 99px; width: 22px; height: 22px; display: grid; place-items: center; }
.hm-node-t { font: 800 0.98rem/1.12 var(--f-display); letter-spacing: -0.01em; }
.hm-node-s { font-size: 0.74rem; line-height: 1.25; color: var(--ink-2); }
.hm-node-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
.hm-nchip { font: 700 0.68rem/1 var(--f-body); padding: 4px 6px; border-radius: 99px; background: var(--peach); color: var(--orange-deep); white-space: nowrap; }
.hm-nchip.is-concept { background: #E4DAF0; color: #4E2F63; }
.hm-loop-key { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; }
.hm-key { display: inline-flex; align-items: center; gap: 5px; }
.hm-key i { width: 10px; height: 10px; border-radius: 99px; flex: none; }
.hm-key i.hm-key-concept { background: #E4DAF0; border: 1.5px solid #4E2F63; }

/* ---------- about ---------- */
.hm-ab-hero { position: relative; height: 180px; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); }
.hm-ab-art { position: absolute; inset: 0; border-radius: 0; }
.hm-ab-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31, 26, 23, 0) 30%, rgba(31, 26, 23, 0.6) 100%); }
.hm-ab-hero-txt { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; color: #fff; }
.hm-ab-wm { font: 800 2.6rem/1 var(--f-display); letter-spacing: -0.03em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25); }
.hm-ab-tag { font-weight: 700; margin-top: 4px; }
.hm-p { color: var(--ink); line-height: 1.5; }
.hm-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hm-step { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); border-radius: var(--r-m); padding: 12px 14px; box-shadow: var(--shadow-s); }
.hm-step-ic { width: 38px; height: 38px; flex: none; border-radius: 99px; display: grid; place-items: center; background: var(--orange); color: #fff; }
.hm-step-txt { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-s); color: var(--ink-2); line-height: 1.4; }
.hm-step-txt b { font: 700 var(--fs-m)/1.2 var(--f-display); color: var(--ink); }
.hm-proto { background: var(--paper); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow-s); }
.hm-proto-art { height: 120px; border-radius: 0; }
.hm-proto-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.hm-proto-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; flex-wrap: wrap; }
.hm-proto-what { font-size: var(--fs-s); font-weight: 700; color: var(--orange-deep); margin-top: -4px; }
.hm-proto-link { display: flex; gap: 6px; align-items: flex-start; font-size: var(--fs-s); font-weight: 600; color: var(--ink); background: var(--cream); border-radius: var(--r-s); padding: 8px 10px; width: 100%; }
.hm-proto-link .ms { color: var(--orange); margin-top: 1px; }
.hm-credit { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); border-radius: var(--r-m); padding: 12px 14px; box-shadow: var(--shadow-s); }

/* narrow phones */
@media (max-width: 370px) {
  .hm-big { font-size: 3.6rem; }
  .hm-imp-n { font-size: 3.6rem; }
  .hm-loop { --hm-n: 124px; --hm-mid: 24px; }
  .hm-node { padding: 9px 8px 8px; }
  .hm-node-t { font-size: 0.92rem; }
  .hm-bar { width: 34px; }
}

/* ---- onboarding.css ---- */
/* OnsAms beta: onboarding (splash, welcome, signup, interests, intro). Owned by the onboarding agent. Prefix ob-.
   Lin's look: full-bleed orange splash, "Welkom!" over a darkened street, a white sign-up page with the orange
   wordmark, the big orange "Soooo…" headline with a chip grid, and three swipeable intro cards. */

/* ---------- full-height step pages ----------
   Scoped to the onboarding screens only: the page wrapper becomes a column so the step fills the viewport,
   and in the desktop phone frame the status bar floats over the full-bleed art (as on a real phone). */
.page:has(> .ob) { display: flex; flex-direction: column; }
.ob {
  --ob-top: env(safe-area-inset-top, 0px);
  --ob-night: #2A1E17;
  --ob-ink-soft: #BDB1A8;
  flex: 1 0 auto; position: relative; display: flex; flex-direction: column; isolation: isolate;
}
@media (min-width: 520px) {
  .ob { --ob-top: 34px; }
  .device:has(.ob) > .statusbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; background: transparent; }
  .device:has(.ob-dark) > .statusbar { color: #fff; }
}
.ob-dark { background: var(--ob-night); color: #fff; }
.ob-light { background: var(--paper); color: var(--ink); }
.ob [tabindex="-1"]:focus { outline: none; }
.ob-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.ob-mark { font: 800 1.5rem/1 var(--f-display); letter-spacing: -0.03em; color: var(--orange); margin: 0; }

/* ---------- darkened illustration backdrop ---------- */
.ob-bg { position: absolute; inset: 0; overflow: hidden; z-index: -1; background: var(--ob-night); }
.ob-bg-art {
  position: absolute; left: 0; right: 0; bottom: 0; height: 68%;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 34%); mask-image: linear-gradient(180deg, transparent 0%, #000 34%);
}
.ob-bg-art > svg { display: block; width: 100%; height: 100%; }
.ob-bg-shade {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(42, 30, 23, 0.2) 0%, rgba(42, 30, 23, 0.35) 45%, rgba(42, 30, 23, 0.55) 70%, rgba(42, 30, 23, 0.9) 100%);
}
.ob-bg-deep .ob-bg-shade { background: linear-gradient(180deg, rgba(42, 30, 23, 0.4) 0%, rgba(42, 30, 23, 0.6) 50%, rgba(42, 30, 23, 0.92) 88%); }

/* ---------- top bar of a step: back, progress, right slot ---------- */
.ob-top {
  position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
  padding: calc(var(--ob-top) + 6px) 8px 6px; background: rgba(255, 255, 255, 0.94);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.ob-top-dark { position: relative; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.ob-top-dark .ob-back { color: #fff; }
.ob-top-dark .ob-back:hover { background: rgba(255, 255, 255, 0.14); }
.ob-steps { display: flex; gap: 6px; width: 100%; max-width: 168px; justify-self: center; }
.ob-step { flex: 1; height: 5px; border-radius: 99px; background: var(--line); transition: background .25s; }
.ob-step.done { background: var(--orange); }
.ob-step.now { background: var(--orange); box-shadow: 0 0 0 2px rgba(242, 106, 31, 0.18); }
.ob-top-dark .ob-step { background: rgba(255, 255, 255, 0.28); }
.ob-top-dark .ob-step.done, .ob-top-dark .ob-step.now { background: #fff; box-shadow: none; }
.ob-top-r { display: flex; justify-content: flex-end; }
.ob-skip { border: 0; background: transparent; color: #fff; font: 700 var(--fs-m)/1 var(--f-body); min-height: 44px; padding: 0 12px; border-radius: 99px; }
.ob-skip:hover { background: rgba(255, 255, 255, 0.14); }

/* ---------- splash ---------- */
.ob-splash { background: var(--orange); align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: var(--ob-top) 24px 0; }
.ob-splash-in { display: flex; flex-direction: column; align-items: center; }
.ob-splash-mark { font-size: 3.6rem; color: #fff; animation: ob-pop .7s cubic-bezier(.2, 1.3, .4, 1) both; }
.ob-splash-tag { margin-top: 10px; font: 700 var(--fs-m)/1.2 var(--f-display); color: #fff; opacity: .92; animation: ob-rise .5s .3s ease-out both; }
.ob-splash-dots { position: absolute; left: 0; right: 0; bottom: 72px; display: flex; justify-content: center; gap: 8px; }
.ob-splash-dots span { width: 8px; height: 8px; border-radius: 99px; background: #fff; opacity: .35; animation: ob-blink 1.1s ease-in-out infinite; }
.ob-splash-dots span:nth-child(2) { animation-delay: .15s; }
.ob-splash-dots span:nth-child(3) { animation-delay: .3s; }

/* ---------- welcome ---------- */
.ob-welcome-in {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px;
  padding: calc(var(--ob-top) + clamp(36px, 9vh, 72px)) 28px calc(22px + env(safe-area-inset-bottom, 0px));
}
.ob-welcome-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: ob-rise .5s ease-out both; }
.ob-display { font: 800 3.6rem/0.95 var(--f-display); letter-spacing: -0.035em; color: #fff; }
.ob-welcome-lede { font-size: var(--fs-l); line-height: 1.4; color: rgba(255, 255, 255, 0.9); max-width: 30ch; }
.ob-roles { width: 100%; max-width: 310px; display: flex; flex-direction: column; gap: 14px; margin-top: auto; animation: ob-rise .5s .12s ease-out both; }
.ob-im { text-align: center; font-weight: 600; color: rgba(255, 255, 255, 0.9); margin-bottom: 2px; }
.ob-role { position: relative; }
.ob-role.open { z-index: 2; }
.ob-role-btn {
  width: 100%; min-height: 60px; border: 0; border-radius: 16px; background: var(--orange); color: #fff;
  font: 800 1.35rem/1 var(--f-display); letter-spacing: 0.01em; padding: 0 56px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3); transition: transform .12s, background .15s;
}
.ob-role-btn:hover { background: var(--orange-deep); }
.ob-role-btn:active { transform: scale(0.98); }
.ob-info {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0;
  border-radius: 99px; background: transparent; color: #fff; display: grid; place-items: center;
}
.ob-info .ms { font-size: 26px; }
.ob-info:hover, .ob-role.open .ob-info { background: rgba(255, 255, 255, 0.18); }
.ob-tip {
  position: absolute; z-index: 3; top: calc(100% + 12px); right: 0; width: min(280px, 100%);
  background: #fff; color: var(--ink); border-radius: 18px; padding: 14px 18px; text-align: center;
  font-size: var(--fs-m); line-height: 1.4; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32); animation: ob-tip .18s ease-out;
}
.ob-tip::before { content: ""; position: absolute; top: -7px; right: 22px; width: 16px; height: 16px; background: #fff; border-radius: 3px; transform: rotate(45deg); }
.ob-tip-up { top: auto; bottom: calc(100% + 12px); }
.ob-tip-up::before { top: auto; bottom: -7px; }
.ob-quick { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-s); color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
.ob-mark-foot { color: #fff; font-size: 1.35rem; opacity: .95; }

/* ---------- light step pages (sign-up, interests) ---------- */
.ob-form { flex: 1; display: flex; flex-direction: column; }
.ob-body { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 6px 24px 8px; }
.ob-brand { text-align: center; padding-top: 8px; }
.ob-brand-mark { font-size: 2.9rem; }
.ob-brand-tag { margin-top: 6px; font: 700 var(--fs-s)/1.2 var(--f-display); color: var(--orange); }
.ob-as {
  align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 99px;
  background: var(--peach); color: var(--orange-deep); font-size: var(--fs-s); font-weight: 600;
}
.ob-as b { font-weight: 800; }
.ob-as-x { border: 0; background: #fff; color: var(--orange-deep); font: 700 var(--fs-xs)/1 var(--f-body); border-radius: 99px; padding: 8px 12px; min-height: 32px; }
.ob-as-x:hover { background: #FFF4EC; }
.ob-field { display: flex; flex-direction: column; gap: 8px; }
.ob-label { font: 700 var(--fs-m)/1.2 var(--f-body); color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
.ob-opt { font-weight: 500; font-size: var(--fs-xs); color: var(--ink-3); }
.ob-input {
  width: 100%; min-height: 52px; border: 1.5px solid var(--ob-ink-soft); border-radius: 12px; background: #fff;
  padding: 12px 14px; font-size: 17px; color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.ob-input::placeholder { color: #A99D95; }
.ob-input:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 3px rgba(242, 106, 31, 0.18); }
.ob-help { display: flex; gap: 6px; align-items: flex-start; font-size: var(--fs-xs); line-height: 1.4; color: var(--ink-2); }
.ob-help .ms { color: var(--ink-3); margin-top: 1px; }
.ob-h { font: 700 var(--fs-l)/1.2 var(--f-display); color: var(--ink); padding: 0; }
.ob-p { font-size: var(--fs-s); line-height: 1.4; color: var(--ink-2); margin-top: 3px; }

/* hotel code */
.ob-hotel { display: flex; flex-direction: column; gap: 14px; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-l); padding: 16px; }
.ob-hotel-head { display: flex; gap: 12px; align-items: flex-start; }
.ob-hotel-ic { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--peach); color: var(--orange-deep); display: grid; place-items: center; }
.ob-codebox { position: relative; }
.ob-code { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 700; padding-right: 92px; }
.ob-code::placeholder { text-transform: none; letter-spacing: 0.02em; font-weight: 500; }
.ob-codebox.is-ok .ob-code { border-color: var(--leaf); box-shadow: 0 0 0 3px rgba(63, 138, 87, 0.16); }
.ob-codebox.is-bad .ob-code { border-color: var(--danger); }
.ob-code-ok { position: absolute; right: 50px; top: 0; bottom: 0; display: flex; align-items: center; color: var(--leaf); pointer-events: none; }
.ob-code-ok .ms { animation: ob-pop .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.ob-code-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: transparent; border-radius: 99px; color: var(--ink-2); display: grid; place-items: center; }
.ob-code-x:hover { background: rgba(31, 26, 23, 0.06); }
.ob-codemsg { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-s); line-height: 1.4; color: var(--ink-2); }
.ob-codemsg .ms { margin-top: 1px; color: var(--ink-3); }
.ob-codemsg > span:not(.ms):not(.ob-plus) { flex: 1; }
.ob-codemsg.is-ok { color: #2D6B41; font-weight: 700; }
.ob-codemsg.is-ok .ms { color: var(--leaf); }
.ob-codemsg.is-bad { color: var(--danger); }
.ob-codemsg.is-bad .ms { color: var(--danger); }
.ob-plus { flex: none; background: var(--leaf); color: #fff; font: 800 var(--fs-s)/1 var(--f-display); padding: 6px 10px; border-radius: 99px; animation: ob-pop .4s cubic-bezier(.2, 1.4, .4, 1) both; }

/* neighbourhoods */
.ob-hoods { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ob-hoods > legend { margin-bottom: 0; }
.ob-hood-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ob-hood {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 11px 14px;
  border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .15s, background .15s;
}
.ob-hood:hover { border-color: var(--ob-ink-soft); }
.ob-hood input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.ob-hood:has(input:focus-visible) { outline: 3px solid var(--sun); outline-offset: 2px; }
.ob-hood-dot { width: 22px; height: 22px; flex: none; border-radius: 99px; border: 2px solid var(--ob-ink-soft); background: #fff; transition: all .15s; }
.ob-hood.on { border-color: var(--orange); background: #FFF4EC; }
.ob-hood.on .ob-hood-dot { border-color: var(--orange); background: var(--orange); box-shadow: inset 0 0 0 4px #fff; }
.ob-hood-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ob-hood-t { font-weight: 700; line-height: 1.25; }
.ob-hood-s { font-size: var(--fs-xs); line-height: 1.35; color: var(--ink-2); }

/* sticky footer with the main action */
.ob-foot {
  position: sticky; bottom: 0; z-index: 4; display: flex; flex-direction: column; gap: 8px;
  padding: 22px 24px calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #fff 24px);
}
.ob-foot .btn { min-height: 54px; font-size: var(--fs-l); }
.ob-foot .btn:disabled { opacity: 1; background: #FBC9AA; color: #fff; }
.ob-foot-hint { text-align: center; font-size: var(--fs-s); color: var(--ink-2); min-height: 1.2em; }

/* ---------- interests ---------- */
.ob-q { font: 800 2.6rem/1.02 var(--f-display); letter-spacing: -0.03em; color: var(--orange); padding-top: 8px; }
.ob-ledes { display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-m); line-height: 1.45; color: var(--ink-2); }
.ob-chips { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.ob-chip { flex: 1 1 auto; justify-content: center; min-height: 50px; padding: 10px 14px; border-radius: 10px; font-size: var(--fs-m); transition: background .15s, border-color .15s, transform .12s; }
.ob-chip:active { transform: scale(0.97); }
.ob-chip .ms { color: var(--orange); transition: color .15s; }
.ob-chip.on .ms { color: #fff; }
.ob-chip:not(.on):hover { background: #FFF4EC; }

/* ---------- intro ---------- */
.ob-intro-in { flex: 1; display: flex; flex-direction: column; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.ob-intro-head { text-align: center; padding: 4px 28px 0; animation: ob-rise .45s ease-out both; }
.ob-intro-t { font: 800 1.85rem/1.08 var(--f-display); letter-spacing: -0.02em; color: #fff; }
.ob-intro-l { margin: 10px auto 0; max-width: 32ch; font-size: var(--fs-m); line-height: 1.45; color: rgba(255, 255, 255, 0.88); }
.ob-carousel { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.ob-track {
  position: relative; display: flex; align-items: center; gap: 14px; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  padding: 22px 9% 14px; outline: none;
}
.ob-track::-webkit-scrollbar { display: none; }
.ob-track:focus-visible { box-shadow: inset 0 0 0 3px var(--sun); border-radius: 12px; }
.ob-card {
  flex: 0 0 82%; scroll-snap-align: center; scroll-snap-stop: always; background: #fff; color: var(--ink);
  border-radius: 30px; padding: 24px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32); transition: transform .3s ease, opacity .3s ease; transform: scale(0.94); opacity: .7;
}
.ob-card.on { transform: none; opacity: 1; }
.ob-card:not(.on) { cursor: pointer; }
.ob-card-t { font: 800 1.6rem/1.1 var(--f-display); color: var(--orange); letter-spacing: -0.01em; }
.ob-card-art { width: 100%; aspect-ratio: 1 / 1; max-height: 34vh; border-radius: 20px; overflow: hidden; }
.ob-card-art > svg { display: block; width: 100%; height: 100%; }
.ob-card-p { font-size: var(--fs-m); line-height: 1.4; color: var(--ink-2); max-width: 26ch; min-height: 2.8em; }
.ob-dots { display: flex; justify-content: center; gap: 2px; padding: 2px 0 6px; }
.ob-dot { width: 32px; height: 28px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; }
.ob-dot::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.4); transition: width .25s, background .25s; }
.ob-dot.on::before { width: 24px; background: #fff; }
.ob-intro-foot { display: flex; flex-direction: column; gap: 12px; padding: 4px 24px 0; }
.ob-gift { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-s); font-weight: 600; color: rgba(255, 255, 255, 0.92); text-align: center; }
.ob-gift .ms { color: var(--sun); }
.ob-next { min-height: 56px; font-size: var(--fs-l); }

/* ---------- motion ---------- */
@keyframes ob-pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ob-rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ob-tip { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ob-blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .ob-splash-dots span { animation: none; opacity: .7; }
  .ob-card, .ob-card.on { transition: none; }
  .ob-track { scroll-behavior: auto; }
}

/* ---------- small phones ---------- */
@media (max-height: 760px) {
  .ob-display { font-size: 3.2rem; }
  .ob-welcome-in { gap: 18px; }
  .ob-intro-t { font-size: 1.6rem; }
  .ob-intro-l { font-size: var(--fs-s); }
  .ob-card { padding: 18px 18px 20px; gap: 10px; }
  .ob-card-art { aspect-ratio: 16 / 10; }
  .ob-q { font-size: 2.3rem; }
  .ob-body { gap: 16px; }
  .ob-chips { gap: 8px; }
  .ob-chip { min-height: 44px; padding-block: 8px; }
  .ob-foot { padding-top: 16px; }
}
@media (max-width: 370px) {
  .ob-body { padding-inline: 20px; }
  .ob-display { font-size: 3.1rem; }
  .ob-q { font-size: 2.2rem; }
  .ob-chip { font-size: var(--fs-s); padding: 9px 12px; }
}

/* ---- resident.css ---- */
/* OnsAms beta: the resident side. Owned by the resident agent. Every class is prefixed rs-.
   Residents get their own colour (a deep canal teal) next to Lin's orange, so the role is obvious at a glance. */
.rs {
  --rs-teal: #1E6B66;
  --rs-teal-deep: #134A46;
  --rs-mint: #D3ECE5;
  --rs-mint-soft: #EAF5F1;
  --rs-sun: #FFC46B;
}
.rs-eyebrow { color: var(--rs-teal); }
.rs-head { display: flex; flex-direction: column; gap: 6px; }
.rs-link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 8px 0; color: var(--rs-teal); font-weight: 700; font-size: var(--fs-s); align-self: flex-start; min-height: 40px; }

/* ---------- home: greeting + neighbourhood ---------- */
.rs-greet { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }
.rs-hello { font: 700 var(--fs-m)/1.2 var(--f-display); color: var(--orange); }
.rs-name { font: 800 var(--fs-2xl)/1.05 var(--f-display); letter-spacing: -0.02em; }
.rs-hoodline { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; background: var(--rs-mint-soft); color: var(--rs-teal-deep); border-radius: var(--r-m); padding: 10px 14px 10px 10px; margin-top: -8px; }
.rs-hoodline-ic { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--rs-teal); color: #fff; }
.rs-hoodline-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rs-hoodline-txt .small { color: var(--ink-2); line-height: 1.3; }

/* ---------- resident card (Lin's points card, in the resident colour; flips to a code) ---------- */
.rs-card { position: relative; display: block; width: 100%; height: 186px; border: 0; padding: 0; background: none; perspective: 1100px; text-align: left; border-radius: var(--r-l); color: inherit; }
.rs-card-in { position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
.rs-card.flipped .rs-card-in { transform: rotateY(180deg); }
.rs-face { position: absolute; inset: 0; border-radius: var(--r-l); -webkit-backface-visibility: hidden; backface-visibility: hidden; padding: 18px 20px; box-shadow: 0 10px 24px rgba(19, 74, 70, 0.28); overflow: hidden; display: flex; }
.rs-front { background: var(--rs-teal); color: #fff; flex-direction: column; justify-content: space-between;
  background-image: radial-gradient(circle at 92% 118%, rgba(255, 196, 107, 0.30) 0 70px, transparent 71px), radial-gradient(circle at 76% 135%, rgba(255, 255, 255, 0.08) 0 110px, transparent 111px); }
.rs-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rs-card-top > span:first-child { display: flex; flex-direction: column; gap: 2px; }
.rs-card-t { font: 800 var(--fs-l)/1.1 var(--f-display); }
.rs-card-s { font-size: var(--fs-xs); opacity: .85; }
.rs-card-chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.22); color: #fff; font: 700 var(--fs-xs)/1 var(--f-body); padding: 7px 10px 7px 8px; border-radius: 10px; white-space: nowrap; }
.rs-card-n { font: 800 3.6rem/0.95 var(--f-display); letter-spacing: -0.03em; text-align: right; }
.rs-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 var(--fs-xs)/1 var(--f-body); }
.rs-card-hood { display: inline-flex; align-items: center; gap: 4px; background: var(--rs-sun); color: var(--rs-teal-deep); padding: 5px 9px 5px 7px; border-radius: 99px; }
.rs-back { background: var(--rs-mint); color: var(--rs-teal-deep); transform: rotateY(180deg); align-items: center; gap: 16px; }
.rs-back .qr { flex: none; box-shadow: var(--shadow-s); }
.rs-back-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: right; flex: 1; }
.rs-back-role { font: 700 var(--fs-s)/1.1 var(--f-display); color: var(--orange-deep); }
.rs-back-name { font: 800 var(--fs-2xl)/1 var(--f-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.rs-back-hint { font-size: var(--fs-xs); line-height: 1.3; color: var(--rs-teal); }

/* ---------- home: fund summary ---------- */
.rs-fundmini { background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1.5px solid var(--rs-mint); }
.rs-fm-top { display: flex; gap: 12px; align-items: flex-start; }
.rs-fm-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rs-fm-n { font: 800 var(--fs-3xl)/1 var(--f-display); letter-spacing: -0.02em; color: var(--rs-teal-deep); margin-top: 4px; }
.rs-fm-n small, .rs-fc-n small { font-size: .42em; font-weight: 700; margin-left: 4px; letter-spacing: 0; }
.rs-fm-art { width: 84px; height: 84px; flex: none; border-radius: 18px; }
.rs-fm-lead { display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; border: 0; background: var(--rs-mint-soft); border-radius: var(--r-m); padding: 10px 12px; color: var(--ink); }
.rs-fm-lead b { font-family: var(--f-display); line-height: 1.2; }
.rs-fm-foot { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; margin-top: -4px; }

/* ---------- home: actions (Lin's orange squares) ---------- */
.rs-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rs-act { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 84px; border: 0; border-radius: var(--r-m); background: var(--orange); color: #fff; padding: 12px 14px; text-align: left; box-shadow: 0 4px 12px rgba(242, 106, 31, 0.28); }
.rs-act:active { transform: scale(0.98); }
.rs-act-ic { position: absolute; top: 10px; right: 12px; color: var(--sun); }
.rs-act-l { display: flex; flex-direction: column; line-height: 1.15; }
.rs-act-l b { font: 800 var(--fs-l)/1.1 var(--f-display); }
.rs-act-l span { font-size: var(--fs-s); opacity: .92; }

/* ---------- home: offers rail + concept cards ---------- */
.rs-addtile { flex: none; width: 120px; height: 196px; border-radius: var(--r-l); border: 2px dashed var(--rs-teal); background: var(--rs-mint-soft); color: var(--rs-teal); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; }
.rs-nooffer { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; background: var(--paper); border: 1px dashed #C9DCD6; border-radius: var(--r-l); padding: 14px; }
.rs-nooffer > .ms { color: var(--rs-teal); margin-top: 2px; }
.rs-nooffer > span { display: flex; flex-direction: column; gap: 2px; }
.rs-nooffer .btn { grid-column: 2; justify-self: start; margin-top: 6px; }
.rs-concept { display: flex; gap: 12px; width: 100%; border: 0; text-align: left; background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); padding: 10px; color: var(--ink); align-items: stretch; }
.rs-concept-art { width: 104px; flex: none; min-height: 132px; border-radius: 14px; }
.rs-concept-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 2px 4px 2px 0; align-items: flex-start; }
.rs-concept-t { font: 800 var(--fs-l)/1.15 var(--f-display); }
.rs-concept-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.35; }
.rs-concept-a { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: var(--fs-s); color: var(--orange-deep); margin-top: auto; padding-top: 2px; }

/* ---------- fund screen ---------- */
.rs-hoods { margin-top: -6px; padding-block: 2px; }
.rs-hoods .chip.on { background: var(--rs-teal); border-color: var(--rs-teal); }
.rs-banner { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; background: var(--sun); color: #4A2A0B; border-radius: var(--r-m); padding: 12px 14px; font-weight: 600; font-size: var(--fs-s); line-height: 1.35; }
.rs-banner-a { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.rs-banner .rs-link { color: #4A2A0B; text-decoration: underline; text-underline-offset: 3px; }
.rs-fundcard { background: var(--rs-teal); color: #fff; border-radius: var(--r-l); padding: 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 24px rgba(19, 74, 70, 0.25); }
.rs-fc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.rs-fc-t { display: inline-flex; align-items: center; gap: 6px; font: 700 var(--fs-s)/1.2 var(--f-display); }
.rs-fc-t .ms { color: var(--rs-sun); }
.rs-fc-days { display: inline-flex; align-items: center; gap: 4px; font: 700 var(--fs-xs)/1 var(--f-body); background: rgba(0, 0, 0, 0.2); padding: 6px 9px; border-radius: 99px; }
.rs-fc-n { font: 800 3rem/1 var(--f-display); letter-spacing: -0.03em; margin-top: 6px; }
.rs-fc-l { font-size: var(--fs-s); opacity: .88; }
.rs-fc-h { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; opacity: .8; margin-top: 10px; }
.rs-fill { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, 0.15); gap: 2px; }
.rs-fill > span { display: block; height: 100%; transition: width .5s ease; }
.rs-fill-a, .rs-key-a { background: var(--rs-sun); }
.rs-fill-b, .rs-key-b { background: #F79A62; }
.rs-fill-c, .rs-key-c { background: #fff; }
.rs-legend { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-s); }
.rs-legend li { display: flex; align-items: center; gap: 8px; }
.rs-legend li span { flex: 1; min-width: 0; opacity: .95; }
.rs-legend b { font-weight: 800; }
.rs-key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.rs-fc-note { font-size: var(--fs-xs); opacity: .7; margin-top: 4px; }

.rs-meter { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1.5px solid var(--rs-mint); border-radius: var(--r-m); padding: 10px 14px; box-shadow: var(--shadow-s); }
.rs-meter-sticky { position: sticky; top: 8px; z-index: 3; }
.rs-meter.full { border-color: var(--orange); background: #FFF3EA; }
.rs-dots { display: inline-flex; gap: 5px; flex: none; }
.rs-dot { width: 14px; height: 14px; border-radius: 99px; border: 2px solid var(--rs-teal); background: transparent; transition: background .2s; }
.rs-dot.on { background: var(--rs-teal); }
.rs-meter.full .rs-dot { border-color: var(--orange); background: var(--orange); }
.rs-meter-t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rs-meter-t b { font: 700 var(--fs-m)/1.2 var(--f-display); }
.rs-meter-t span { font-size: var(--fs-xs); color: var(--ink-2); }

.rs-prop { background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 2px solid transparent; transition: border-color .2s; }
.rs-prop.on { border-color: var(--rs-teal); }
.rs-prop-main { display: flex; gap: 12px; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); width: 100%; }
.rs-prop-artw { position: relative; flex: none; }
.rs-prop-art { width: 76px; height: 76px; border-radius: 14px; }
.rs-rank { position: absolute; top: -6px; left: -6px; width: 26px; height: 26px; border-radius: 99px; background: var(--ink); color: #fff; font: 800 var(--fs-xs)/26px var(--f-display); text-align: center; border: 2px solid var(--paper); }
.rs-prop-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; align-items: flex-start; }
.rs-prop-t { font: 700 var(--fs-l)/1.2 var(--f-display); }
.rs-prop-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rs-new { display: inline-block; font: 800 0.7rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: #fff; background: var(--orange); padding: 5px 8px; border-radius: 99px; }
.rs-prop-fund { display: flex; flex-direction: column; gap: 6px; }
.rs-prop .prog > span, .rs-sheet .prog > span { background: var(--rs-teal); }
.rs-prop-meta { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; }
.rs-prop-meta > span:last-child { white-space: nowrap; }
.rs-ok { display: inline-flex; align-items: center; gap: 4px; color: var(--rs-teal); }
.rs-prop-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.rs-votes { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: var(--fs-s); }
.rs-votes b { font: 800 var(--fs-l)/1 var(--f-display); color: var(--ink); }
.rs-vote { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 104px; min-height: 44px; padding: 8px 18px; border-radius: var(--r-m); border: 2px solid var(--rs-teal); background: var(--paper); color: var(--rs-teal); font: 800 var(--fs-m)/1 var(--f-body); transition: background .15s, color .15s; }
.rs-vote.on { background: var(--rs-teal); color: #fff; }
.rs-vote:active { transform: scale(0.97); }
.rs-readonly { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }

</head><body><div id="oa-root"></div>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script>/* ---- core.js ---- */
/* OnsAms beta: core. Owned by the lead (Claude main session). Screen modules build on this API.
   Everything hangs off window.OA. Preact + htm come from the standalone bundle (window.htmPreact). */
(function () {
  'use strict';
  var P = window.htmPreact;
  var html = P.html, useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;
  var OA = (window.OA = window.OA || {});
  OA.h = P; // html, render, useState, useEffect, useRef, useMemo, useCallback, useErrorBoundary, ...

  /* ---------- screens registry ---------- */
  OA.screens = OA.screens || {};
  // OA.screen('explore', ExploreScreen, {tab:'explore', bar:true, role:'visitor'|'resident'|'any', title:'Explore'})
  OA.screen = function (name, Comp, opts) {
    OA.screens[name] = Object.assign({ Comp: Comp, bar: true, tab: null, role: 'any', title: name }, opts || {});
  };

  /* ---------- small utils ---------- */
  OA.fmt = {
    pts: function (n) { return Math.round(n || 0).toLocaleString('nl-NL'); },
    signed: function (n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + OA.fmt.pts(Math.abs(n)); },
    time: function (iso) { try { var d = new Date(iso); return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } },
    day: function (iso) { try { var d = new Date(iso); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  };
  OA.uid = function (p) { return (p || 'id') + '-' + Math.random().toString(36).slice(2, 9); };
  OA.find = function (coll, id) { var list = (OA.data && OA.data[coll]) || []; for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; };
  OA.findAny = function (id) {
    var colls = ['places', 'activities', 'rewards', 'causes', 'nature', 'proposals'];
    for (var i = 0; i < colls.length; i++) { var x = OA.find(colls[i], id); if (x) return x; }
    var hosted = OA.get().hosted || [];
    for (var j = 0; j < hosted.length; j++) if (hosted[j] && hosted[j].id === id) return hosted[j];
    return null;
  };

  /* Open any item by id, whichever module owns its detail view. Modules register their openers:
     OA.explore.openPlace / openNature, OA.earnuse.openActivity / openReward / openCause, OA.resident.openProposal */
  OA.open = function (id) {
    var routes = [
      ['places', 'explore', 'openPlace'], ['nature', 'explore', 'openNature'], ['activities', 'earnuse', 'openActivity'],
      ['rewards', 'earnuse', 'openReward'], ['causes', 'earnuse', 'openCause'], ['proposals', 'resident', 'openProposal']
    ];
    for (var i = 0; i < routes.length; i++) {
      if (OA.find(routes[i][0], id)) {
        var mod = OA[routes[i][1]];
        if (mod && typeof mod[routes[i][2]] === 'function') return mod[routes[i][2]](id);
        return OA.toast('That part of the app is still being built', { icon: 'construction' });
      }
    }
    var hosted = (OA.get().hosted || []).filter(function (h) { return h && h.id === id; })[0];
    if (hosted && OA.earnuse && OA.earnuse.openReward) return OA.earnuse.openReward(id);
    OA.toast('Not found', { icon: 'info' });
  };

  /* Points categories, as in Lin's impact chart. */
  OA.cats = {
    local: { label: 'Local', color: 'var(--c-local)' },
    culture: { label: 'Culture', color: 'var(--c-culture)' },
    community: { label: 'Community', color: 'var(--c-community)' },
    environment: { label: 'Environment', color: 'var(--c-environment)' }
  };

  /* Illustration tones: background + ink pairs used by tiles and OA.art(). */
  OA.tones = {
    orange: { bg: '#F26A1F', fg: '#FFF4EA', soft: '#FFD9BF' },
    sun: { bg: '#FFC46B', fg: '#5A3410', soft: '#FFE7BF' },
    peach: { bg: '#FBD5BC', fg: '#7A3412', soft: '#FFEDE1' },
    canal: { bg: '#7FB2C9', fg: '#0F3346', soft: '#D6E9F1' },
    leaf: { bg: '#5E9E6E', fg: '#F2FBEF', soft: '#D3EAD3' },
    brick: { bg: '#B4513A', fg: '#FFF1E8', soft: '#F2CBBE' },
    plum: { bg: '#6E4A7E', fg: '#F7EEFB', soft: '#E3D3EA' },
    night: { bg: '#24324A', fg: '#FFE7BF', soft: '#C9D3E3' }
  };

  /* Geo: project lat/lon of central Amsterdam into a 1220 x 1000 map space (north up). */
  OA.geo = {
    box: { n: 52.395, s: 52.345, w: 4.845, e: 4.945 },
    W: 1220, H: 1000,
    project: function (lat, lon) {
      var b = OA.geo.box;
      return { x: ((lon - b.w) / (b.e - b.w)) * OA.geo.W, y: ((b.n - lat) / (b.n - b.s)) * OA.geo.H };
    }
  };

  /* ---------- storage (always wrapped: may be empty or throw in an artifact) ---------- */
  function load(key) { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* in-memory only */ } }
  OA.storage = { load: load, save: save };

  /* ---------- store ---------- */
  var KEY = 'onsams.beta.v1';
  OA.DEFAULT_STATE = {
    v: 1,
    role: null,            // 'visitor' | 'resident'
    name: '',
    interests: [],         // ids from OA.data.interests
    hood: null,            // resident neighbourhood id
    onboarded: false,
    hotel: false,          // visitor linked a partner-hotel stay
    points: 0,
    history: [],           // {id, kind:'earn'|'spend'|'give', ref, title, pts, cat, at}
    saved: [],             // saved place/activity ids
    booked: [],            // booked activity ids (ticket issued, not yet checked in)
    done: [],              // completed activity / redeemed reward ids
    given: {},             // causeId -> pts given
    votes: {},             // proposalId -> true
    hosted: [],            // resident-created offers: {id, title, about, pts, when, art, tone, at}
    rsIdeas: [],           // resident-proposed fund ideas on this device
    ratings: {},           // id -> 1..5
    chats: {},             // id -> [{from:'me'|'host', text, at}]
    visited: {}            // screen name -> count (for tester feedback context)
  };
  var state = Object.assign({}, OA.DEFAULT_STATE, load(KEY) || {});
  var subs = [];
  OA.get = function () { return state; };
  OA.set = function (patch) {
    var p = typeof patch === 'function' ? patch(state) : patch;
    state = Object.assign({}, state, p);
    save(KEY, state);
    subs.slice().forEach(function (f) { f(state); });
  };
  OA.subscribe = function (f) { subs.push(f); return function () { subs = subs.filter(function (g) { return g !== f; }); }; };
  OA.useStore = function () {
    var r = useState(0), force = r[1];
    useEffect(function () { return OA.subscribe(function () { force(function (n) { return n + 1; }); }); }, []);
    return state;
  };
  OA.resetState = function (extra) {
    state = Object.assign(JSON.parse(JSON.stringify(OA.DEFAULT_STATE)), extra || {});
    save(KEY, state);
    subs.slice().forEach(function (f) { f(state); });
  };

  /* ---------- points ledger ---------- */
  function addHistory(entry) {
    var e = Object.assign({ id: OA.uid('h'), at: new Date().toISOString() }, entry);
    return [e].concat(state.history).slice(0, 200);
  }
  OA.points = {
    // earn({ref, title, pts, cat, label}) -> adds points, shows the burst
    earn: function (o) {
      var pts = Math.max(0, Math.round(o.pts || 0));
      OA.set({ points: state.points + pts, history: addHistory({ kind: 'earn', ref: o.ref || null, title: o.title, pts: pts, cat: o.cat || 'community' }) });
      if (o.burst !== false) OA.burst(pts, o.label || 'points earned');
      return true;
    },
    // spend({ref, title, pts, cat}) -> false (and a toast) when the balance is too low
    spend: function (o) {
      var pts = Math.max(0, Math.round(o.pts || 0));
      if (pts > state.points) { OA.toast('You need ' + OA.fmt.pts(pts - state.points) + ' more points for this', { icon: 'info' }); return false; }
      OA.set({ points: state.points - pts, history: addHistory({ kind: 'spend', ref: o.ref || null, title: o.title, pts: pts, cat: o.cat || 'local' }) });
      return true;
    },
    // give({ref, title, pts, cat}) -> pools points into a cause / neighbourhood fund
    give: function (o) {
      var pts = Math.max(0, Math.round(o.pts || 0));
      if (pts > state.points) { OA.toast('You have ' + OA.fmt.pts(state.points) + ' points to give', { icon: 'info' }); return false; }
      var given = Object.assign({}, state.given); given[o.ref] = (given[o.ref] || 0) + pts;
      OA.set({ points: state.points - pts, given: given, history: addHistory({ kind: 'give', ref: o.ref || null, title: o.title, pts: pts, cat: o.cat || 'community' }) });
      return true;
    },
    // Points redirected to the city = spent locally + given.
    redirected: function () {
      var by = { local: 0, culture: 0, community: 0, environment: 0 }, total = 0;
      state.history.forEach(function (h) { if (h.kind !== 'earn') { by[h.cat] = (by[h.cat] || 0) + h.pts; total += h.pts; } });
      return { total: total, by: by };
    },
    earnedToday: function () {
      var today = new Date().toDateString(), n = 0;
      state.history.forEach(function (h) { if (h.kind === 'earn' && new Date(h.at).toDateString() === today) n += h.pts; });
      return n;
    }
  };
  OA.has = function (listName, id) { return (state[listName] || []).indexOf(id) >= 0; };
  OA.toggle = function (listName, id) {
    var list = (state[listName] || []).slice(), i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
    var p = {}; p[listName] = list; OA.set(p);
    return i < 0;
  };
  OA.markDone = function (id) { if (!OA.has('done', id)) OA.set({ done: state.done.concat([id]), booked: state.booked.filter(function (b) { return b !== id; }) }); };

  /* ---------- tester feedback store (separate key: survives "Restart demo") ---------- */
  var FKEY = 'onsams.feedback.v1';
  var feedback = load(FKEY) || [];
  OA.fb = {
    all: function () { return feedback.slice(); },
    save: function (entry) {
      var e = Object.assign({ id: OA.uid('fb'), at: new Date().toISOString(), role: state.role, visited: Object.assign({}, state.visited), points: state.points }, entry);
      feedback = feedback.concat([e]); save(FKEY, feedback); subs.slice().forEach(function (f) { f(state); }); return e;
    },
    remove: function (id) { feedback = feedback.filter(function (x) { return x.id !== id; }); save(FKEY, feedback); subs.slice().forEach(function (f) { f(state); }); },
    clear: function () { feedback = []; save(FKEY, feedback); subs.slice().forEach(function (f) { f(state); }); }
  };

  /* ---------- navigation ---------- */
  var seq = 1;
  var nav = { stack: [{ name: 'splash', params: {}, key: 1 }], dir: 'none', sheet: null, toast: null, burst: null };
  var navSubs = [];
  function emitNav() { navSubs.slice().forEach(function (f) { f(nav); }); }
  function track(name) { var v = Object.assign({}, state.visited); v[name] = (v[name] || 0) + 1; state = Object.assign({}, state, { visited: v }); save(KEY, state); }
  OA.homeRoute = function () { return state.role === 'resident' ? 'r-home' : 'v-home'; };
  OA.nav = {
    go: function (name, params) { nav.stack = nav.stack.concat([{ name: name, params: params || {}, key: ++seq }]); nav.dir = 'fwd'; nav.sheet = null; track(name); emitNav(); },
    replace: function (name, params) { nav.stack = nav.stack.slice(0, -1).concat([{ name: name, params: params || {}, key: ++seq }]); nav.dir = 'fwd'; nav.sheet = null; track(name); emitNav(); },
    back: function () {
      if (nav.sheet) { nav.sheet = null; emitNav(); return; }
      if (nav.stack.length > 1) { nav.stack = nav.stack.slice(0, -1); nav.dir = 'back'; emitNav(); }
      else OA.nav.home();
    },
    reset: function (name, params) { nav.stack = [{ name: name, params: params || {}, key: ++seq }]; nav.dir = 'none'; nav.sheet = null; track(name); emitNav(); },
    home: function () { OA.nav.reset(OA.homeRoute()); },
    tab: function (tabId) {
      var tabs = OA.tabs[state.role === 'resident' ? 'resident' : 'visitor'];
      for (var i = 0; i < tabs.length; i++) if (tabs[i].id === tabId) return OA.nav.reset(tabs[i].route);
    },
    // sheet(() => html`...`, {title}) opens a bottom sheet over the current screen
    sheet: function (render, opts) { nav.sheet = { render: render, opts: opts || {}, key: ++seq }; emitNav(); },
    closeSheet: function () { if (nav.sheet) { nav.sheet = null; emitNav(); } },
    current: function () { return nav.stack[nav.stack.length - 1]; },
    depth: function () { return nav.stack.length; },
    state: function () { return nav; }
  };
  OA.useNav = function () {
    var r = useState(0), force = r[1];
    useEffect(function () {
      var f = function () { force(function (n) { return n + 1; }); };
      navSubs.push(f);
      return function () { navSubs = navSubs.filter(function (g) { return g !== f; }); };
    }, []);
    return nav;
  };

  /* Tab bars (the centre item is the raised home button, as in Lin's design). */
  OA.tabs = {
    visitor: [
      { id: 'explore', icon: 'explore', label: 'Explore', route: 'explore' },
      { id: 'earn', icon: 'star', label: 'Earn', route: 'earn' },
      { id: 'home', icon: 'home', label: 'Home', route: 'v-home', center: true },
      { id: 'use', icon: 'favorite', label: 'Use', route: 'use' },

<script>/* ---- data.js ---- */
/* OnsAms beta: content. SEED written by the lead to fix the schema; the content agent expands and verifies it.
   Schema rules (screens rely on these field names):
   - every item has a unique id (kebab-case), across ALL collections
   - art: a name from SPEC.md "Illustration names"; tone: a key of OA.tones
   - cat: one of local | culture | community | environment (the four impact categories)
   - concept: true marks a Team 5 concept (lobby market, floating gardens), shown with a "Team 5 concept" tag
   - lat/lon: real coordinates inside OA.geo.box (52.345-52.395 N, 4.845-4.945 E)
   Optional fields added by the content agent (present on every item of that collection):
   - tags (interest ids) on places, activities, rewards and nature spots, for "Recommended for you"
   - kind on activities: art | social | shopping | local | food | nature (matches the explore chips)
   - crowd (0..1) on nature spots, like places, for the crowd layer
