<script>/* ---- earnuse.js ---- */
/* OnsAms beta: Earn and Use (earnuse module, CSS prefix eu-). Owned by the earnuse agent.
   Routes: earn (tab earn), ticket, use (tab use), chat, done. Sheets: activity, reward, cause.
   Exposes OA.earnuse = { openActivity(id), openReward(id), openCause(id) }.
   Data is read defensively: collections may be missing, ids may be unknown, fields may be absent. */
/* icons: storefront, palette, diversity_3, eco, apps, event_available, confirmation_number, star, check, check_circle,
   location_on, schedule, payments, bookmark, bookmark_add, wallet, how_to_reg, arrow_forward, favorite, volunteer_activism,
   nights_stay, home, send, lock, info, search_off, celebration, hub, chat, redeem, sync_alt, qr_code_2, bolt */
(function () {
  'use strict';
  var OA = window.OA;
  if (!OA || !OA.h || !OA.ui) return;
  var P = OA.h, html = P.html, ui = OA.ui;
  var useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;
  var cx = OA.cx;

  /* ---------- defensive data helpers ---------- */
  function list(x) { return Array.isArray(x) ? x.filter(function (i) { return i && typeof i === 'object' && i.id; }) : []; }
  function plainList(x) { return Array.isArray(x) ? x : []; }
  function obj(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }
  function coll(name) { return list(OA.data && OA.data[name]); }
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function str(x) { return x == null ? '' : String(x); }
  function byId(items, id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }
  function tone(t) { return OA.tones && OA.tones[t] ? t : 'peach'; }
  function pts(n) { return OA.fmt.pts(n); }
  function catLabel(c) { return (OA.cats && OA.cats[c] && OA.cats[c].label) || ''; }
  var CAT_ICON = { local: 'storefront', culture: 'palette', community: 'diversity_3', environment: 'eco' };

  function normActivity(a) {
    return Object.assign({}, a, {
      title: str(a.title || a.name || 'Activity'), pts: num(a.pts), tone: tone(a.tone), art: a.art || 'participate',
      helps: plainList(a.helps).map(str).filter(Boolean), host: str(a.host), hostKind: str(a.hostKind)
    });
  }
  function normReward(r, hosted) {
    var o = Object.assign({ section: 'local', cat: 'local' }, r);
    if (hosted) {
      o.host = r.host !== false;
      o.byKind = r.byKind || 'Resident host';
      o.art = r.art || 'cookies';
      o.tone = r.tone || 'sun';
      o.hostedOffer = true;
    }
    o.title = str(o.title || o.name || 'Local offer');
    o.anon = hosted && !o.by;
    o.by = str(o.by || (hosted ? 'A neighbour' : ''));
    o.pts = num(o.pts);
    o.tone = tone(o.tone);
    o.art = o.art || 'shop';
    return o;
  }
  function normCause(c) {
    return Object.assign({}, c, { title: str(c.title || c.name || 'Cause'), org: str(c.org), goal: num(c.goal), raised: num(c.raised), tone: tone(c.tone), art: c.art || 'give' });
  }
  function activities() { return coll('activities').map(normActivity); }
  function dataRewards() { return coll('rewards').map(function (r) { return normReward(r, false); }); }
  function hostedOffers() { return list(OA.get().hosted).map(function (h) { return normReward(h, true); }); }
  function causes() { return coll('causes').map(normCause); }
  function findActivity(id) { return id ? byId(activities(), id) : null; }
  function findReward(id) { return id ? (byId(dataRewards(), id) || byId(hostedOffers(), id)) : null; }
  function findCause(id) { return id ? byId(causes(), id) : null; }
  // Quiet-hour info: an explicit field if the data has one, else a narrow text match on the offer itself.
  function quietOf(r) {
    var q = r.quiet || r.quietHours || r.offPeak;
    if (q) return q;
    if (/quiet(er)? hours?|calmer|off-peak|off peak/i.test(str(r.title) + ' ' + str(r.about))) return r.when || true;
    return null;
  }
  // The name to thank: the organisation, unless the org field is a description ("Decided by Oost residents").
  function causeName(c) { return c.org && !/^(decided|run|led|chosen|voted) by\b/i.test(c.org) ? c.org : c.title; }
  function hoodName(id) { var h = byId(coll('neighbourhoods'), id); return h ? str(h.name) : ''; }
  // Area for a byline, unless it repeats the name ("Your partner hotel" + "Your hotel").
  function areaShown(r) {
    var words = str(r.by).toLowerCase().split(/\W+/).filter(function (w) { return w.length > 3; });
    return r.area && !words.some(function (w) { return str(r.area).toLowerCase().indexOf(w) >= 0; }) ? r.area : '';
  }
  // A name inside a sentence: "Your partner hotel" reads as "your partner hotel".
  function inline(n) { n = str(n); return /^Your\s/.test(n) ? 'y' + n.slice(1) : n; }
  function firstName(n) { return str(n).split(/\s+(?:\(|&)/)[0] || 'your host'; }

  function has(listName, id) { return plainList(OA.get()[listName]).indexOf(id) >= 0; }
  function addTo(listName, id) {
    var cur = plainList(OA.get()[listName]);
    if (cur.indexOf(id) < 0) { var p = {}; p[listName] = cur.concat([id]); OA.set(p); }
  }
  function markDone(id) {
    var s = OA.get();
    if (!Array.isArray(s.done) || !Array.isArray(s.booked)) OA.set({ done: plainList(s.done), booked: plainList(s.booked) });
    OA.markDone(id);
  }
  function ratingOf(id) { return num(obj(OA.get().ratings)[id]); }
  // Save a 1-5 rating; on the first rating of an item, offer the tester feedback prompt (if that module is loaded).
  function rate(id, n) {
    var first = !ratingOf(id);
    var r = Object.assign({}, obj(OA.get().ratings)); r[id] = n;
    OA.set({ ratings: r });
    if (first) {
      var at = OA.nav.current().key;
      setTimeout(function () {
        if (OA.nav.current().key === at && OA.feedback && typeof OA.feedback.prompt === 'function') OA.feedback.prompt();
      }, 1100);
    }
  }
  function totals() {
    var spent = 0, given = 0, earned = 0, actIds = activities().map(function (a) { return a.id; });
    plainList(OA.get().history).forEach(function (h) {
      if (!h) return;
      if (h.kind === 'spend') spent += num(h.pts);
      else if (h.kind === 'give') given += num(h.pts);
      else if (h.kind === 'earn' && actIds.indexOf(h.ref) >= 0) earned += num(h.pts);
    });
    return { spent: spent, given: given, earnedActs: earned };
  }
  // Short, stable code shown under QR codes.
  function code(seed) {
    var s = str(seed), h = 2166136261, abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    for (var j = 0; j < 6; j++) { out += abc[h % abc.length]; h = Math.floor(h / abc.length) || (h + 7919 * (j + 1)); }
    return 'OA-' + out.slice(0, 4) + '-' + out.slice(4);
  }
  function toRoot(route) { OA.nav.reset(route); }
  function notFound(what) { OA.toast('We couldn’t find that ' + what + '. It may have been removed.', { icon: 'info' }); }

  /* ---------- small shared pieces ---------- */
  function Meta(p) {
    var items = (p.items || []).filter(function (x) { return x && x[1]; });
    if (!items.length) return null;
    return html`<ul class="eu-meta">${items.map(function (x) {
      return html`<li><${ui.Icon} name=${x[0]}/><span>${x[1]}</span></li>`;
    })}</ul>`;
  }
  function SheetMissing(p) {
    return html`<div class="sheet-pad"><${ui.Empty} icon="search_off" title=${'This ' + (p.what || 'item') + ' is gone'} text="It may have been removed or changed. Your points are safe.">
      <${ui.Btn} kind="soft" onClick=${OA.nav.closeSheet}>Close</${ui.Btn}></${ui.Empty}></div>`;
  }
  function ScreenMissing(p) {
    return html`<div class="screen">
      <${ui.Header} title=${p.title || 'Not found'}/>
      <${ui.Empty} icon=${p.icon || 'search_off'} title=${p.heading || 'We couldn’t find that'} text=${p.text || 'It may have been removed. Your points are safe.'}>
        <${ui.Btn} kind="soft" onClick=${function () { toRoot(p.route || 'use'); }}>${p.cta || 'Back to Use points'}</${ui.Btn}>
      </${ui.Empty}></div>`;
  }

  /* =====================================================================
     EARN
     ===================================================================== */
  function actBadge(a) {
    if (has('done', a.id)) return html`<${ui.Icon} name="check" size=${14}/>Done`;
    if (has('booked', a.id)) return html`<${ui.Icon} name="confirmation_number" size=${14}/>Booked`;
    if (a.concept) return 'Concept';
    return null;
  }
  function actClass(a) {
    return cx('eu-tile', has('done', a.id) && 'eu-is-done', !has('done', a.id) && has('booked', a.id) && 'eu-is-booked', a.concept && 'eu-is-concept');
  }

  function Feature(p) {
    var a = p.a, done = has('done', a.id), booked = has('booked', a.id);
    return html`<button type="button" class="eu-feature" onClick=${function () { openActivity(a.id); }}>
      <${ui.Art} name=${a.art} tone=${a.tone} class="eu-feature-art"/>
      <span class="eu-feature-pts">${done ? html`<${ui.Icon} name="check" size=${14}/>Done` : '+' + pts(a.pts) + ' pts'}</span>
      <span class="eu-feature-body">
        <span class="eu-feature-tags"><${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>${booked && !done ? html`<${ui.Tag}>Booked</${ui.Tag}>` : ''}</span>
        <span class="eu-feature-t">${a.title}</span>
        ${a.about && html`<span class="eu-feature-s">${a.about}</span>`}
        <span class="eu-feature-meta">
          ${a.when && html`<span><${ui.Icon} name="schedule" size=${16}/>${a.when}</span>`}
          ${a.area && html`<span><${ui.Icon} name="location_on" size=${16}/>${a.area}</span>`}
        </span>
        <span class="eu-feature-go">${done ? 'See what you did' : booked ? 'Show my ticket' : 'See details'}<${ui.Icon} name="arrow_forward" size=${18}/></span>
      </span>
    </button>`;
  }

  function EarnScreen() {
    var s = OA.useStore();
    var f = useState('all'), filter = f[0], setFilter = f[1];
    var acts = activities();
    var featured = byId(acts, 'floating-gardens') || acts.filter(function (a) { return a.concept; })[0] || null;
    var cats = Object.keys(OA.cats || {}).filter(function (c) { return acts.some(function (a) { return a.cat === c; }); });

  /* =====================================================================

  function rewardBadge(r) {
    if (r.host) return html`<${ui.Icon} name="home" size=${14}/>Resident host`;
    if (r.concept) return 'Team 5 concept';
    if (quietOf(r)) return html`<${ui.Icon} name="nights_stay" size=${14}/>Quiet hours`;
    return null;
  }
  function rewardSub(r) {
    if (r.blurb) return r.blurb;
    var bits = [];
    if (r.host) bits.push('Hosted by ' + r.by); else if (r.by) bits.push(r.by);

    return bits.join(' · ');
  }
  function RewardTile(p) {
    var r = p.r;

      onClick=${function () { openReward(r.id); }}/>`;
  }
  function CauseTile(p) {
    var c = p.c, s = OA.get();

    return html`<button type="button" role="listitem" class="tile tile-m eu-ctile" onClick=${function () { openCause(c.id); }}

      <${ui.Art} name=${c.art} tone=${c.tone}/>

        <span class="eu-bar" aria-hidden="true"><span style=${'width:' + pct + '%'}></span></span>

      <span class="tile-txt"><span class="tile-t">${c.title}</span><span class="tile-sub">${c.org || c.area || ''}</span></span>
    </button>`;
  }
  function RailOrEmpty(p) {

      <div class="eu-bal">

  /* ---------- reward sheet ---------- */
  function Shortfall(p) {
    return html`<div class="eu-short" role="status">
      <${ui.Icon} name="lock"/>
      <div><b>You need ${pts(p.need)} more points.</b> Join an activity on the Earn tab to top up.</div>
    </div>`;
  }
  function RewardSheet(p) {
    var s = OA.useStore();

    if (!r) return html`<${SheetMissing} what="offer"/>`;

    var label = r.pts > 0 ? 'Redeem for ' + pts(r.pts) : 'Redeem (free)';
    function redeem() {
      if (!enough) return;
      if (r.host) { OA.nav.go('chat', { id: r.id }); return; }
      setConfirming(true);
    }
    function confirm() {
      var ok = OA.points.spend({ ref: r.id, title: r.title, pts: r.pts, cat: r.cat || 'local' });

      markDone(r.id);

    }
    return html`<${ui.SheetBody} art=${r.art} tone=${r.tone}>
      <div class="eu-tags">

            <${ui.Btn} full icon="check" class="eu-confirm-go" onClick=${confirm}>${r.pts > 0 ? 'Confirm and pay ' + pts(r.pts) : 'Confirm'}</${ui.Btn}>
            <${ui.Btn} kind="ghost" full small onClick=${function () { setConfirming(false); }}>Cancel</${ui.Btn}>
            </div>`
          : html`
            ${enough ? html`<div class="eu-balline">You have <b>${pts(bal)}</b> points · <b>${pts(bal - r.pts)}</b> left after this</div>`
              : html`<${Shortfall} need=${r.pts - bal}/>`}
            <${ui.Btn} full icon=${r.host ? 'chat' : 'redeem'} disabled=${!enough} onClick=${redeem}>${label}</${ui.Btn}>
            ${!enough && html`<${ui.Btn} kind="soft" full icon="star" onClick=${function () { toRoot('earn'); }}>Find ways to earn</${ui.Btn}>`}`}
      </div>

  /* ---------- cause sheet ---------- */
  var AMOUNTS = [50, 100, 250, 'all'];
  function CauseSheet(p) {
    var s = OA.useStore();
    var st = useState(function () { var b = num(OA.get().points); return b >= 100 || b <= 0 ? 100 : 'all'; }), amt = st[0], setAmt = st[1];
    var c = findCause(p.id);
    if (!c) return html`<${SheetMissing} what="cause"/>`;
    var bal = num(s.points);
    var mine = num(obj(s.given)[c.id]);
    var raised = c.raised + mine;
    var value = amt === 'all' ? bal : amt;
    var can = value > 0 && value <= bal;
    var name = causeName(c);
    var hood = c.hood ? hoodName(c.hood) || c.area : '';
    function give() {
      if (!can) return;
      var ok = OA.points.give({ ref: c.id, title: c.title, pts: value, cat: c.cat || 'community' });
      if (ok) OA.toast('Dank je wel! ' + pts(value) + ' points to ' + name, { icon: 'volunteer_activism' });
    }
    return html`<${ui.SheetBody} art=${c.art} tone=${c.tone}>
      <div class="eu-tags">
        <${ui.Tag} icon="volunteer_activism">Give Back</${ui.Tag}>
        ${catLabel(c.cat) && html`<${ui.Tag} icon=${CAT_ICON[c.cat]}>${catLabel(c.cat)}</${ui.Tag}>`}
        ${c.concept && html`<${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>`}

      <div class="eu-host">
        <${ui.Avatar} name=${name} tone=${c.tone} size=${48}/>

          <div class="eu-host-s">${c.org ? html`<b>${c.org}</b>` : ''}${c.org && c.area ? ' · ' : ''}${c.area || ''}</div></div>
      </div>
      ${c.about && html`<p>${c.about}</p>`}
      <div class="eu-raise">
        <div class="spread"><span class="eu-raise-n num">${pts(raised)} pts</span>
          ${c.goal > 0 && html`<span class="small muted">raised of ${pts(c.goal)}</span>`}</div>
        ${c.goal > 0 && html`<${ui.Progress} value=${raised} max=${c.goal}/>`}
        <div class="small muted">${mine ? html`You gave <b class="eu-mine">${pts(mine)}</b> points so far. Dank je wel!` : 'Your points join everyone else’s.'}</div>
      </div>
      ${hood && html`<p class="small muted">Points pooled here flow into the ${hood} neighbourhood fund. Residents vote on what it pays for.</p>`}
      <div class="eu-cta">
        <div class="eu-amt-l">How much would you like to give?</div>
        <div class="eu-amts" role="radiogroup" aria-label="Amount">
          ${AMOUNTS.map(function (n) {
            var v = n === 'all' ? bal : n, on = amt === n;
            return html`<button type="button" role="radio" aria-checked=${on ? 'true' : 'false'} class=${cx('eu-amt', on && 'on')}
              disabled=${v <= 0 || v > bal} onClick=${function () { setAmt(n); }}>
              ${n === 'all' ? 'All' : n}<small>${n === 'all' ? pts(bal) : 'pts'}</small></button>`;
          })}
        </div>
        ${bal <= 0 ? html`<${Shortfall} need=${Math.max(50, num(amt === 'all' ? 50 : amt))}/>`
          : !can ? html`<p class="small muted">You have ${pts(bal)} points. Pick a smaller amount or All.</p>` : null}
        <${ui.Btn} full icon="volunteer_activism" disabled=${!can} onClick=${give}>${can ? 'Give ' + pts(value) + ' points' : 'Give points'}</${ui.Btn}>
        ${bal <= 0 && html`<${ui.Btn} kind="soft" full icon="star" onClick=${function () { toRoot('earn'); }}>Find ways to earn</${ui.Btn}>`}
      </div>
    </${ui.SheetBody}>`;
  }
  function openCause(id) {
    var c = findCause(id);
    if (!c) return notFound('cause');
    OA.nav.sheet(function () { return html`<${CauseSheet} id=${id} key=${id}/>`; }, { title: c.title });
  }

  /* =====================================================================
     CHAT (resident-hosted offers)
     ===================================================================== */
  var SUGGESTIONS = ['Hi! Could I come by at 15:00?', 'Would tomorrow morning work?', 'Can I bring a friend along?'];
  function introFor(r) {
    if (r.intro) return str(r.intro);
    var me = r.anon ? 'Hi!' : 'Hi! I’m ' + firstName(r.by) + (r.area ? ' from ' + r.area : '') + '.';
    return me + ' Thanks for your interest in “' + r.title + '”. ' +
      (r.hostedOffer && r.about ? r.about + ' ' : '') + 'When would you like to come by?';
  }
  function replyFor(text, r) {
    var t = text.toLowerCase();
    var bake = /cookie|bake|cake|koek/.test((r.title + ' ' + r.art + ' ' + r.about).toLowerCase());
    if (/friend|partner|two of us|bring/.test(t)) return 'Of course, bring them along! There is plenty for two.';
    if (/tomorrow|morning/.test(t)) return 'Tomorrow morning works for me. Shall we say 10:30? I’ll put the kettle on.';
    if (/\d{1,2}[:.]\d{2}|\d\s?(am|pm)|o.clock/.test(t)) return 'Hey! Yes, absolutely. ' + (bake ? 'I should have a fresh batch ready by then.' : 'See you then!');
    if (/thank|great|perfect|see you/.test(t)) return 'You’re welcome! Tap confirm when you’re ready and I’ll send you the address.';
    if (/where|address/.test(t)) return 'I’ll send you the address as soon as you confirm. It’s an easy walk from the tram.';
    return 'Sounds good! Tell me a time that suits you, then tap confirm.';
  }
  function ChatScreen(p) {
    var s = OA.useStore();
    var id = p.params && p.params.id;
    if (!id) { var first = dataRewards().concat(hostedOffers()).filter(function (x) { return x.host; })[0]; if (first) id = first.id; }
    var r = findReward(id);
    var d = useState(''), draft = d[0], setDraft = d[1];
    var ty = useState(false), typing = ty[0], setTyping = ty[1];
    var mounted = useRef(true);
    var msgs = r ? plainList(obj(s.chats)[r.id]).filter(function (m) { return m && m.text; }) : [];
    useEffect(function () { mounted.current = true; return function () { mounted.current = false; }; }, []);
    useEffect(function () {
      var tm = setTimeout(function () { var v = document.getElementById('oa-viewport'); if (v) v.scrollTop = v.scrollHeight; }, 40);
      return function () { clearTimeout(tm); };
    }, [msgs.length, typing]);
    if (!r) return html`<${ScreenMissing} title="Chat" icon="chat" heading="This conversation is gone" text="The offer may have been removed. Your points are safe."/>`;

    var bal = num(s.points), enough = bal >= r.pts;
    var sent = msgs.filter(function (m) { return m.from === 'me'; }).map(function (m) { return m.text; });
    var sugs = SUGGESTIONS.filter(function (x) { return sent.indexOf(x) < 0; });
    function push(from, text) {
      var all = Object.assign({}, obj(OA.get().chats));
      all[r.id] = plainList(all[r.id]).concat([{ from: from, text: text, at: new Date().toISOString() }]);
      OA.set({ chats: all });
    }
    function send(text) {
      text = str(text).trim();
      if (!text) return;
      push('me', text);
      setDraft('');
      setTyping(true);
      setTimeout(function () {
        push('host', replyFor(text, r));
        if (mounted.current) setTyping(false);
      }, 1100);
    }
    function pay() {
      var ok = OA.points.spend({ ref: r.id, title: r.title, pts: r.pts, cat: r.cat || 'local' });
      if (!ok) return;
      markDone(r.id);
      OA.nav.replace('done', { id: r.id, paid: r.pts });
    }
    var sub = (r.byKind || 'Resident host') + (r.area ? ' · ' + r.area : '');
    return html`<div class="eu-chat eu-fill">
      <${ui.Header} title=${r.by || 'Your host'} sub=${sub} right=${html`<${ui.Avatar} name=${r.by} tone=${r.tone} size=${36}/>`}/>
      <div class="eu-chat-offer">
        <${ui.Art} name=${r.art} tone=${r.tone} class="eu-chat-art"/>
        <div class="eu-chat-offer-t"><b>${r.title}</b><span>${pts(r.pts)} points · paid when you confirm</span></div>
      </div>
      <div class="eu-msgs" aria-live="polite">
        <div class="eu-day">Today</div>
        <div class="eu-msg eu-msg-host">${introFor(r)}</div>
        ${msgs.map(function (m, i) {
          return html`<div key=${i} class=${cx('eu-msg', m.from === 'me' ? 'eu-msg-me' : 'eu-msg-host')}>${m.text}
            <span class="eu-msg-time">${OA.fmt.time(m.at)}</span></div>`;
        })}
        ${typing && html`<div class="eu-typing" aria-label=${firstName(r.by) + ' is typing'}><i></i><i></i><i></i></div>`}
        ${!typing && sugs.length > 0 && html`<div class="eu-sugs" role="group" aria-label="Suggested messages">
          <span class="eu-sugs-l">Tap to send</span>
          ${sugs.map(function (x) { return html`<button type="button" class="eu-sug" onClick=${function () { send(x); }}>${x}</button>`; })}
        </div>`}
      </div>
      <div class="eu-chat-foot">
        <form class="eu-compose" onSubmit=${function (e) { e.preventDefault(); send(draft); }}>
          <label class="eu-vh" for="eu-chat-input">Message ${r.by}</label>
          <input id="eu-chat-input" type="text" autocomplete="off" maxlength="300" placeholder=${'Message ' + firstName(r.by) + '…'}
            value=${draft} onInput=${function (e) { setDraft(e.target.value); }}/>
          <button type="submit" class="eu-send" aria-label="Send" disabled=${!draft.trim()}><${ui.Icon} name="send" fill/></button>
        </form>
        ${!enough && html`<${Shortfall} need=${r.pts - bal}/>`}
        <${ui.Btn} full icon="check" disabled=${!enough} onClick=${pay}>${r.pts > 0 ? 'Confirm and pay ' + pts(r.pts) + ' points' : 'Confirm'}</${ui.Btn}>
      </div>
    </div>`;
  }

  /* =====================================================================
     DONE (after redeeming)
     ===================================================================== */
  function DoneScreen(p) {
    var s = OA.useStore();
    var id = p.params && p.params.id;
    var r = findReward(id);
    var paid = p.params && p.params.paid != null ? num(p.params.paid) : (r ? r.pts : null);
    if (!r && paid == null) return html`<${ScreenMissing} title="All done" icon="redeem" heading="Nothing to show here" text="Redeem something on the Use tab and your receipt shows up here."/>`;
    var title = r ? r.title : 'Your reward';
    var rating = ratingOf(id);
    return html`<div class="eu-done eu-fill">
      <${ui.Header} title="" back=${function () { toRoot('use'); }}/>
      <div class="eu-done-card">
        <div class="eu-done-hero">
          <${ui.Art} name=${r ? r.art : 'give'} tone=${r ? r.tone : 'orange'}/>
          <div class="eu-done-h"><${ui.Icon} name="check_circle" fill size=${30}/>All done!</div>
        </div>
        <div class="eu-done-pay">
          <div><span>Paid</span><b class="num">${pts(paid)}</b></div>
          <div class="eu-done-r"><span>Remaining</span><b class="num">${pts(s.points)}</b></div>
        </div>
        <div class="eu-done-what">
          <div class="eu-done-t">${title}</div>
          ${r && r.host ? html`<p>${firstName(r.by)} receives your ${pts(paid)} points${r.area ? ' in ' + r.area : ''}. They will send you the address in the chat. Enjoy!</p>`
            : html`<div class="eu-voucher">
                <${ui.QR} seed=${(id || 'reward') + '-voucher'} size=${92}/>
                <div><b>Show this at ${r && r.by ? inline(r.by) : 'the counter'}</b>
                  <span class="eu-code">${code((id || 'reward') + 'v')}</span>
                  ${r && (r.when || quietOf(r)) ? html`<span class="small muted">${r.when || ('Best at quiet times: ' + quietOf(r))}</span>` : ''}</div>
              </div>`}
        </div>
      </div>
      <div class=${cx('eu-ratecard', rating && 'on')}>
        <div class="eu-ratecard-t">Rate this experience:</div>
        <${ui.Stars} value=${rating} onChange=${function (n) { rate(id || 'reward', n); }}/>
        <p class="small muted">${rating ? 'Thanks! Ratings keep every experience in OnsAms good.' : 'Your rating helps keep the quality high for everyone.'}</p>
      </div>
      <div class="stack eu-done-actions">
        <${ui.Btn} full icon="favorite" onClick=${function () { toRoot('use'); }}>Back to Use points</${ui.Btn}>
        ${OA.screens.impact && html`<${ui.Btn} kind="ghost" full icon="bolt" onClick=${function () { OA.nav.go('impact'); }}>See your impact</${ui.Btn}>`}
      </div>
    </div>`;
  }

  /* ---------- register ---------- */
  OA.screen('earn', EarnScreen, { tab: 'earn', title: 'Earn points' });
  OA.screen('ticket', TicketScreen, { bar: false, title: 'Your ticket' });
  OA.screen('use', UseScreen, { tab: 'use', title: 'Use points' });
  OA.screen('chat', ChatScreen, { bar: false, title: 'Chat with your host' });
  OA.screen('done', DoneScreen, { bar: false, title: 'All done' });
  OA.earnuse = { openActivity: openActivity, openReward: openReward, openCause: openCause };
})();

</script>

    { t: 'Keizersgracht', lat: 52.3638, lon: 4.8927, a: 12.2, k: 'water ex-lab-canal' },
    { t: 'Prinsengracht', lat: 52.36215, lon: 4.8921, a: 12.2, k: 'water ex-lab-canal' },
    { t: 'Singelgracht', lat: 52.35815, lon: 4.8945, a: 5.5, k: 'water ex-lab-canal' },

  function distKm(a, b) {

  /* ---------- place sheet ---------- */
  function onExplore() { var c = OA.nav.current(); return c && c.name === 'explore'; }
  function PlaceSheet(p) {
    OA.useStore();
    var x = OA.find('places', p.id);
    if (!x) return html`<${ui.Empty} icon="info" title="This place is not in the guide any more"/>`;
    var done = OA.has('done', x.id), saved = OA.has('saved', x.id);
    var t = nowTime(), lv = level(crowdAt(x, t));
    function checkIn() {
      if (OA.has('done', x.id)) return;
      OA.points.earn({ ref: x.id, title: 'Visited ' + x.name, pts: x.pts || 0, cat: x.cat || 'local', label: 'for visiting ' + x.name });
      OA.markDone(x.id);
    }
    function save() {
      var on = OA.toggle('saved', x.id);
      OA.toast(on ? 'Saved. Find it under Me.' : 'Removed from your saved places', { icon: on ? 'bookmark_added' : 'bookmark' });
    }
    return html`<${ui.SheetBody} art=${x.art} tone=${x.tone}>
      <div class="ex-sh-tags">
        <${ui.Tag} icon=${KIND_ICON[x.kind] || 'location_on'}>${KIND_LABEL[x.kind] || 'Place'}</${ui.Tag}>
        ${x.quiet && html`<${ui.Tag} kind="quiet" icon="schedule">Quiet: ${x.quiet}</${ui.Tag}>`}
        ${x.concept && html`<${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>`}
      </div>
      <div>
        <h2 class="h2">${x.name}</h2>
        <p class="ex-sh-meta"><${ui.Icon} name="location_on" size=${16}/>${x.area}${x.blurb ? ' · ' + x.blurb : ''}</p>
      </div>
      <div class=${'ex-now ex-now-' + lv}><${ui.Icon} name="groups" size=${18}/>
        <span><b>${LEVEL_TEXT[lv]} ${TIME_PHRASE[t]}.</b>${x.quiet ? ' Calmest: ' + x.quiet.toLowerCase() + '.' : ''}</span></div>
      <p class="ex-sh-about">${x.about || x.blurb}</p>
      <div class="ex-rule">
        <${ui.Pts} pts=${x.pts || 0} plus/>
        <span><b>Points for your visit</b><span>${x.rule || 'Check in when you are there'}</span></span>
      </div>
      ${done ? html`<div class="ex-done" role="status"><${ui.Icon} name="check_circle" fill/>
          <span><b>Checked in.</b> ${OA.fmt.pts(x.pts || 0)} points added. Dank je wel for visiting!</span></div>`
        : html`<${ui.Btn} full icon="touch_app" onClick=${checkIn}>I'm here: check in (demo)</${ui.Btn}>`}
      <div class="ex-sh-row">
        <${ui.Btn} kind=${saved ? 'dark' : 'soft'} icon=${saved ? 'bookmark_added' : 'bookmark'} iconFill=${saved} onClick=${save}>${saved ? 'Saved' : 'Save'}</${ui.Btn}>
        ${!onExplore() && html`<${ui.Btn} kind="ghost" icon="map" onClick=${function () { OA.nav.go('explore', { focus: x.id }); }}>Show on map</${ui.Btn}>`}
      </div>
      <p class="ex-fine">A real Amsterdam place, shown as an example. It is not a partner. Points are illustrative.</p>
    </${ui.SheetBody}>`;
  }
  function openPlace(id) {
    var x = OA.find('places', id);

    OA.nav.sheet(function () { return html`<${PlaceSheet} id=${id}/>`; }, { title: x.name });
  }

  /* ---------- nature sheet ---------- */
  function NatureSheet(p) {
    OA.useStore();
    var x = OA.find('nature', p.id);

    var k = NKIND[x.kind] || { one: 'Nature', icon: 'eco' }, done = OA.has('done', x.id), cur = OA.nav.current();
    function care() {
      if (OA.has('done', x.id)) return;
      OA.points.earn({ ref: x.id, title: 'Cared for ' + x.name, pts: x.pts || 0, cat: 'environment', label: 'for looking after ' + x.name });
      OA.markDone(x.id);
    }
    return html`<${ui.SheetBody} art=${x.art} tone=${x.tone}>
      <div class="ex-sh-tags">
        <${ui.Tag} kind="nature" icon=${k.icon}>${k.one}</${ui.Tag}>
        ${x.concept && html`<${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>`}

      <div>
