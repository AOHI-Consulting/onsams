  }

  /* ---------- proposal sheet ---------- */
  function ProposalSheet(props) {
    var s = OA.useStore();
    var c = useState(false), confirmRm = c[0], setConfirm = c[1];
    var p = findProposal(props.id, s);
    if (!p) return html`<div class="rs rs-sheet"><${ui.Empty} icon="info" title="This idea was removed" text="It is no longer on the list."/></div>`;
    var own = p.hood === myHood(s), voted = hasVote(s, p.id), used = usedVotes(s), cat = OA.cats[p.cat];
    var it = ranked(p.hood, s).filter(function (x) { return x.p.id === p.id; })[0] || { votes: voteCount(p, s), alloc: 0, cost: num(p.cost), rank: 1 };
    var by = p.mine ? 'you' : (p.by || 'neighbours in ' + hoodName(p.hood));
    function removeIdea() {
      if (!confirmRm) { setConfirm(true); return; }
      var st = OA.get(), votes = Object.assign({}, st.votes || {});
      delete votes[p.id];
      OA.set({ rsIdeas: ideas(st).filter(function (x) { return x.id !== p.id; }), votes: votes });
      OA.nav.closeSheet();
      OA.toast('Your idea was removed', { icon: 'delete' });
    }
    return html`<div class="rs rs-sheet"><${ui.SheetBody} art=${p.art || 'neighbourhood'} tone=${toneOk(p.tone)}>
      <div class="hstack">
        ${cat && html`<${ui.Tag}>${cat.label}</${ui.Tag}>`}
        ${p.mine && html`<span class="rs-new">New · your idea</span>`}
        <span class="rs-ranktxt">#${it.rank} in ${hoodName(p.hood)}</span>
      </div>
      <h2 class="h2">${p.title}</h2>
      ${p.about && html`<p class="muted">${p.about}</p>`}
      <div class="rs-facts">
        <div><span>Cost</span><b class="num">${pts(it.cost)}</b><small>pts</small></div>
        <div><span>Votes</span><b class="num">${it.votes}</b><small>${voted ? 'incl. yours' : 'so far'}</small></div>
        <div><span>Covered today</span><b class="num">${pts(it.alloc)}</b><small>pts</small></div>
      </div>
      <${ui.Progress} value=${it.alloc} max=${it.cost || 1}/>
      <p class="small muted">${statusLine(it)} if the vote closed today. Proposed by ${by}.</p>
      ${own
        ? html`<div class="stack">
            <${ui.Btn} full kind=${voted ? 'soft' : 'primary'} icon=${voted ? 'check' : 'how_to_vote'} class="rs-sheet-vote"
              onClick=${function () { toggleVote(p.id); }}>${voted ? 'Voted. Take my vote back' : 'Vote for this idea'}</${ui.Btn}>
            <${VoteMeter} used=${used}/>
          </div>`
        : html`<${ui.Note}>Only residents of ${hoodName(p.hood)} vote on this idea. You vote in ${hoodName(myHood(s))}.</${ui.Note}>`}
      ${p.mine && html`<button type="button" class=${cx('rs-rm', confirmRm && 'on')} onClick=${removeIdea}>
        <${ui.Icon} name="delete" size=${18}/>${confirmRm ? 'Tap again to remove your idea' : 'Remove my idea'}</button>`}
    </${ui.SheetBody}></div>`;
  }
  function openProposal(id) {
    var p = findProposal(id, OA.get());
    if (!p) { OA.toast('That idea is no longer on the list', { icon: 'info' }); return; }
    OA.nav.sheet(function () { return html`<${ProposalSheet} id=${id}/>`; }, { title: p.title });
  }

  /* ---------- propose an idea (sheet with a short form) ---------- */
  var IDEA_KINDS = [
    { id: 'environment', label: 'Green', icon: 'eco', art: 'garden', tone: 'leaf' },
    { id: 'community', label: 'Community', icon: 'groups', art: 'neighbourhood', tone: 'sun' },
    { id: 'local', label: 'Local life', icon: 'storefront', art: 'market', tone: 'peach' },
    { id: 'culture', label: 'Culture', icon: 'palette', art: 'music', tone: 'plum' }
  ];
  var IDEA_COSTS = [500, 1000, 2500, 5000];
  function ProposeSheet(props) {
    var s = OA.useStore(), hood = myHood(s);
    var a = useState(''), title = a[0], setTitle = a[1];
    var b = useState(''), about = b[0], setAbout = b[1];
    var c = useState(1000), cost = c[0], setCost = c[1];
    var d = useState('community'), kind = d[0], setKind = d[1];
    function submit() {
      var t = title.trim();
      if (t.length < 3) { OA.toast('Give your idea a short title first', { icon: 'info' }); var el = document.getElementById('rs-idea-title'); if (el) el.focus(); return; }
      var st = OA.get(), k = IDEA_KINDS.filter(function (x) { return x.id === kind; })[0] || IDEA_KINDS[1];
      var idea = { id: OA.uid('idea'), hood: hood, title: t, about: about.trim(), cost: cost, votes: 0, cat: k.id, art: k.art, tone: k.tone, mine: true, by: st.name || 'you', at: new Date().toISOString() };
      var votes = Object.assign({}, st.votes || {}), used = usedVotes(st);
      if (used < MAX_VOTES) votes[idea.id] = true;
      OA.set({ rsIdeas: ideas(st).concat([idea]), votes: votes });
      OA.nav.closeSheet();
      if (props.onDone) props.onDone(idea);
      OA.toast(used < MAX_VOTES ? 'Your idea is in, with your vote. Neighbours can back it now' : 'Your idea is in. Take back a vote to support it yourself', { icon: 'lightbulb', ms: 3200 });
    }
    return html`<div class="rs rs-sheet rs-propose"><${ui.SheetBody} art="vote" tone="sun">
      <div class="eyebrow rs-eyebrow">Propose an idea for ${hoodName(hood)}</div>
      <h2 class="h2">What should the fund pay for?</h2>
      <${ui.Field} id="rs-idea-title" label="Your idea" value=${title} max=${70} placeholder="A bench by the playground" onInput=${setTitle}/>
      <${ui.Field} id="rs-idea-about" label="How it helps the neighbourhood (optional)" multiline rows=${3} max=${240} value=${about}
        placeholder="Older neighbours have nowhere to sit on the way to the market." onInput=${setAbout}/>
      <div class="field"><span class="field-l">Rough cost</span>
        <div class="chips" role="radiogroup" aria-label="Rough cost">${IDEA_COSTS.map(function (n) {
          return html`<${ui.Chip} key=${n} on=${cost === n} onClick=${function () { setCost(n); }}>${pts(n)} pts</${ui.Chip}>`;
        })}</div></div>
      <div class="field"><span class="field-l">Kind of idea</span>
        <div class="chips" role="radiogroup" aria-label="Kind of idea">${IDEA_KINDS.map(function (k) {
          return html`<${ui.Chip} key=${k.id} on=${kind === k.id} icon=${k.icon} onClick=${function () { setKind(k.id); }}>${k.label}</${ui.Chip}>`;
        })}</div></div>
      <${ui.Btn} full icon="lightbulb" onClick=${submit}>Add my idea</${ui.Btn}>
      <p class="small muted center">Your idea stays on this device in this beta. Your first vote goes to it, if you have one left.</p>
    </${ui.SheetBody}></div>`;
  }
  function openPropose(onDone) {
    OA.nav.sheet(function () { return html`<${ProposeSheet} onDone=${onDone}/>`; }, { title: 'Propose an idea' });
  }

  /* ---------- fund screen ---------- */
  function FundScreen(props) {
    var s = OA.useStore(), params = props.params || {}, mine = myHood(s);
    var v = useState(params.hood || mine), view = v[0], setView = v[1];
    var own = view === mine, name = hoodName(view), chipsRef = P.useRef(null);
    useEffect(function () {
      var row = chipsRef.current, on = row && row.querySelector('.chip.on');
      if (on && row.scrollTo) row.scrollTo({ left: Math.max(0, on.offsetLeft - row.offsetLeft - 18), behavior: 'smooth' });
    }, [view]);
    var f = fundFor(view, s), items = ranked(view, s), used = usedVotes(s);
    function propose() { openPropose(function () { setView(myHood(OA.get())); }); }
    return html`<div class="screen rs rs-fund">
      <${ui.TopBar}/>
      <div class="rs-head">
        <div class="eyebrow rs-eyebrow">Neighbourhood fund</div>
        <h1 class="h1">${own ? 'You decide what ' + name + ' gets' : 'Looking around ' + name}</h1>
        <p class="lede">${own ? 'Visitors pool points here every month. Residents of ' + name + ' vote on what they pay for.' : 'See what neighbours in ' + name + ' want their fund to pay for.'}</p>
      </div>
      <div class="chips-scroll rs-hoods" role="group" aria-label="Choose a neighbourhood" ref=${chipsRef}>${hoodChoices(s).map(function (h) {
        return html`<${ui.Chip} key=${h.id} on=${h.id === view} icon=${h.id === mine ? 'home' : null} onClick=${function () { setView(h.id); }}>${h.name || cap(h.id)}</${ui.Chip}>`;
      })}</div>
      ${!own && html`<div class="rs-banner" role="status">
        <${ui.Icon} name="travel_explore"/>
        <span>You are looking around. Only ${name} residents vote here.</span>
        <div class="rs-banner-a">
          <${ui.Btn} small kind="dark" onClick=${function () { setView(mine); }}>Back to ${hoodName(mine)}</${ui.Btn}>
          <button type="button" class="rs-link" onClick=${function () { moveTo(view); }}>I live in ${name}</button>
        </div>
      </div>`}
      <${FundCard} f=${f} hood=${view}/>
      <div class="rs-votezone">
      ${own && items.length > 0 && html`<${VoteMeter} used=${used} class="rs-meter-sticky"/>`}
      <${ui.Section} title=${'Ideas in ' + name} sub=${items.length ? 'Sorted by votes. Bars show what the fund would pay if the vote closed today.' : null}>
        ${items.length
          ? html`<div class="stack rs-props">${items.map(function (it) { return html`<${PropCard} key=${it.p.id} it=${it} own=${own} s=${s}/>`; })}</div>`
          : own
            ? html`<div class="card-flat"><${ui.Empty} icon="lightbulb" title=${'No ideas yet in ' + name}
                text="Be the first. What would make your street better? A bench, a repair café, a mural?">
                <${ui.Btn} icon="lightbulb" onClick=${propose}>Propose an idea</${ui.Btn}></${ui.Empty}></div>`
            : html`<div class="card-flat"><${ui.Empty} icon="lightbulb" title=${'No ideas yet in ' + name}
                text=${'Neighbours in ' + name + ' have not proposed anything this month. Live here? Propose the first idea.'}>
                <${ui.Btn} icon="lightbulb" onClick=${function () { moveTo(view); propose(); }}>Propose an idea</${ui.Btn}></${ui.Empty}></div>`}
      </${ui.Section}>
      </div>
      ${own && items.length > 0 && html`<div class="rs-propose-cta">
        <div><b>Got an idea for ${name}?</b><span>A short title and a rough cost is enough.</span></div>
        <${ui.Btn} kind="primary" icon="lightbulb" onClick=${propose}>Propose an idea</${ui.Btn}>
      </div>`}
      <${HowItWorks} hood=${view}/>
      ${f.causes.length > 0 && html`<${ui.Section} title=${'Other causes in ' + name} sub="Visitors can also give to these local causes directly.">
        <div class="stack">${f.causes.map(function (c) {
          var raised = num(c.raised) + num((s.given || {})[c.id]);
          return html`<${ui.Row} key=${c.id} art=${c.art || 'neighbourhood'} tone=${toneOk(c.tone)} title=${c.title || c.org || 'Local cause'}
            sub=${(c.org ? c.org + ' · ' : '') + pts(raised) + ' pts raised'} right=${html`<${ui.Icon} name="chevron_right"/>`}
            onClick=${function () { OA.open(c.id); }}/>`;
        })}</div></${ui.Section}>`}
      <${ui.Disclaimer}/>
    </div>`;
  }

  /* ---------- hosting ---------- */
  var ARTS = [
    { id: 'cookies', label: 'Baking', tone: 'sun' }, { id: 'walk', label: 'Walk', tone: 'orange' },
    { id: 'cafe', label: 'Café', tone: 'brick' }, { id: 'market', label: 'Market', tone: 'peach' },
    { id: 'garden', label: 'Garden', tone: 'leaf' }, { id: 'repair', label: 'Repair', tone: 'canal' },
    { id: 'music', label: 'Music', tone: 'plum' }, { id: 'food', label: 'Food', tone: 'peach' }
  ];
  var ART_TONE = {};
  ARTS.forEach(function (a) { ART_TONE[a.id] = a.tone; });
  var MARKET_PRESET = { id: 'market', title: 'My stall at the Lobby Market', about: 'Things I make, grow or no longer need, at a table in a partner hotel\'s lobby. Come by, have a chat and pay with points.',
    pts: 100, art: 'lobby-market', tone: 'orange', when: 'Sundays 11:00-15:00 (pilot)' };
  function templates() { return list('hostTemplates').filter(function (t) { return t.id && t.title; }); }
  function marketTemplate() {
    return templates().filter(function (t) { return /market/i.test([t.id, t.art, t.title].join(' ')); })[0] || null;
  }
  function findTpl(id) {
    if (!id) return null;
    if (id === 'market') return marketTemplate() || MARKET_PRESET;
    return templates().filter(function (t) { return t.id === id; })[0] || null;
  }
  function clampPts(n) { n = Math.round(num(n, 150) / 50) * 50; return Math.max(50, Math.min(500, n || 150)); }
  function formFrom(t) {
    if (!t) return { tpl: 'blank', title: '', about: '', when: '', pts: 150, art: 'cookies', tone: null };
    return { tpl: t.id, title: t.title || '', about: t.about || '', when: t.when || '', pts: clampPts(t.pts), art: t.art || 'cookies', tone: OA.tones[t.tone] ? t.tone : null, tplArt: t.art };
  }
  function toneFor(form) { return form.tone || ART_TONE[form.art] || 'peach'; }
  function offers(s) { return (s.hosted || []).filter(function (o) { return o && o.id; }).slice().reverse(); }
  /* Illustrative stats, steady per offer. */
  function statsFor(o) {
    var h = hashStr(o.id), views = 9 + (h % 30), bookings = 1 + ((h >> 5) % 3);
    return { views: views, bookings: bookings, earned: bookings * Math.max(0, num(o.pts)) };
  }

  function previewOffer(o) {
    OA.nav.sheet(function () {
      return html`<div class="rs rs-sheet"><${ui.SheetBody} art=${o.art || 'cookies'} tone=${toneOk(o.tone)}>
        <div class="hstack"><${ui.Tag}>Buy Local</${ui.Tag}><${ui.Tag} kind="dark">Resident host</${ui.Tag}></div>
        <h2 class="h2">${o.title}</h2>
        <div class="rs-hostline"><${ui.Avatar} name=${o.by || 'You'} tone="canal" size=${40}/>
          <span><b>Hosted by ${o.by || 'you'}</b><span class="small muted">Resident of ${o.area || hoodName(myHood())}</span></span></div>
        ${o.about && html`<p>${o.about}</p>`}
        ${o.when && html`<p class="rs-when"><${ui.Icon} name="schedule" size=${18}/>${o.when}</p>`}
        <div class="rs-redeem">Redeem for <b class="num">${pts(o.pts)}</b></div>
        <${ui.Note}>This is how visitors see your offer in Use, under Buy Local. They chat with you before they come.</${ui.Note}>
        <${ui.Btn} kind="soft" full onClick=${OA.nav.closeSheet}>Back to your offers</${ui.Btn}>
      </${ui.SheetBody}></div>`;
    }, { title: o.title });
  }

  function OfferCard(p) {
    var o = p.o, st = statsFor(o);
    return html`<article class=${cx('rs-offer', p.fresh && 'fresh')}>
      <button type="button" class="rs-offer-main" onClick=${function () { previewOffer(o); }} aria-label=${'Preview ' + o.title}>
        <${ui.Art} name=${o.art || 'cookies'} tone=${toneOk(o.tone)} class="rs-offer-art"/>
        <span class="rs-offer-txt">
          <span class="rs-live"><i></i>${p.fresh ? 'Just published' : 'Live in Buy Local'}</span>
          <span class="rs-offer-t">${o.title}</span>
          <span class="rs-offer-s"><b class="num">${pts(o.pts)} pts</b> · ${o.when || 'Time agreed in chat'}</span>
        </span>
      </button>
      <div class="rs-stats">
        <span><${ui.Icon} name="visibility" size=${18}/><b class="num">${st.views}</b> views</span>
        <span><${ui.Icon} name="event_available" size=${18}/><b class="num">${st.bookings}</b> ${st.bookings === 1 ? 'booking' : 'bookings'}</span>
        <span><${ui.Icon} name="star" fill size=${18}/><b class="num">${pts(st.earned)}</b> pts</span>
      </div>
      <div class="rs-offer-a">
        <${ui.Btn} small kind="soft" icon="visibility" onClick=${function () { previewOffer(o); }}>See it as a visitor</${ui.Btn}>
        <${ui.Btn} small kind="ghost" icon="delete" class=${cx('rs-offer-rm', p.confirm && 'on')} onClick=${p.onRemove}>${p.confirm ? 'Tap again to remove' : 'Remove'}</${ui.Btn}>
      </div>
    </article>`;
  }

  var REPLIES = ['Saturday at 15:00 works. See you then!', 'Could you do Sunday morning instead?', 'Sorry, I am full this week.'];
  function RequestCard(p) {
    var r = useState(null), reply = r[0], setReply = r[1];
    var what = p.offer ? '"' + p.offer.title + '"' : 'your offer';
    return html`<div class="card rs-req">
      <div class="rs-req-head"><${ui.Avatar} name="Maya" tone="plum" size=${40}/>
        <span class="rs-req-who"><b>Maya</b><span class="small muted">Visiting from Lyon · 2 nights</span></span>
        <${ui.Tag}>Example</${ui.Tag}></div>
      <p class="rs-bubble rs-bubble-them">Hi! I saw ${what} and it looks lovely. Could I come by on Saturday around 15:00?</p>
      ${reply
        ? html`<p class="rs-bubble rs-bubble-me">${reply}</p>
            <p class="small muted rs-req-sent"><${ui.Icon} name="check_circle" size=${16}/>Sent. Maya books and pays in points once you agree (demo).</p>`
        : html`<div class="rs-replies" role="group" aria-label="Quick replies"><span class="small muted">Quick reply</span>${REPLIES.map(function (t) {
            return html`<button type="button" class="rs-reply" key=${t} onClick=${function () { setReply(t); OA.toast('Reply sent to Maya (demo)', { icon: 'send' }); }}>${t}</button>`;
          })}</div>`}
    </div>`;
  }

  function HostScreen(props) {
    var s = OA.useStore(), params = props.params || {}, list_ = offers(s), name = hoodName(myHood(s));
    var c = useState(null), confirmId = c[0], setConfirm = c[1];
    useEffect(function () { if (!confirmId) return; var t = setTimeout(function () { setConfirm(null); }, 3500); return function () { clearTimeout(t); }; }, [confirmId]);
    var tot = { views: 0, bookings: 0, earned: 0 };
    list_.forEach(function (o) { var st = statsFor(o); tot.views += st.views; tot.bookings += st.bookings; tot.earned += st.earned; });
    function remove(o) {
      if (confirmId !== o.id) { setConfirm(o.id); return; }
      OA.set({ hosted: (OA.get().hosted || []).filter(function (x) { return x && x.id !== o.id; }) });
      setConfirm(null);
      OA.toast('Offer removed. Visitors no longer see it', { icon: 'delete' });
    }
    function create() { OA.nav.go('host-new'); }
    return html`<div class="screen rs rs-host">
      <${ui.TopBar}/>
      <div class="rs-head">
        <div class="eyebrow rs-eyebrow">Host in ${name}</div>
        <h1 class="h1">Share a bit of your neighbourhood</h1>
        <p class="lede">Offer a walk, a coffee or a skill. Visitors pay in points, and you spend them at local places.</p>
      </div>
      <${ui.Btn} full icon="add" onClick=${create}>Create an offer</${ui.Btn}>
      ${list_.length > 0 && html`<div class="rs-tot" aria-label="Your hosting so far">
        <div><b class="num">${list_.length}</b><span>${list_.length === 1 ? 'offer live' : 'offers live'}</span></div>
        <div><b class="num">${tot.views}</b><span>views</span></div>
        <div><b class="num">${tot.bookings}</b><span>bookings</span></div>
        <div><b class="num">${pts(tot.earned)}</b><span>pts earned</span></div>
      </div>`}
      <${ui.Section} title="Your offers" sub=${list_.length ? 'Stats are illustrative in this beta.' : null}>
        ${list_.length
          ? html`<div class="stack">${list_.map(function (o) {
              return html`<${OfferCard} key=${o.id} o=${o} fresh=${params.fresh === o.id} confirm=${confirmId === o.id} onRemove=${function () { remove(o); }}/>`;
            })}</div>`
          : html`<div class="card-flat rs-empty"><${ui.Empty} icon="storefront" title="No offers yet"
              text="Start small: a walk down your street, coffee at your kitchen table, or a repair you are good at.">
              <${ui.Btn} icon="add" onClick=${create}>Create your first offer</${ui.Btn}></${ui.Empty}></div>`}
      </${ui.Section}>
      <${ui.Section} title="Visitor requests" sub="Visitors message you before they book. Here is what one looks like.">
        <${RequestCard} offer=${list_[0]}/>
      </${ui.Section}>
      <${ui.Note} class="rs-tip">Tip: offers at quieter times, like weekday mornings or early evenings, help spread visitors beyond the busiest streets.</${ui.Note}>
      <${ui.Disclaimer}/>
    </div>`;
  }

  function HostNew(props) {
    var s = OA.useStore(), params = props.params || {}, tpls = templates(), name = hoodName(myHood(s));
    var start = findTpl(params.tpl);
    var f = useState(function () { return formFrom(start); }), form = f[0], setForm = f[1];
    var railRef = P.useRef(null);
    useEffect(function () {
      var row = railRef.current, on = row && row.querySelector('.rs-tpl.on');
      if (on && start && row.scrollTo) row.scrollTo({ left: Math.max(0, on.offsetLeft - row.offsetLeft - 18) });
    }, []);
    function set(k, v) { setForm(function (o) { var n = Object.assign({}, o); n[k] = v; if (k === 'art') n.tone = (o.tplArt && v === o.tplArt) ? o.tone : null; return n; }); }
    function pick(t) { setForm(formFrom(t)); }
    var tplList = tpls.slice();
    if (start && start === MARKET_PRESET) tplList.unshift(MARKET_PRESET);
    var arts = ARTS.slice();
    if (form.tplArt && !ART_TONE[form.tplArt]) arts.unshift({ id: form.tplArt, label: cap(form.tplArt) });
    var tone = toneFor(form);
    function publish() {
      var title = form.title.trim(), about = form.about.trim();
      if (title.length < 3) { OA.toast('Give your offer a title first', { icon: 'info' }); var a = document.getElementById('rs-title'); if (a) a.focus(); return; }
      if (about.length < 3) { OA.toast('Tell visitors what happens', { icon: 'info' }); var b = document.getElementById('rs-about'); if (b) b.focus(); return; }
      var st = OA.get();
      var offer = { id: OA.uid('host'), section: 'local', title: title, about: about, pts: form.pts, when: form.when.trim(), host: true,
        by: st.name || 'A neighbour', byKind: 'Resident host', area: hoodName(myHood(st)), cat: 'local', art: form.art, tone: tone, at: new Date().toISOString() };
      OA.set({ hosted: (st.hosted || []).concat([offer]) });
      OA.toast('Your offer is live. Visitors see it in Buy Local', { icon: 'storefront', ms: 3000 });
      OA.nav.reset('host', { fresh: offer.id });
    }
    return html`<div class="screen rs rs-hostnew">
      <${ui.Header} title="Create an offer" sub=${'Hosted by ' + (s.name || 'you') + ' in ' + name}/>
      <${ui.Section} title="Start from an idea" sub="Pick one and make it yours, or start blank.">
        <div class="rail rs-tpls" role="radiogroup" aria-label="Templates" ref=${railRef}>
          <button type="button" role="radio" aria-checked=${form.tpl === 'blank' ? 'true' : 'false'} class=${cx('rs-tpl rs-tpl-blank', form.tpl === 'blank' && 'on')} onClick=${function () { pick(null); }}>
            <span class="rs-tpl-art rs-tpl-plus"><${ui.Icon} name="edit" size=${28}/></span><span class="rs-tpl-t">Start blank</span></button>
          ${tplList.map(function (t) {
            return html`<button type="button" role="radio" key=${t.id} aria-checked=${form.tpl === t.id ? 'true' : 'false'} class=${cx('rs-tpl', form.tpl === t.id && 'on')} onClick=${function () { pick(t); }}>
              <${ui.Art} name=${t.art || 'cookies'} tone=${toneOk(t.tone || ART_TONE[t.art])} class="rs-tpl-art"/><span class="rs-tpl-t">${t.title}</span></button>`;
          })}
        </div>
      </${ui.Section}>
      <div class="stack">
        <${ui.Field} id="rs-title" label="Title" value=${form.title} max=${60} placeholder="Coffee and stories at my kitchen table" onInput=${function (v) { set('title', v); }}/>
        <${ui.Field} id="rs-about" label="What happens" multiline rows=${3} max=${280} value=${form.about}
          placeholder="What will you do together, and what should visitors bring?" onInput=${function (v) { set('about', v); }}/>
        <${ui.Field} id="rs-when" label="When" value=${form.when} max=${50} placeholder="Weekday mornings, 10:00-11:00" hint="Quieter times help spread visitors out." onInput=${function (v) { set('when', v); }}/>
        <div class="field"><span class="field-l" id="rs-price-l">Price in points</span>
          <div class="rs-stepper" role="group" aria-labelledby="rs-price-l">
            <button type="button" class="rs-stepper-b" aria-label="50 points less" disabled=${form.pts <= 50} onClick=${function () { set('pts', clampPts(form.pts - 50)); }}><${ui.Icon} name="remove"/></button>
            <div class="rs-stepper-v" aria-live="polite"><b class="num">${pts(form.pts)}</b><span>pts</span></div>
            <button type="button" class="rs-stepper-b" aria-label="50 points more" disabled=${form.pts >= 500} onClick=${function () { set('pts', clampPts(form.pts + 50)); }}><${ui.Icon} name="add"/></button>
          </div>
          <span class="field-h">Between 50 and 500. You keep the points to spend locally.</span></div>
        <div class="field"><span class="field-l">Illustration</span>
          <div class="rs-arts" role="radiogroup" aria-label="Illustration">${arts.map(function (a) {
            var on = form.art === a.id;
            return html`<button type="button" role="radio" key=${a.id} aria-checked=${on ? 'true' : 'false'} class=${cx('rs-artopt', on && 'on')} onClick=${function () { set('art', a.id); }}>
              <${ui.Art} name=${a.id} tone=${toneOk(on ? tone : (a.tone || ART_TONE[a.id]))} class="rs-artopt-a"/><span>${a.label}</span></button>`;
          })}</div></div>
      </div>
      <${ui.Section} title="How visitors see it" sub="In Use, under Buy Local, next to local cafés and makers.">
        <div role="list" class="rs-preview">
          <${ui.Tile} size="l" art=${form.art} tone=${tone} title=${form.title.trim() || 'Your offer title'}
            sub=${'Hosted by ' + (s.name || 'you') + ' · ' + name + (form.when.trim() ? ' · ' + form.when.trim() : '')}
            pts=${form.pts} plus=${false} badge="Resident host" onClick=${function () { OA.toast('This is a preview of your offer', { icon: 'visibility' }); }}/>
        </div>
      </${ui.Section}>
      <${ui.Btn} full icon="storefront" class="rs-publish" onClick=${publish}>Publish offer</${ui.Btn}>
      <${ui.Btn} full kind="ghost" onClick=${OA.nav.back}>Cancel</${ui.Btn}>
    </div>`;
  }

  /* ---------- resident home ---------- */
  function ResidentCard(p) {
    var s = p.s, r = useState(false), flipped = r[0], setFlipped = r[1], today = OA.points.earnedToday ? OA.points.earnedToday() : 0;
    return html`<button type="button" class=${cx('rs-card', flipped && 'flipped')} onClick=${function () { setFlipped(!flipped); }}
      aria-label=${flipped ? 'Your resident code. Tap to show your points' : 'Resident card, ' + pts(s.points) + ' points. Tap to show your code'}>
      <span class="rs-card-in">
        <span class="rs-face rs-front">
          <span class="rs-card-top"><span><span class="rs-card-t">Resident Card</span><span class="rs-card-s">Your neighbour points</span></span>
            <span class="rs-card-chip"><${ui.Icon} name="qr_code_2" size=${18}/>Show code</span></span>
          <span class="rs-card-n num">${pts(s.points)}</span>
          <span class="rs-card-foot"><span class="rs-card-hood"><${ui.Icon} name="home" fill size=${16}/>${hoodName(myHood(s))}</span><span>+${pts(today)} today</span></span>
        </span>
        <span class="rs-face rs-back">
          <${ui.QR} seed=${'resident-' + (s.name || 'sam')} size=${118}/>
          <span class="rs-back-txt"><span class="rs-back-role">Resident · ${hoodName(myHood(s))}</span>
            <span class="rs-back-name">${s.name || 'Resident'}</span>
            <span class="rs-back-hint">Show this at a local place to pay or get paid</span></span>
        </span>
      </span>
    </button>`;
  }

  function Action(p) {
    return html`<button type="button" class="rs-act" onClick=${p.onClick}>
      <${ui.Icon} name=${p.icon} fill size=${30} class="rs-act-ic"/>
      <span class="rs-act-l"><b>${p.title}</b><span>${p.sub}</span></span></button>`;
  }

  function ConceptCard(p) {
    return html`<button type="button" class="rs-concept" onClick=${p.onClick}>
      <${ui.Art} name=${p.art} tone=${p.tone} class="rs-concept-art"/>
      <span class="rs-concept-txt">
        <${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>
        <span class="rs-concept-t">${p.title}</span>
        <span class="rs-concept-s">${p.text}</span>
        <span class="rs-concept-a">${p.cta}<${ui.Icon} name="arrow_forward" size=${18}/></span>
      </span>
    </button>`;
  }

  function ResidentHome() {
    var s = OA.useStore(), hood = myHood(s), h = hoodOf(hood), name = hoodName(hood);
    var f = fundFor(hood, s), items = ranked(hood, s), lead = items[0], used = usedVotes(s), mine = offers(s);
    function go(route, params) { if (OA.screens[route]) OA.nav.go(route, params); else OA.toast('That part of the app is still being built', { icon: 'construction' }); }
    return html`<div class="screen rs rs-home">
      <${ui.TopBar}/>
      <div class="rs-greet">
        <div><div class="rs-hello">${greeting()}</div><h1 class="rs-name">${s.name || 'Neighbour'}</h1></div>
        <${ui.Avatar} name=${s.name || 'N'} tone="canal" size=${52}/>
      </div>
      <button type="button" class="rs-hoodline" onClick=${function () { OA.nav.tab('fund'); }}>
        <span class="rs-hoodline-ic"><${ui.Icon} name="home" fill/></span>
        <span class="rs-hoodline-txt"><span>Your neighbourhood: <b>${name}</b></span>${h.blurb && html`<span class="small">${h.blurb}</span>`}</span>
      </button>
      <${ResidentCard} s=${s}/>

      <section class="rs-fundmini" aria-label="Your neighbourhood fund this month">
        <div class="rs-fm-top">
          <div class="rs-fm-txt">
            <div class="eyebrow rs-eyebrow">Your neighbourhood fund this month</div>
            <div class="rs-fm-n num">${pts(f.total)}<small>pts</small></div>
            <div class="small muted">pooled by visitors for ${name}</div>
          </div>
          <${ui.Art} name="vote" tone="sun" class="rs-fm-art"/>
        </div>
        ${lead
          ? html`<button type="button" class="rs-fm-lead" onClick=${function () { openProposal(lead.p.id); }}>
              <span class="small muted">Leading idea · ${lead.votes} votes</span><b>${lead.p.title}</b></button>`
          : html`<p class="small muted">No ideas yet this month. Yours could be the first.</p>`}
        <${ui.Btn} full icon="how_to_vote" onClick=${function () { OA.nav.tab('fund'); }}>Vote on what it pays for</${ui.Btn}>
        <div class="rs-fm-foot"><span>${used} of ${MAX_VOTES} votes used</span><span>${daysText()}</span></div>
      </section>

      <${ui.Section} title="What would you like to do?">
        <div class="rs-acts">
          <${Action} icon="storefront" title="Host" sub="an experience" onClick=${function () { go('host-new'); }}/>
          <${Action} icon="how_to_vote" title="Vote" sub="in the fund" onClick=${function () { OA.nav.tab('fund'); }}/>
          <${Action} icon="park" title="Nature" sub="guide" onClick=${function () { go('nature'); }}/>
          <${Action} icon="explore" title="Explore" sub="the city" onClick=${function () { OA.nav.tab('explore'); }}/>
        </div>
      </${ui.Section}>

      <${ui.Section} title="Your offers" sub=${mine.length ? 'Live for visitors in Buy Local' : null}
        action=${mine.length ? { label: 'Manage', onClick: function () { OA.nav.tab('host'); } } : null}>
        ${mine.length
          ? html`<${ui.Rail}>${mine.map(function (o) {
              return html`<${ui.Tile} key=${o.id} art=${o.art || 'cookies'} tone=${toneOk(o.tone)} title=${o.title} sub=${o.when || 'Time agreed in chat'}
                pts=${o.pts} plus=${false} onClick=${function () { previewOffer(o); }}/>`;
            })}
            <button type="button" role="listitem" class="rs-addtile" onClick=${function () { go('host-new'); }}><${ui.Icon} name="add" size=${30}/>New offer</button>
            </${ui.Rail}>`
          : html`<div class="rs-nooffer">
              <${ui.Icon} name="storefront" size=${28}/>
              <span><b>You are not hosting anything yet</b><span class="small muted">Visitors love a walk or a coffee with a local. You earn points for every booking.</span></span>
              <${ui.Btn} small onClick=${function () { go('host-new'); }}>Host an experience</${ui.Btn}>
            </div>`}
      </${ui.Section}>

      <${ui.Section} title="More ways to take part" sub="Ideas from Team 5 that connect to OnsAms.">
        <div class="stack">
          <${ConceptCard} art="lobby-market" tone="orange" title="Sell at the Lobby Market"
            text="Sell what you make or no longer need at a stall in a partner hotel's lobby, a few hours a week. Visitors pay with points."
            cta="Set up a stall offer" onClick=${function () { go('host-new', { tpl: 'market' }); }}/>
          <${ConceptCard} art="floating-garden" tone="leaf" title="Help plant floating gardens"
            text="Plant and look after rafts of plants on the water that give fish, birds and insects a home. Earn points with your neighbours."
            cta="See the next planting day" onClick=${function () { OA.open('floating-gardens'); }}/>
        </div>
      </${ui.Section}>

      <${ui.Section} title="Spend your points">
        <${ui.Row} icon="payments" title="Use your points at local places" sub="Cafés, makers and your neighbours' offers"
          right=${html`<${ui.Icon} name="chevron_right"/>`} onClick=${function () { go('use'); }}/>
      </${ui.Section}>
      <${ui.Disclaimer}/>
    </div>`;
  }

  /* ---------- register ---------- */
  OA.screen('r-home', ResidentHome, { tab: 'home', role: 'resident', title: 'Resident home' });
  OA.screen('host', HostScreen, { tab: 'host', role: 'resident', title: 'Host' });
  OA.screen('host-new', HostNew, { bar: false, role: 'resident', title: 'Create an offer' });
  OA.screen('fund', FundScreen, { tab: 'fund', role: 'resident', title: 'Neighbourhood fund' });
  OA.resident = Object.assign(OA.resident || {}, { openProposal: openProposal, openPropose: openPropose });
})();

</script>
<script>/* ---- app.js ---- */
/* OnsAms beta: app shell and boot. Owned by the lead. Loaded last. */
(function () {
  'use strict';
  var OA = window.OA, P = OA.h, html = P.html, ui = OA.ui;
  var useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;

  /* Screens a resident sees; deep links to these load the resident demo. */
  var RESIDENT_ROUTES = ['r-home', 'host', 'host-new', 'fund', 'proposal'];

  /* Demo profiles for deep links and the presenter panel. */
  OA.loadDemo = function (role) {
    var d = (OA.data && OA.data.demo && OA.data.demo[role]) || {};
    var now = Date.now();
    var hist = (d.history || []).map(function (h, i) {
      return Object.assign({ id: 'demo-h' + i, at: new Date(now - (i + 1) * 3600e3 * 5).toISOString() }, h);
    });
    var given = {};
    hist.forEach(function (h) { if (h.kind === 'give' && h.ref) given[h.ref] = (given[h.ref] || 0) + h.pts; });
    // Things residents create are part of the shared city, so they survive a role switch
    // (a resident publishes an offer, the presenter switches to the visitor and finds it in Buy Local).
    var prev = OA.get();
    OA.resetState({
      hosted: prev.hosted || [], votes: prev.votes || {}, rsIdeas: prev.rsIdeas || [],
      role: role, onboarded: true, name: d.name || (role === 'resident' ? 'Sam' : 'Alex'),
      interests: d.interests || ['local', 'nature', 'food'], hood: role === 'resident' ? (d.hood || 'oost') : null,
      hotel: role === 'visitor', points: d.points != null ? d.points : (role === 'resident' ? 420 : 1240),
      history: hist, given: given, saved: d.saved || [], done: d.done || []
    });
  };

  /* Placeholder for a screen that is not built yet, so a missing module never breaks navigation. */
  function Missing(p) {
    var cur = OA.nav.current();
    return html`<div class="screen">
      <${ui.Header} title="Coming soon"/>
      <${ui.Empty} icon="construction" title="This part is still being built" text=${'Screen "' + cur.name + '" arrives in the next beta.'}>
        <${ui.Btn} kind="soft" onClick=${OA.nav.home}>Back to home</${ui.Btn}>
      </${ui.Empty}></div>`;
  }

  /* Splash fallback (onboarding.js registers the real one). */
  if (!OA.screens.splash) OA.screen('splash', function () {
    useEffect(function () { var t = setTimeout(function () { OA.nav.reset(OA.get().onboarded ? OA.homeRoute() : (OA.screens.welcome ? 'welcome' : OA.homeRoute())); }, 900); return function () { clearTimeout(t); }; }, []);
    return html`<div class="splash"><div class="wordmark wordmark-xl">OnsAms</div></div>`;
  }, { bar: false });

  /* One screen, wrapped in an error boundary so one broken module cannot take the app down. */
  function ScreenHost(p) {
    var eb = P.useErrorBoundary(function (err) { console.error('[OnsAms] screen "' + p.name + '" crashed:', err); });
    var err = eb[0], reset = eb[1];
    if (err) {
      return html`<div class="screen"><${ui.Header} title="Something went wrong"/>
        <${ui.Empty} icon="error" title="This screen hit a snag" text=${String(err && err.message || err)}>
          <${ui.Btn} kind="soft" onClick=${function () { reset(); OA.nav.home(); }}>Back to home</${ui.Btn}>
        </${ui.Empty}></div>`;
    }
    var Comp = p.def.Comp;
    return html`<${Comp} params=${p.params}/>`;
  }

  function TabBar(p) {
    var s = OA.get();
    var tabs = OA.tabs[s.role === 'resident' ? 'resident' : 'visitor'];
    return html`<nav class="tabbar" aria-label="Main">
      ${tabs.map(function (t) {
        var on = p.active === t.id;
        return html`<button type="button" class=${OA.cx('tab', t.center && 'tab-center', on && 'on')} aria-current=${on ? 'page' : null}
          onClick=${function () { OA.nav.tab(t.id); }}>
          <span class="tab-ic"><${ui.Icon} name=${t.icon} fill=${on || t.center}/></span><span class="tab-l">${t.label}</span></button>`;
      })}</nav>`;
  }

  function SheetHost(p) {
    var sh = p.sheet;
    useEffect(function () {
      var onKey = function (e) { if (e.key === 'Escape') OA.nav.closeSheet(); };
      document.addEventListener('keydown', onKey);
      return function () { document.removeEventListener('keydown', onKey); };
    }, []);
    return html`<div class="sheet-wrap" key=${sh.key}>
      <div class="sheet-backdrop" onClick=${OA.nav.closeSheet}></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label=${sh.opts.title || 'Details'}>
        <div class="sheet-grab" aria-hidden="true"></div>
        <button type="button" class="sheet-x iconbtn" aria-label="Close" onClick=${OA.nav.closeSheet}><${ui.Icon} name="close"/></button>
        <div class="sheet-scroll">${sh.render()}</div>
      </div></div>`;
  }

  function StatusBar() {
    var r = useState(new Date()), now = r[0], setNow = r[1];
    useEffect(function () { var t = setInterval(function () { setNow(new Date()); }, 30000); return function () { clearInterval(t); }; }, []);
    return html`<div class="statusbar" aria-hidden="true"><span>${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</span>
      <span class="sb-ic"><${ui.Icon} name="signal_cellular_alt" size=${16}/><${ui.Icon} name="wifi" size=${16}/><${ui.Icon} name="battery_full" size=${16}/></span></div>`;
  }

  function Device() {
    var nav = OA.useNav();
    var s = OA.useStore();
    var cur = OA.nav.current();
    var def = OA.screens[cur.name] || { Comp: Missing, bar: true, tab: null };
    var showBar = s.onboarded && def.bar !== false;
    var scroller = useRef(null);
    useEffect(function () { if (scroller.current) scroller.current.scrollTop = 0; }, [cur.key]);
    return html`<div class=${OA.cx('device', showBar && 'has-bar', nav.sheet && 'has-sheet')}>
      <${StatusBar}/>
      <main class="viewport" ref=${scroller} id="oa-viewport">
        <div class=${'page dir-' + nav.dir} key=${cur.key} data-screen=${cur.name}>
          <${ScreenHost} name=${cur.name} def=${def} params=${cur.params} key=${cur.key}/>
        </div>
      </main>
      ${showBar && html`<${TabBar} active=${def.tab}/>`}
      ${nav.sheet && html`<${SheetHost} sheet=${nav.sheet}/>`}
      ${nav.toast && html`<div class="toast" role="status" key=${nav.toast.key}><${ui.Icon} name=${nav.toast.icon} fill/>${nav.toast.text}</div>`}
      ${nav.burst && html`<div class="burst" role="status" key=${nav.burst.key}><div class="burst-star"><${ui.Icon} name="star" fill size=${54}/></div>
        <div class="burst-n">+${OA.fmt.pts(nav.burst.pts)}</div><div class="burst-l">${nav.burst.label}</div></div>`}
    </div>`;
  }

  /* Presenter panel, visible beside the phone on wide screens. */
  var JUMPS = [
    { route: 'welcome', label: 'Start (onboarding)', fresh: true },
    { route: 'v-home', label: 'Visitor home', role: 'visitor' },
    { route: 'explore', label: 'Explore map and crowd levels', role: 'visitor', params: { crowd: true } },
    { route: 'nature', label: 'Nature guide', role: 'visitor' },
    { route: 'earn', label: 'Earn points', role: 'visitor' },
    { route: 'use', label: 'Use points', role: 'visitor' },
    { route: 'impact', label: 'Impact and the loop', role: 'visitor' },
    { route: 'r-home', label: 'Resident home', role: 'resident' },
    { route: 'host', label: 'Host an experience', role: 'resident' },
    { route: 'fund', label: 'Neighbourhood fund vote', role: 'resident' },
    { route: 'feedback', label: 'Tester feedback form' },
    { route: 'results', label: 'Test results (team)' }
  ];
  function jump(j) {
    if (j.fresh) { OA.resetState(); OA.nav.reset(OA.screens.welcome ? 'welcome' : 'splash'); return; }
    var s = OA.get();
    if (j.role && (s.role !== j.role || !s.onboarded)) OA.loadDemo(j.role);
    if (!j.role && !s.onboarded) OA.loadDemo('visitor');
    OA.nav.reset(j.route, j.params || {});
  }
  function Side() {
    var s = OA.useStore();
    OA.useNav();
    var cur = OA.nav.current().name;
    var fbCount = OA.fb.all().length;
    return html`<aside class="side">
      <div class="side-brand"><span class="wordmark">OnsAms</span><span class="side-beta">${OA.version}</span></div>
      <p class="side-lede">For Amsterdam, by everyone. A social currency that turns a visit into points for local places, nature and neighbours, and lets residents decide where the value goes.</p>
      <div class="side-block">
        <div class="side-h">View the app as</div>
        <${ui.Segmented} value=${s.onboarded ? s.role : null} onChange=${function (r) { OA.loadDemo(r); OA.nav.reset(r === 'resident' ? 'r-home' : 'v-home'); }}
          options=${[{ id: 'visitor', label: 'Visitor', icon: 'luggage' }, { id: 'resident', label: 'Resident', icon: 'home' }]}/>
      </div>
      <div class="side-block">
        <div class="side-h">Jump to</div>
        <div class="side-jumps">${JUMPS.filter(function (j) { return OA.screens[j.route]; }).map(function (j) {
          var on = cur === j.route || (j.route === 'welcome' && ['splash', 'signup', 'interests', 'intro'].indexOf(cur) >= 0);
          return html`<button type="button" class=${OA.cx('side-jump', on && 'on')} onClick=${function () { jump(j); }}>${j.label}${j.route === 'results' && fbCount ? html` <b>${fbCount}</b>` : ''}</button>`;
        })}</div>
      </div>
      <div class="side-block side-row">
        <${ui.Btn} kind="ghost" small icon="restart_alt" onClick=${function () { OA.resetState(); OA.nav.reset('splash'); }}>Restart demo</${ui.Btn}>
      </div>
      <${ui.Disclaimer}/>
      <p class="side-credit">Team 5 (Residents). Built on Lin's OnsAms design.</p>
    </aside>`;
  }

  function App() {
    return html`<div class="stage"><${Side}/><div class="phone"><${Device}/></div></div>`;
  }

  /* Deep links: #explore, #fund, ... open that screen with a demo profile (plain tokens only). */
  function routeFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h || !OA.screens[h]) return false;
    var role = RESIDENT_ROUTES.indexOf(h) >= 0 ? 'resident' : 'visitor';
    var s = OA.get();
    if (h === 'welcome' || h === 'splash') { OA.resetState(); OA.nav.reset(h); return true; }
    if (!s.onboarded || (RESIDENT_ROUTES.indexOf(h) >= 0 && s.role !== 'resident')) OA.loadDemo(role);
    OA.nav.reset(h);
    return true;
  }

  function boot() {
    var root = document.getElementById('oa-root');
    if (!routeFromHash()) {
      var s = OA.get();
      OA.nav.reset(OA.screens.splash ? 'splash' : (s.onboarded ? OA.homeRoute() : 'welcome'));
    }
    window.addEventListener('hashchange', routeFromHash);
    // Scale the framed phone (412 x 866 including its bezel) to fit short windows, e.g. a laptop on a projector.
    var fit = function () {
      var s = Math.min(1, (window.innerHeight - 24) / 866, window.innerWidth >= 900 ? 1 : (window.innerWidth - 24) / 412);
      document.documentElement.style.setProperty('--phone-scale', String(Math.max(0.5, s).toFixed(3)));
    };
    fit(); window.addEventListener('resize', fit);
    P.render(html`<${App}/>`, root);
    document.documentElement.classList.add('oa-ready');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body></html>
