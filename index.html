    { n: 3, r: 3, c: 3, who: 'visitor', icon: 'potted_plant', t: 'Earn', chips: [['Floating gardens', true], ['Clean-ups']] },
    { n: 4, r: 5, c: 3, who: 'visitor', icon: 'storefront', t: 'Spend', chips: [['Lobby Market', true], ['Local makers']] },
    { n: 5, r: 7, c: 3, who: 'visitor', icon: 'volunteer_activism', t: 'Give', chips: [['Neighbourhood fund']] },
    { n: 6, r: 7, c: 1, who: 'resident', icon: 'how_to_vote', t: 'Residents decide', s: 'vote on what the fund pays for' },
    { n: 7, r: 5, c: 1, who: 'hood', icon: 'park', t: 'Better neighbourhood', s: 'shade, repair cafés, clean water' },
    { n: 8, r: 3, c: 1, who: 'hotel', icon: 'favorite', t: 'Better stays', s: 'a city worth coming back to' }
  ];
  var ARROWS = [
    { r: 1, c: 2, icon: 'arrow_forward' }, { r: 2, c: 3, icon: 'arrow_downward' }, { r: 4, c: 3, icon: 'arrow_downward' },
    { r: 6, c: 3, icon: 'arrow_downward' }, { r: 7, c: 2, icon: 'arrow_back' }, { r: 6, c: 1, icon: 'arrow_upward' },
    { r: 4, c: 1, icon: 'arrow_upward' }, { r: 2, c: 1, icon: 'arrow_upward' }
  ];
  function Loop() {
    var summary = 'The loop: ' + LOOP.map(function (x) { return x.t; }).join(', then ') + ', and back to the hotel.';
    return html`<figure class="hm-loop-fig">
      <div class="hm-loop" role="img" aria-label=${summary}>
        <span class="hm-loop-mid" aria-hidden="true"><${ui.Icon} name="autorenew" size=${22}/></span>
        ${ARROWS.map(function (a, i) {
          return html`<span class="hm-loop-arr" key=${'a' + i} style=${'grid-row:' + a.r + ';grid-column:' + a.c} aria-hidden="true"><${ui.Icon} name=${a.icon} size=${16}/></span>`;
        })}
        ${LOOP.map(function (x) {
          var who = ACTORS[x.who];
          return html`<div class="hm-node" key=${x.n} style=${'grid-row:' + x.r + ';grid-column:' + x.c}>
            <div class="hm-node-top">
              <span class="hm-node-ic" style=${'background:' + who.bg + ';color:' + who.fg}><${ui.Icon} name=${x.icon} fill size=${18}/></span>
              <span class="hm-node-n">${x.n}</span>
            </div>
            <div class="hm-node-t">${x.t}</div>
            ${x.s ? html`<div class="hm-node-s">${x.s}</div>` : null}
            ${x.chips ? html`<div class="hm-node-chips">${x.chips.map(function (c) {
              return html`<span class=${cx('hm-nchip', c[1] && 'is-concept')} key=${c[0]}>${c[0]}</span>`;
            })}</div>` : null}
          </div>`;
        })}
      </div>
      <figcaption class="hm-loop-key">
        ${Object.keys(ACTORS).map(function (k) {
          return html`<span class="hm-key" key=${k}><i style=${'background:' + ACTORS[k].bg}></i>${ACTORS[k].label}</span>`;
        })}
        <span class="hm-key"><i class="hm-key-concept"></i>Team 5 concept</span>
      </figcaption>
    </figure>`;
  }

  function percentile(total) { return Math.max(1, Math.min(95, Math.round(100 * Math.exp(-total / 550)))); }

  function Impact() {
    var s = OA.useStore();
    var resident = s.role === 'resident';
    var red = OA.points.redirected();
    var imp = Dobj('impact');
    var who = resident ? 'residents' : 'visitors';
    var pct = percentile(red.total);
    var quip = pct <= 10 ? 'Amsterdam owes you a stroopwafel.' : pct <= 40 ? 'Nice going.' : 'A good start.';
    // where the points went, grouped by item
    var where = {}, keys = [];
    (s.history || []).forEach(function (h) {
      if (h.kind === 'earn') return;
      var k = h.ref || h.title;
      if (!where[k]) { where[k] = { ref: h.ref, title: h.title, cat: h.cat, kind: h.kind, pts: 0 }; keys.push(k); }
      where[k].pts += h.pts;
    });
    var went = keys.map(function (k) { return where[k]; }).sort(function (a, b) { return b.pts - a.pts; }).slice(0, 4);
    var participants = imp.participants != null ? imp.participants : 12482;
    var total = imp.redirected != null ? imp.redirected : 1860000;
    return html`<div class="screen hm-imp">
      <${ui.Header} title="Your impact" sub=${(s.name || '').trim() || null}/>
      <section class="hm-imp-card" aria-labelledby="hm-imp-l">
        <div class="hm-imp-l" id="hm-imp-l">points redirected</div>
        <div class="hm-imp-n num">${fmt(red.total)}</div>
        <p class="hm-imp-p">${red.total
          ? html`You're in the top <b>${pct}%</b> of ${who} this week. ${quip}`
          : 'Everyone starts at zero. Spend or give a few points and watch these bars grow.'}</p>
        <${Bars} by=${red.by} h=${red.total ? 128 : 16}/>
        <p class="hm-imp-foot">Points you spent at local places or gave to causes, by category. Ranking is illustrative.</p>
        ${red.total ? null : html`<${ui.Btn} full icon=${resident ? 'storefront' : 'favorite'} onClick=${resident ? go('use') : tab('use')}>${resident ? 'Spend points locally' : 'Use your points'}</${ui.Btn}>`}
      </section>

      ${went.length ? html`<${ui.Section} title="Where your points went">
        <ul class="hm-went">${went.map(function (w) {
          var c = catOf(w.cat), canOpen = w.ref && OA.findAny(w.ref);
          var body = html`<span class="hm-went-dot" style=${'background:' + c.color}></span>
            <span class="hm-went-txt"><span class="hm-went-t">${w.title}</span><span class="hm-went-s">${(KIND[w.kind] || KIND.spend).verb} · ${c.label}</span></span>
            <span class="hm-went-n num">${fmt(w.pts)}</span>`;
          return html`<li key=${w.title}>${canOpen ? html`<button type="button" class="hm-went-row" onClick=${open(w.ref)}>${body}</button>` : html`<div class="hm-went-row">${body}</div>`}</li>`;
        })}</ul>
      </${ui.Section}>` : null}

      <section class="hm-together" aria-labelledby="hm-tg-t">
        <h2 id="hm-tg-t" class="hm-tg-t">${resident ? 'Together, visitors and residents are making an impact' : 'Together, visitors are making an impact'}</h2>
        <div class="hm-tg-stats">
          <div><b class="num">${fmt(participants)}</b><span>people taking part</span></div>
          <div><b class="num">${fmt(total)}</b><span>points redirected to Amsterdam</span></div>
        </div>
        <p class="hm-tg-l">${imp.label || 'Illustrative numbers for this prototype'}</p>
      </section>

      <${ui.Section} title="How it all connects" sub="Points start at the hotel and end up as a better neighbourhood. That makes the city a better place to stay, so the loop keeps going.">
        <${Loop}/>
        <p class="small muted">Three Team 5 prototypes share this loop. OnsAms carries the points (Lin's design). The Lobby Market (Anaïs) is where they get spent. Floating gardens (Julio) are one way to earn them.</p>
        <${ui.Btn} kind="ghost" full icon="info" onClick=${go('about')}>About the three prototypes</${ui.Btn}>
      </${ui.Section}>
    </div>`;
  }

  /* ================= about ================= */
  var PROTOS = [
    { id: 'onsams', name: 'OnsAms', what: 'Social currency', by: 'Design by Lin', art: 'houses', tone: 'orange', mine: true,
      about: 'The app you are holding. Points turn a visit into support for local places, nature and neighbours.',
      link: 'Carries the points through the whole loop.' },
    { id: 'lobby-market', name: 'Lobby Market', what: 'A market in hotel lobbies', by: 'Concept by Anaïs', art: 'lobby-market', tone: 'sun',
      about: 'Local makers, second-hand stalls and food in a pilot hotel\'s lobby, a few hours a week.',
      link: 'Visitors spend points at the stalls. Residents can sell there.', cta: 'Open the Lobby Market' },
    { id: 'floating-gardens', name: 'Floating gardens', what: 'Planted rafts on the water', by: 'Concept by Julio', art: 'floating-garden', tone: 'leaf',
      about: 'Planted rafts that give fish, birds and insects a home on the canals.',
      link: 'Visitors and residents earn points planting and looking after them.', cta: 'Plant a floating garden' }
  ];
  var STEPS = [
    { icon: 'hotel', t: 'Get', s: 'Your partner hotel gives you points at check-in. Enter the code from your key card.' },
    { icon: 'star', t: 'Earn', s: 'Visit quiet places at quiet times, buy from local makers, or join a canal clean-up or a floating garden planting.' },
    { icon: 'shopping_bag', t: 'Spend', s: 'Use points for local experiences, often at off-peak times, and treats from local shops and resident hosts.' },
    { icon: 'volunteer_activism', t: 'Give', s: 'Pool points for a cause. Pooled points flow into neighbourhood funds, and residents vote on what they pay for.' }
  ];
  function About() {
    return html`<div class="screen hm-about">
      <${ui.Header} title="About OnsAms"/>
      <div class="hm-ab-hero">
        <${ui.Art} name="houses" tone="orange" class="hm-ab-art"/>
        <div class="hm-ab-hero-txt"><div class="hm-ab-wm">OnsAms</div><div class="hm-ab-tag">For Amsterdam, by everyone</div></div>
      </div>

      <${ui.Section} title="What OnsAms is">
        <p class="hm-p">OnsAms means "Our Amsterdam". It is a social currency for the city. Visitors get points from their hotel and earn more by doing things that give back. They spend them at local places, or pool them for causes.</p>
        <p class="hm-p">Residents use the same app from the other side. They host experiences, earn and spend points locally, and vote on what their neighbourhood fund pays for.</p>
      </${ui.Section}>

      <${ui.Section} title="How points work">
        <ol class="hm-steps">${STEPS.map(function (x, i) {
          return html`<li class="hm-step" key=${x.t}><span class="hm-step-ic"><${ui.Icon} name=${x.icon} fill size=${20}/></span>
            <span class="hm-step-txt"><b>${i + 1}. ${x.t}</b><span>${x.s}</span></span></li>`;
        })}</ol>
        <${ui.Note}>Residents earn points by hosting and helping, and spend them locally too. In this prototype points are illustrative: nothing is paid or charged.</${ui.Note}>
      </${ui.Section}>

      <${ui.Section} title="Three Team 5 prototypes" sub="Three separate ideas. Each one stands on its own, and the points connect them.">
        <div class="stack">${PROTOS.map(function (x) {
          return html`<article class="hm-proto" key=${x.id}>
            <${ui.Art} name=${x.art} tone=${x.tone} class="hm-proto-art"/>
            <div class="hm-proto-body">
              <div class="hm-proto-head"><h3 class="h3">${x.name}</h3>${x.mine ? html`<${ui.Tag}>This app</${ui.Tag}>` : html`<${ui.Tag} kind="concept">Team 5 concept</${ui.Tag}>`}</div>
              <div class="hm-proto-what">${x.what} · ${x.by}</div>
              <p class="small">${x.about}</p>
              <p class="hm-proto-link"><${ui.Icon} name="link" size=${18}/>${x.link}</p>
              ${x.cta ? html`<${ui.Btn} kind="soft" small onClick=${open(x.id)}>${x.cta}</${ui.Btn}>` : null}
            </div>
          </article>`;
        })}</div>
      </${ui.Section}>

      <${ui.Section} title="How they connect">
        <p class="hm-p">Hotels hand out points. Visitors earn more at a floating garden or a clean-up, spend them at the Lobby Market or with local makers, and give the rest to the neighbourhood fund. Residents decide what the fund pays for. A better neighbourhood makes for better stays, and the loop starts again.</p>
        <${ui.Btn} kind="ghost" full icon="autorenew" onClick=${go('impact')}>See the loop</${ui.Btn}>
      </${ui.Section}>

      <${ui.Section} title="Credits">
        <div class="hm-credit">
          <${ui.Avatar} name="Lin" size=${44} tone="orange"/>
          <p class="small">This app is built on <b>Lin's OnsAms design</b>: the name, the look, the points card, the three actions, Explore, Earn and Use, the resident-hosted cookies and the impact profile.</p>
        </div>
        <p class="small muted">City guides, the nature guide and the links to the Lobby Market (Anaïs) and Floating gardens (Julio) came from Antonis's pitch. Built by Team 5 (Residents) for Regenerative Design at Hotelschool The Hague, October 2026.</p>
      </${ui.Section}>

      <${ui.Btn} full icon="rate_review" onClick=${go('feedback')}>Give feedback</${ui.Btn}>
      <${ui.Disclaimer}/>
      <p class="hm-ver">OnsAms ${OA.version || 'beta'}</p>
    </div>`;
  }

  /* ---------- register ---------- */
  OA.screen('v-home', VHome, { tab: 'home', role: 'visitor', title: 'Home' });
  OA.screen('me', Me, { tab: 'me', role: 'any', title: 'Me' });
  OA.screen('impact', Impact, { tab: 'me', role: 'any', title: 'Your impact' });
  OA.screen('about', About, { tab: 'me', role: 'any', title: 'About OnsAms' });
})();

</script>
<script>/* ---- onboarding.js ---- */
/* OnsAms beta: onboarding. Owned by the onboarding agent; styles in src/css/onboarding.css (prefix ob-).
   Routes (all without the tab bar): splash -> welcome -> signup -> interests -> intro -> home.
   Lin's flow with less friction: first name only, a hotel code for visitors, a neighbourhood for residents.
   State is written as the user goes (role, name, hood, hotel, interests); the intro's "Get started" sets
   onboarded:true, awards the welcome points and resets to the home route. */
/* icons: luggage, home, info, arrow_back, arrow_forward, lock, hotel, check_circle, close, error, more_horiz, star, timer, location_on */
(function () {
  'use strict';
  var OA = window.OA;
  if (!OA || !OA.h) return;
  var P = OA.h, html = P.html, ui = OA.ui, cx = OA.cx;
  var useState = P.useState, useEffect = P.useEffect, useRef = P.useRef;

  var STEPS = ['welcome', 'signup', 'interests', 'intro'];

  /* ---------- helpers ---------- */
  function hotel() {
    var h = (OA.data && OA.data.hotel) || {};
    return {
      name: h.name || 'Your partner hotel',
      code: String(h.code || 'ONSAMS'),
      welcome: h.welcome != null ? h.welcome : 250,
      noCodeWelcome: h.noCodeWelcome != null ? h.noCodeWelcome : 50
    };
  }
  function norm(c) { return String(c || '').replace(/[^a-z0-9]/gi, '').toUpperCase(); }
  // 'empty' | 'typing' | 'ok' | 'bad'
  function codeState(c) {
    var n = norm(c), want = norm(hotel().code);
    if (!n) return 'empty';
    if (n === want) return 'ok';
    return n.length >= want.length ? 'bad' : 'typing';
  }
  function welcomePts(st) { var h = hotel(); return st.role !== 'resident' && st.hotel ? h.welcome : h.noCodeWelcome; }
  function reduced() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
  function artSvg(name, tone) { try { return OA.art(name, { tone: tone }) || ''; } catch (e) { return ''; } }
  function toneBg(tone) { return (OA.tones[tone] || OA.tones.peach).bg; }
  function hoods() { return (OA.data && OA.data.neighbourhoods) || []; }

  /* What was typed on the sign-up step survives back/forward; a demo restart (role cleared) wipes it. */
  var draft = { name: null, code: '' };
  OA.subscribe(function (s) { if (!s.role && !s.onboarded) draft = { name: null, code: '' }; });

  // Back between steps; a deep-linked step (nothing underneath) goes back to the start.
  function back() { if (OA.nav.depth() > 1) OA.nav.back(); else OA.nav.reset('welcome'); }

  // After a route change focus lands on <body>; move it to the step's heading for keyboard and screen-reader users.
  function useLandingFocus(ref) {
    useEffect(function () {
      var a = document.activeElement;
      if (ref.current && (!a || a === document.body || !document.contains(a))) {
        try { ref.current.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      }
    }, []);
  }

  /* ---------- shared pieces ---------- */
  // Darkened illustration behind the welcome and intro screens (Lin used a darkened street photo).
  function Backdrop(p) {
    return html`<div class=${cx('ob-bg', p.deep && 'ob-bg-deep')} aria-hidden="true">
      <div class="ob-bg-art" style=${'background:' + toneBg(p.tone)} dangerouslySetInnerHTML=${{ __html: artSvg(p.art, p.tone) }}></div>
      <div class="ob-bg-shade"></div>
    </div>`;
  }

  // Top bar of a step: back arrow, step progress, optional right slot.
  function Top(p) {
    var at = STEPS.indexOf(p.step), n = STEPS.length;
    return html`<div class=${cx('ob-top', p.dark && 'ob-top-dark')}>
      <button type="button" class="iconbtn ob-back" aria-label="Back" onClick=${back}><${ui.Icon} name="arrow_back"/></button>
      <div class="ob-steps" role="progressbar" aria-label=${'Step ' + (at + 1) + ' of ' + n}
        aria-valuemin="1" aria-valuemax=${n} aria-valuenow=${at + 1}>
        ${STEPS.map(function (s, i) { return html`<span class=${cx('ob-step', i < at && 'done', i === at && 'now')} key=${s}></span>`; })}
      </div>
      <div class="ob-top-r">${p.right || null}</div>
    </div>`;
  }

  /* ---------- splash ---------- */
  function Splash() {
    var done = useRef(false);
    function go() {
      if (done.current) return;
      done.current = true;
      OA.nav.reset(OA.get().onboarded ? OA.homeRoute() : 'welcome');
    }
    useEffect(function () { var t = setTimeout(go, reduced() ? 900 : 1700); return function () { clearTimeout(t); }; }, []);
    return html`<div class="ob ob-dark ob-splash" onClick=${go}>
      <div class="ob-splash-in">
        <div class="ob-mark ob-splash-mark">OnsAms</div>
        <p class="ob-splash-tag">For Amsterdam, by everyone</p>
      </div>
      <div class="ob-splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="ob-sr" role="status">Loading OnsAms</span>
    </div>`;
  }

  /* ---------- welcome ---------- */
  var ROLES = [
    { id: 'visitor', label: 'Visitor',
      tip: 'A visitor is anyone who is not a resident of Amsterdam, including tourists and other temporary visitors.' },
    { id: 'resident', label: 'Resident',
      tip: 'A resident lives in Amsterdam. Residents host experiences, spend points locally and vote on what their neighbourhood fund pays for.' }
  ];

  function Welcome() {
    var r = useState(null), tip = r[0], setTip = r[1];
    useEffect(function () {
      if (!tip) return;
      function down(e) { if (!(e.target && e.target.closest && e.target.closest('.ob-role'))) setTip(null); }
      function key(e) { if (e.key === 'Escape') setTip(null); }
      document.addEventListener('pointerdown', down);
      document.addEventListener('keydown', key);
      return function () { document.removeEventListener('pointerdown', down); document.removeEventListener('keydown', key); };
    }, [tip]);

    function pick(id) {
      setTip(null);
      if (OA.get().role !== id) OA.set({ role: id, hood: null, hotel: false });
      OA.nav.go('signup');
    }

    return html`<div class="ob ob-dark ob-welcome">
      <${Backdrop} art="welcome" tone="canal"/>
      <div class="ob-welcome-in">
        <div class="ob-welcome-head">
          <h1 class="ob-display">Welkom!</h1>
          <p class="ob-welcome-lede">We are glad to see you here. Before we get started, tell us a little about you.</p>
        </div>
        <div class="ob-roles" role="group" aria-labelledby="ob-im">
          <p class="ob-im" id="ob-im">I'm a…</p>
          ${ROLES.map(function (ro, i) {
            var open = tip === ro.id;
            return html`<div class=${cx('ob-role', open && 'open')} key=${ro.id}>
              <button type="button" id=${'ob-' + ro.id} class="ob-role-btn" aria-describedby=${open ? 'ob-tip-' + ro.id : null}
                onClick=${function () { pick(ro.id); }}>${ro.label}</button>
              <button type="button" id=${'ob-info-' + ro.id} class="ob-info" aria-label=${'What is a ' + ro.label.toLowerCase() + '?'}
                aria-expanded=${open ? 'true' : 'false'} onClick=${function () { setTip(open ? null : ro.id); }}>
                <${ui.Icon} name="info"/></button>
              ${open && html`<div class=${cx('ob-tip', i > 0 && 'ob-tip-up')} id=${'ob-tip-' + ro.id} role="tooltip">${ro.tip}</div>`}
            </div>`;
          })}
          <p class="ob-quick"><${ui.Icon} name="timer" size=${16}/>Takes 30 seconds. No email or password.</p>
        </div>
        <div class="ob-mark ob-mark-foot" aria-hidden="true">OnsAms</div>
      </div>
    </div>`;
  }

  /* ---------- sign-up: first name + hotel code (visitor) or neighbourhood (resident) ---------- */
  function Signup() {
    var s = OA.useStore();
    var role = s.role === 'resident' ? 'resident' : 'visitor';
    var h = hotel(), want = norm(h.code);
    var a = useState(draft.name != null ? draft.name : (s.name || '')), name = a[0], setName = a[1];
    var b = useState(draft.code || ''), code = b[0], setCode = b[1];
    var c = useState(s.hood || null), hood = c[0], setHood = c[1];
    var nameRef = useRef(null), codeRef = useRef(null), headRef = useRef(null), hoodsRef = useRef(null);
    useLandingFocus(headRef);

    var cs = codeState(code);
    var nameOk = name.trim().length > 0;
    var extraOk = role === 'resident' ? !!hood : (cs === 'ok' || cs === 'empty');
    var valid = nameOk && extraOk;
    var list = hoods();

    function onName(v) { draft.name = v; setName(v); }
    function onCode(v) { var t = String(v || '').toUpperCase().slice(0, 12); draft.code = t; setCode(t); }
    function clearCode() { onCode(''); if (codeRef.current) codeRef.current.focus(); }
    function focusHood() {
      var el = hoodsRef.current && hoodsRef.current.querySelector('input:checked, input');
      if (el) el.focus();
    }
    function submit(e) {
      if (e) e.preventDefault();
      if (!valid) {
        if (!nameOk) { if (nameRef.current) nameRef.current.focus(); }
        else if (role === 'visitor') { if (codeRef.current) codeRef.current.focus(); }
        else focusHood();
        return;
      }
      OA.set({ name: name.trim().replace(/\s+/g, ' '), hood: role === 'resident' ? hood : null, hotel: role === 'visitor' && cs === 'ok' });
      OA.nav.go('interests');
    }
    // Enter on the name moves on to the next field instead of skipping it.
    function nameKey(e) {
      if (e.key !== 'Enter' || !nameOk) return;
      if (role === 'visitor' && cs !== 'ok' && codeRef.current) { e.preventDefault(); codeRef.current.focus(); }
      else if (role === 'resident' && !hood) { e.preventDefault(); focusHood(); }
    }

    var msg = {
      empty: 'No code? No problem. Continue and you start with ' + h.noCodeWelcome + ' points.',
      typing: 'Hotel codes have ' + want.length + ' letters.',
      ok: 'Code accepted. Your hotel gives you a welcome gift.',
      bad: 'We don\'t recognise that code. Check your key card, or clear it to continue with ' + h.noCodeWelcome + ' points.'
    }[cs];
    var msgIcon = { empty: 'info', typing: 'more_horiz', ok: 'check_circle', bad: 'error' }[cs];

    var hint = !nameOk ? 'Add your first name to continue'
      : role === 'resident' ? (hood ? 'Next: what you\'re into' : 'Pick your neighbourhood to continue')
      : cs === 'ok' || cs === 'empty' ? 'Next: what you\'re into'
      : 'Finish the code, or clear it to continue';

    var visitorBlock = html`<section class="ob-hotel" aria-labelledby="ob-hotel-t">
      <div class="ob-hotel-head">
        <span class="ob-hotel-ic"><${ui.Icon} name="hotel"/></span>
        <div><h2 class="ob-h" id="ob-hotel-t">Staying at a partner hotel?</h2>
          <p class="ob-p">Enter the code from your key card to collect your welcome points.</p></div>
      </div>
      <div class="ob-field">
        <label class="ob-label" for="ob-code">Hotel code <span class="ob-opt">optional</span></label>
        <div class=${cx('ob-codebox', 'is-' + cs)}>
          <input id="ob-code" ref=${codeRef} class="ob-input ob-code" type="text" value=${code} placeholder=${'e.g. ' + want}
            autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="12" enterkeyhint="done"
            aria-describedby="ob-code-msg" aria-invalid=${cs === 'bad' ? 'true' : 'false'}
            onInput=${function (e) { onCode(e.target.value); }}/>
          ${cs === 'ok' && html`<span class="ob-code-ok" aria-hidden="true"><${ui.Icon} name="check_circle" fill/></span>`}
          ${code && html`<button type="button" class="ob-code-x" aria-label="Clear code" onClick=${clearCode}><${ui.Icon} name="close" size=${20}/></button>`}
        </div>
        <p class=${cx('ob-codemsg', 'is-' + cs)} id="ob-code-msg" aria-live="polite">
          <${ui.Icon} name=${msgIcon} size=${18} fill=${cs === 'ok'}/><span>${msg}</span>
          ${cs === 'ok' && html`<span class="ob-plus">+${OA.fmt.pts(h.welcome)} pts</span>`}
        </p>
      </div>
    </section>`;

    var residentBlock = html`<fieldset class="ob-hoods">
      <legend class="ob-h">Which neighbourhood do you live in?</legend>
      <p class="ob-p">Visitors' pooled points go to your neighbourhood fund, and you get a vote on what it pays for.</p>
      <div class="ob-hood-list" ref=${hoodsRef}>
        ${list.length ? list.map(function (hd) {
          var on = hood === hd.id;
          return html`<label class=${cx('ob-hood', on && 'on')} key=${hd.id} for=${'ob-hood-' + hd.id}>
            <input type="radio" name="ob-hood" id=${'ob-hood-' + hd.id} value=${hd.id} checked=${on}
              onChange=${function () { setHood(hd.id); }}/>
            <span class="ob-hood-dot" aria-hidden="true"></span>
            <span class="ob-hood-txt"><span class="ob-hood-t">${hd.name}</span>${hd.blurb && html`<span class="ob-hood-s">${hd.blurb}</span>`}</span>
          </label>`;
        }) : html`<p class="ob-p">Neighbourhoods are loading.</p>`}
      </div>
    </fieldset>`;

    return html`<div class="ob ob-light ob-signup">
      <${Top} step="signup"/>
      <form class="ob-form" onSubmit=${submit} novalidate>
        <div class="ob-body">
          <div class="ob-brand">
            <h1 class="ob-mark ob-brand-mark" tabindex="-1" ref=${headRef}>OnsAms</h1>
            <p class="ob-brand-tag">For Amsterdam, by everyone</p>
          </div>
          <div class="ob-as">
            <${ui.Icon} name=${role === 'resident' ? 'home' : 'luggage'} size=${18}/>
            <span>Joining as a <b>${role}</b></span>
            <button type="button" class="ob-as-x" onClick=${back}>Change</button>
          </div>
          <div class="ob-field">
            <label class="ob-label" for="ob-name">Your first name</label>
            <input id="ob-name" ref=${nameRef} class="ob-input" type="text" value=${name} placeholder="e.g. Sam"
              autocomplete="given-name" autocapitalize="words" spellcheck="false" maxlength="30"
              enterkeyhint=${role === 'visitor' ? 'next' : 'done'} aria-describedby="ob-name-help"
              onInput=${function (e) { onName(e.target.value); }} onKeyDown=${nameKey}/>
            <p class="ob-help" id="ob-name-help"><${ui.Icon} name="lock" size=${16}/>
              <span>Just your first name. This is a prototype, so there's no email or password, and nothing leaves this phone.</span></p>
          </div>
          ${role === 'visitor' ? visitorBlock : residentBlock}
        </div>
        <div class="ob-foot">
          <button type="submit" id="ob-continue" class="btn btn-primary btn-full" disabled=${!valid}>Continue</button>
          <p class="ob-foot-hint" aria-live="polite">${hint}</p>
        </div>
      </form>
    </div>`;
  }

  /* ---------- interests ---------- */
  function Interests() {
    var s = OA.useStore();
    var role = s.role === 'resident' ? 'resident' : 'visitor';
    var list = (OA.data && OA.data.interests) || [];
    var sel = s.interests || [];
    var headRef = useRef(null);
    useLandingFocus(headRef);
    function toggle(id) {
      var l = sel.slice(), i = l.indexOf(id);
      if (i >= 0) l.splice(i, 1); else l.push(id);
      OA.set({ interests: l });
    }
    var n = list.filter(function (x) { return sel.indexOf(x.id) >= 0; }).length;
    return html`<div class="ob ob-light ob-interests">
      <${Top} step="interests"/>
      <div class="ob-body">
        <h1 class="ob-q" tabindex="-1" ref=${headRef}>Soooo….<br/>What are you into?</h1>
        <div class="ob-ledes">
          <p>${role === 'resident'
            ? 'We\'ll use your choices to suggest events, neighbours\' offers and nature spots near you.'
            : 'We\'ll use your choices to recommend experiences, activities and places around Amsterdam.'}</p>
          <p>Pick what interests you most. Choose as many as you like.</p>
        </div>
        <div class="ob-chips" role="group" aria-label="Interests">
          ${list.map(function (it) {
            var on = sel.indexOf(it.id) >= 0;
            return html`<button type="button" id=${'ob-int-' + it.id} key=${it.id} class=${cx('chip', 'ob-chip', on && 'on')}
              aria-pressed=${on ? 'true' : 'false'} onClick=${function () { toggle(it.id); }}>
              ${it.icon && html`<${ui.Icon} name=${it.icon} size=${20}/>`}<span>${it.label}</span></button>`;
          })}
        </div>
      </div>
      <div class="ob-foot">
        <button type="button" id="ob-continue" class="btn btn-primary btn-full" disabled=${n === 0}
          onClick=${function () { if (n) OA.nav.go('intro'); }}>Continue</button>
        <p class="ob-foot-hint" aria-live="polite">${n ? n + ' picked' : 'Pick at least one to continue'}</p>
      </div>
    </div>`;
  }

  /* ---------- intro cards ---------- */
  var INTRO = {
    visitor: {
      title: 'Make your visit matter.',
      lede: 'Explore Amsterdam, support local places, and earn points for contributing to the city.',
      cards: [
        { id: 'explore', t: 'Explore', art: 'explore', tone: 'peach', p: 'Discover places and experiences beyond the busiest routes.' },
        { id: 'participate', t: 'Participate', art: 'participate', tone: 'peach', p: 'Join cultural, community and environmental activities.' },
        { id: 'give', t: 'Give back', art: 'give', tone: 'peach', p: 'Use your points locally or support a cause.' }
      ]
    },
    resident: {
      title: 'Your neighbourhood, your say.',
      lede: 'Share your Amsterdam with visitors, earn points, and decide what your neighbourhood gets.',
      cards: [
        { id: 'host', t: 'Host', art: 'cookies', tone: 'sun', p: 'Offer a walk, a skill or a seat at your kitchen table. Visitors pay in points.' },
        { id: 'earn', t: 'Earn', art: 'participate', tone: 'peach', p: 'Earn points for hosting and for helping out, then spend them at local places.' },
        { id: 'decide', t: 'Decide', art: 'vote', tone: 'leaf', p: 'Visitors\' pooled points fill your neighbourhood fund. You vote on what it pays for.' }
      ]
    }
  };

  function finish() {
    var st = OA.get(), h = hotel();
    if (finish.busy) return; // guards a double tap on "Get started"
    finish.busy = true;
    setTimeout(function () { finish.busy = false; }, 1500);
    var isRes = st.role === 'resident';
    var hotelOk = !isRes && !!st.hotel;
    var list = hoods();
    draft = { name: null, code: '' };
    OA.set({
      role: isRes ? 'resident' : 'visitor',
      name: String(st.name || '').trim() || (isRes ? 'Neighbour' : 'Friend'),
      interests: (st.interests || []).slice(),
      hood: isRes ? (st.hood || (list[0] && list[0].id) || null) : null,
      hotel: hotelOk,
      onboarded: true
    });
    OA.points.earn({
      ref: hotelOk ? 'hotel' : 'welcome',
      title: hotelOk ? 'Welcome points from your hotel' : 'Welcome to OnsAms',
      pts: hotelOk ? h.welcome : h.noCodeWelcome,
      cat: 'local',
      label: hotelOk ? 'welcome points from your hotel' : 'welcome points'
    });
    OA.nav.reset(OA.homeRoute());
  }

  function Intro() {
    var s = OA.useStore();
    var role = s.role === 'resident' ? 'resident' : 'visitor';
    var set = INTRO[role], cards = set.cards, last = cards.length - 1;
    var a = useState(0), idx = a[0], setIdx = a[1];
    var trackRef = useRef(null), lock = useRef(0), settle = useRef(null), headRef = useRef(null);
    useLandingFocus(headRef);
    useEffect(function () { return function () { clearTimeout(settle.current); }; }, []);

    function nearest() {
      var el = trackRef.current;
      if (!el) return 0;
      var mid = el.scrollLeft + el.clientWidth / 2, best = 0, bd = Infinity;
      for (var i = 0; i < el.children.length; i++) {
        var c = el.children[i], d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }
    function onScroll() {
      if (Date.now() > lock.current) setIdx(nearest());
      clearTimeout(settle.current);
      settle.current = setTimeout(function () { lock.current = 0; setIdx(nearest()); }, 140);
    }
    function goTo(i) {
      var el = trackRef.current;
      i = Math.max(0, Math.min(last, i));
      if (!el || !el.children[i]) return;
      var c = el.children[i];
      lock.current = Date.now() + 800;
      setIdx(i);
      el.scrollTo({ left: c.offsetLeft - (el.clientWidth - c.offsetWidth) / 2, behavior: reduced() ? 'auto' : 'smooth' });
    }
    function onKey(e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(idx - 1); }
    }

    var pts = welcomePts(s);
    var gift = (role !== 'resident' && s.hotel ? 'Your hotel\'s ' : 'Your ') + OA.fmt.pts(pts) + ' welcome points are waiting';

    return html`<div class="ob ob-dark ob-intro">
      <${Backdrop} art="houses" tone="brick" deep/>
      <div class="ob-intro-in">
        <${Top} step="intro" dark right=${html`<button type="button" class="ob-skip" id="ob-skip" onClick=${finish}>Skip</button>`}/>
        <div class="ob-intro-head">
          <h1 class="ob-intro-t" tabindex="-1" ref=${headRef}>${set.title}</h1>
          <p class="ob-intro-l">${set.lede}</p>
        </div>
        <div class="ob-carousel">
        <div class="ob-track" ref=${trackRef} onScroll=${onScroll} onKeyDown=${onKey} tabindex="0"
          role="region" aria-roledescription="carousel" aria-label="How OnsAms works. Use the arrow keys to move between cards.">
          ${cards.map(function (c, i) {
            return html`<article class=${cx('ob-card', i === idx && 'on')} key=${c.id} role="group" aria-roledescription="slide"
              aria-label=${(i + 1) + ' of ' + cards.length + ': ' + c.t} onClick=${i !== idx ? function () { goTo(i); } : null}>
              <h2 class="ob-card-t">${c.t}</h2>
              <div class="ob-card-art" style=${'background:' + toneBg(c.tone)} aria-hidden="true"
                dangerouslySetInnerHTML=${{ __html: artSvg(c.art, c.tone) }}></div>
              <p class="ob-card-p">${c.p}</p>
            </article>`;
          })}
        </div>
        <div class="ob-dots">
          ${cards.map(function (c, i) {
            return html`<button type="button" key=${c.id} class=${cx('ob-dot', i === idx && 'on')} aria-label=${'Show card ' + (i + 1) + ': ' + c.t}
              aria-current=${i === idx ? 'true' : null} onClick=${function () { goTo(i); }}></button>`;
          })}
        </div>
        </div>
        <div class="ob-intro-foot">
          <p class="ob-gift"><${ui.Icon} name="star" fill size=${18}/><span>${gift}</span></p>
          <button type="button" id="ob-next" class="btn btn-primary btn-full ob-next"
            onClick=${idx < last ? function () { goTo(idx + 1); } : finish}>
            ${idx < last ? 'Next' : 'Get started'}${idx < last && html`<${ui.Icon} name="arrow_forward"/>`}
          </button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- register ---------- */
  OA.screen('splash', Splash, { bar: false, title: 'OnsAms' });
  OA.screen('welcome', Welcome, { bar: false, title: 'Welkom' });
  OA.screen('signup', Signup, { bar: false, title: 'Sign up' });
  OA.screen('interests', Interests, { bar: false, title: 'Your interests' });
  OA.screen('intro', Intro, { bar: false, title: 'How it works' });

  OA.onboarding = { steps: STEPS.slice(), finish: finish, codeState: codeState };
})();

</script>
<script>/* ---- resident.js ---- */
/* OnsAms beta: the resident side. Owned by the resident agent (CSS prefix rs-).
   Routes: r-home (tab home), host (tab host), host-new (no tab bar), fund (tab fund), plus the proposal sheet.
   Exposes OA.resident.openProposal(id). Reads OA.data defensively, because the content is still growing.
   Extra state key: rsIdeas = ideas proposed on this device ({id, hood, title, about, cost, votes, cat, art, tone, mine, at}).
   Votes live in state.votes (proposalId -> true); a resident has 3 active votes in their own neighbourhood. */
/* icons: home, how_to_vote, storefront, park, explore, add, remove, check, check_circle, qr_code_2, visibility, event_available,
   star, delete, lightbulb, volunteer_activism, construction, chevron_right, arrow_forward, schedule, info, sell, payments,
   handshake, forum, send, eco, groups, palette, location_on, edit, emoji_events, bolt, travel_explore */
(function () {
  'use strict';
  var OA = window.OA;
  if (!OA || !OA.h || !OA.ui) return;
  var P = OA.h, html = P.html, ui = OA.ui, useState = P.useState, useEffect = P.useEffect;
  var cx = OA.cx;
  var MAX_VOTES = 3;
  var pts = function (n) { return OA.fmt.pts(n); };

  /* ---------- defensive data access ---------- */
  function list(name) {
    var d = OA.data || {};
    return Array.isArray(d[name]) ? d[name].filter(function (x) { return x && typeof x === 'object'; }) : [];
  }
  function num(n, d) { n = Number(n); return isFinite(n) ? n : (d === undefined ? 0 : d); }
  function cap(s) { s = String(s || '').replace(/-/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function hashStr(str) { var h = 2166136261; str = String(str || ''); for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  function toneOk(t) { return t && OA.tones[t] ? t : 'peach'; }
  function hoods() { return list('neighbourhoods').filter(function (h) { return h.id; }); }
  function hoodOf(id) {
    var hs = hoods();
    for (var i = 0; i < hs.length; i++) if (hs[i].id === id) return hs[i];
    return { id: id || 'oost', name: cap(id || 'oost') };
  }
  function hoodName(id) { var h = hoodOf(id); return h.name || cap(id); }
  function myHood(s) { s = s || OA.get(); if (s.hood) return s.hood; var hs = hoods(); return hs[0] ? hs[0].id : 'oost'; }
  function hoodChoices(s) {
    var mine = myHood(s);
    return [hoodOf(mine)].concat(hoods().filter(function (h) { return h.id !== mine; }));
  }
  function greeting() { var h = new Date().getHours(); return h < 12 ? 'Good morning!' : h < 18 ? 'Good afternoon!' : 'Good evening!'; }
  function month() { try { return new Date().toLocaleDateString('en-GB', { month: 'long' }); } catch (e) { return 'this month'; } }
  function daysLeft() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate(); }
  function daysText() { var n = daysLeft(); return n <= 0 ? 'Voting closes today' : n === 1 ? '1 day left to vote' : n + ' days left to vote'; }

  /* ---------- the neighbourhood fund ---------- */
  function seedProposals(hoodId) { return list('proposals').filter(function (p) { return p.id && p.title && p.hood === hoodId; }); }
  function ideas(s) { return (s.rsIdeas || []).filter(function (p) { return p && p.id; }); }
  function proposalsFor(hoodId, s) { return seedProposals(hoodId).concat(ideas(s).filter(function (p) { return p.hood === hoodId; })); }
  function findProposal(id, s) {
    var all = list('proposals').concat(ideas(s));
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }
  function hasVote(s, id) { return !!(s.votes && s.votes[id]); }
  function voteCount(p, s) { return Math.max(0, Math.round(num(p.votes))) + (hasVote(s, p.id) ? 1 : 0); }
  function usedVotes(s) {
    var ids = proposalsFor(myHood(s), s).map(function (p) { return p.id; });
    return Object.keys(s.votes || {}).filter(function (k) { return s.votes[k] && ids.indexOf(k) >= 0; }).length;
  }
  /* The hood's own Give Back cause, if the content has one (e.g. "oost-fund", "Oost neighbourhood fund"). */
  function fundCauseFor(hoodId) {
    return list('causes').filter(function (c) {
      return c.id && c.hood === hoodId && (c.fund === true || c.id === hoodId + '-fund' || /neighbourhood fund/i.test(c.title || ''));
    })[0] || null;
  }
  /* Illustrative balance = visitors' Give Back + a small share of points spent locally + this user's gives.
     With a fund cause, Give Back is that cause's "raised", so the visitor's Give Back screen and this one agree.
     Without one, the base is sized so the vote matters (it covers roughly the top idea or two). */
  function fundFor(hoodId, s) {
    var h = hoodOf(hoodId), fc = fundCauseFor(hoodId), given = s.given || {}, costs = 0, give, local, yours = 0;
    var causes = list('causes').filter(function (c) { return c.id && c.hood === hoodId && (!fc || c.id !== fc.id); });
    if (fc) {
      give = Math.max(0, Math.round(num(fc.raised)));
      local = Math.round(give * 0.12 / 10) * 10;
      yours = Math.max(0, num(given[fc.id]));
    } else {
      seedProposals(hoodId).forEach(function (p) { costs += Math.max(0, num(p.cost)); });
      var base = num(h.fund, NaN);
      if (!isFinite(base) || base <= 0) base = Math.max(3000, Math.round((costs * 0.62 + (hashStr(hoodId) % 12) * 100) / 100) * 100);
      give = Math.round(base * 0.85 / 10) * 10; local = base - give;
      causes.forEach(function (c) { yours += Math.max(0, num(given[c.id])); });
    }
    return { total: give + local + yours, give: give, local: local, yours: yours, causes: causes, cause: fc };
  }
  /* Sorted by votes; the fund pays the top ideas in order until it runs out ("if the vote closed today"). */
  function ranked(hoodId, s) {
    var left = fundFor(hoodId, s).total;
    var items = proposalsFor(hoodId, s).map(function (p, i) { return { p: p, i: i, votes: voteCount(p, s), cost: Math.max(0, num(p.cost)) }; });
    items.sort(function (a, b) { return b.votes - a.votes || a.i - b.i; });
    items.forEach(function (it, n) { it.rank = n + 1; it.alloc = Math.min(it.cost, Math.max(0, left)); left -= it.alloc; });
    return items;
  }
  function statusLine(it) {
    if (!it.cost) return 'Cost to be worked out';
    if (it.alloc >= it.cost) return 'Fully covered';
    if (it.alloc > 0) return pts(it.alloc) + ' of ' + pts(it.cost) + ' pts covered';
    return 'Not covered yet. Needs more votes';
  }

  function toggleVote(id) {
    var s = OA.get(), mine = myHood(s);
    var ok = proposalsFor(mine, s).some(function (p) { return p.id === id; });
    if (!ok) { OA.toast('You vote in your own neighbourhood, ' + hoodName(mine), { icon: 'info' }); return null; }
    var votes = Object.assign({}, s.votes || {}), used = usedVotes(s);
    if (votes[id]) {
      delete votes[id];
      OA.set({ votes: votes });
      OA.toast('Vote taken back. ' + (MAX_VOTES - used + 1) + ' of ' + MAX_VOTES + ' votes left', { icon: 'how_to_vote' });
      return false;
    }
    if (used >= MAX_VOTES) {
      OA.toast('You have used all 3 votes. Take one back to support this idea.', { icon: 'info', ms: 3400 });
      return null;
    }
    votes[id] = true;
    OA.set({ votes: votes });
    OA.toast('Your vote is in. ' + (used + 1) + ' of ' + MAX_VOTES + ' votes used', { icon: 'how_to_vote' });
    return true;
  }
  function moveTo(hoodId) {
    var s = OA.get(), had = usedVotes(s), old = myHood(s);
    OA.set({ hood: hoodId, votes: {} });
    OA.toast('Your neighbourhood is now ' + hoodName(hoodId) + (had ? '. Your votes in ' + hoodName(old) + ' were taken back' : ''), { icon: 'home', ms: 3200 });
  }

  /* ---------- small shared pieces ---------- */
  function VoteMeter(p) {
    var dots = [];
    for (var i = 0; i < MAX_VOTES; i++) dots.push(html`<i class=${cx('rs-dot', i < p.used && 'on')} key=${i}></i>`);
    var full = p.used >= MAX_VOTES;
    return html`<div class=${cx('rs-meter', full && 'full', p.class)} role="status">
      <span class="rs-dots" aria-hidden="true">${dots}</span>
      <span class="rs-meter-t"><b>${p.used} of ${MAX_VOTES} votes used</b>
        <span>${full ? 'Take one back to support another idea' : (MAX_VOTES - p.used) + ' left this month · ' + daysText().toLowerCase()}</span></span>
    </div>`;
  }

  function Step(p) {
    return html`<li class="rs-step"><span class="rs-step-n">${p.n}</span>
      <span class="rs-step-txt"><b>${p.title}</b><span>${p.text}</span></span></li>`;
  }
  function HowItWorks(p) {
    var name = hoodName(p.hood);
    return html`<${ui.Section} title="How the fund works" class="rs-how">
      <ol class="rs-steps">
        <${Step} n="1" title="Visitors pool points" text=${'When visitors give back, or spend points at local places, part of it lands in the ' + name + ' fund.'}/>
        <${Step} n="2" title="Residents propose and vote" text=${'Anyone living in ' + name + ' can suggest an idea. You get 3 votes each month.'}/>
        <${Step} n="3" title="The top ideas get paid" text="On the last day of the month the fund pays for the most-voted ideas, in order, until it runs out."/>
      </ol>
      ${OA.screens.impact && html`<button type="button" class="rs-link" onClick=${function () { OA.nav.go('impact'); }}>See how it all connects<${ui.Icon} name="arrow_forward" size=${18}/></button>`}
    </${ui.Section}>`;
  }

  function FundCard(p) {
    var f = p.f, total = Math.max(1, f.total);
    function w(n) { return 'width:' + Math.max(0, (n / total) * 100).toFixed(2) + '%'; }
    return html`<section class="rs-fundcard" aria-label=${hoodName(p.hood) + ' fund balance'}>
      <div class="rs-fc-top"><span class="rs-fc-t"><${ui.Icon} name="volunteer_activism" size=${18}/>${hoodName(p.hood)} fund · ${month()}</span>
        <span class="rs-fc-days"><${ui.Icon} name="schedule" size=${15}/>${daysText()}</span></div>
      <div class="rs-fc-n num">${pts(f.total)}<small>pts</small></div>
      <div class="rs-fc-l">pooled by visitors this month</div>
      <div class="rs-fc-h">How it fills</div>
      <div class="rs-fill" aria-hidden="true"><span class="rs-fill-a" style=${w(f.give)}></span><span class="rs-fill-b" style=${w(f.local)}></span>${f.yours > 0 && html`<span class="rs-fill-c" style=${w(f.yours)}></span>`}</div>
      <ul class="rs-legend">
        <li><i class="rs-key rs-key-a"></i><span>Visitors' Give Back</span><b class="num">${pts(f.give)}</b></li>
        <li><i class="rs-key rs-key-b"></i><span>Share of points spent at local places</span><b class="num">${pts(f.local)}</b></li>
        ${f.yours > 0 && html`<li><i class="rs-key rs-key-c"></i><span>${f.cause ? 'Your own gives' : 'Your gives to causes here'}</span><b class="num">${pts(f.yours)}</b></li>`}
      </ul>
      ${f.cause && html`<div class="rs-fc-cause">
        <span>Visitors find it in Give Back as "${f.cause.title}".</span>
        <button type="button" class="rs-fc-give" onClick=${function () { OA.open(f.cause.id); }}><${ui.Icon} name="volunteer_activism" size=${18}/>Add points</button>
      </div>`}
      <div class="rs-fc-note">Illustrative numbers for this prototype</div>
    </section>`;
  }

  function PropCard(p) {
    var it = p.it, x = it.p, s = p.s, voted = hasVote(s, x.id), covered = it.cost && it.alloc >= it.cost;
    return html`<article class=${cx('rs-prop', voted && 'on', covered && 'covered')}>
      <button type="button" class="rs-prop-main" onClick=${function () { openProposal(x.id); }} aria-label=${'Open idea: ' + x.title}>
        <span class="rs-prop-artw"><${ui.Art} name=${x.art || 'neighbourhood'} tone=${toneOk(x.tone)} class="rs-prop-art"/><span class="rs-rank">${it.rank}</span></span>
        <span class="rs-prop-txt">
          ${x.mine && html`<span class="rs-new">New · your idea</span>`}

      </div>

        ${p.own
          ? html`<button type="button" class=${cx('rs-vote', voted && 'on')} aria-pressed=${voted ? 'true' : 'false'} data-id=${x.id}
              onClick=${function () { toggleVote(x.id); }}>${voted ? html`<${ui.Icon} name="check" size=${18}/>Voted` : 'Vote'}</button>`
          : html`<span class="rs-readonly">${hoodName(x.hood)} residents vote</span>`}
      </div>
