<style>
/* ---- base.css ---- */
/* OnsAms beta: base styles and UI kit. Owned by the lead.
   Layout: a phone-first app. On wide screens the phone sits in a frame beside a presenter panel;
   below 520px it fills the screen. Single light theme on purpose (Lin's design is light). */
:root {
  /* colour */
  --orange: #F26A1F;
  --orange-deep: #C9500F;
  --sun: #FFC46B;
  --peach: #FDE3CF;
  --cream: #FFF8F1;
  --paper: #FFFFFF;
  --ink: #1F1A17;
  --ink-2: #5F5550;
  --ink-3: #8E837C;
  --line: #EEE2D7;
  --leaf: #3F8A57;
  --canal: #3E7F9C;
  --stage: #F3E6DA;
  --frame: #1F1A17;
  --c-local: #F26A1F;
  --c-culture: #E9A23B;
  --c-community: #D9667B;
  --c-environment: #3F8A57;
  --danger: #B3261E;
  /* type */
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --fs-xs: 0.75rem; --fs-s: 0.85rem; --fs-m: 0.95rem; --fs-l: 1.125rem; --fs-xl: 1.4rem; --fs-2xl: 1.8rem; --fs-3xl: 2.4rem;
  /* shape */
  --r-s: 10px; --r-m: 16px; --r-l: 22px; --r-xl: 28px;
  --shadow: 0 6px 18px rgba(87, 45, 14, 0.12);
  --shadow-s: 0 2px 8px rgba(87, 45, 14, 0.10);
  --gutter: 18px;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--stage); color: var(--ink); font: 400 var(--fs-m)/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
#oa-root { height: 100%; }

/* Material Symbols */
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; flex: none; width: 1em; overflow: hidden; }
.ms.fill { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }

/* ---------- stage / phone frame ---------- */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding-inline: 16px; padding-block: 16px; }
.side { display: none; }
.phone { width: 412px; height: 866px; transform: scale(var(--phone-scale, 1)); transform-origin: center center; border-radius: 48px; border: 11px solid var(--frame); background: var(--frame); box-shadow: 0 30px 80px rgba(60, 30, 10, 0.28); overflow: hidden; flex: none; }
.device { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--cream); overflow: hidden; border-radius: 37px; }
.statusbar { flex: none; height: 34px; display: flex; align-items: center; justify-content: space-between; padding-inline: 26px 20px; font: 600 var(--fs-s)/1 var(--f-body); background: var(--cream); color: var(--ink); }
.sb-ic { display: inline-flex; gap: 2px; }
.viewport { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; position: relative; }
.viewport::-webkit-scrollbar { display: none; }
.page { min-height: 100%; }
@media (min-width: 900px) {
  .side { display: flex; flex-direction: column; gap: 18px; width: 320px; flex: none; max-height: 100%; overflow-y: auto; }
}
@media (max-width: 519px) {
  .stage { padding: 0; display: block; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; transform: none; }
  .device { border-radius: 0; }
  .statusbar { display: none; }
  body { background: var(--cream); }
}
/* wide screens: the phone keeps its true 390x844 screen and scales down as a whole to fit the window */
@media (min-width: 520px) { .stage { overflow: hidden; } .side { max-height: calc(100vh - 32px); } }

/* presenter panel */
.side-brand { display: flex; align-items: baseline; gap: 10px; }
.side-brand .wordmark { font-size: 2.2rem; }
.side-beta { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--orange-deep); background: var(--peach); padding: 5px 8px; border-radius: 99px; }
.side-lede { font-size: var(--fs-l); line-height: 1.45; color: var(--ink); max-width: 34ch; }
.side-block { display: flex; flex-direction: column; gap: 8px; }
.side-row { flex-direction: row; flex-wrap: wrap; }
.side-h { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.side-jumps { display: flex; flex-direction: column; gap: 2px; }
.side-jump { text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: var(--r-s); font-size: var(--fs-m); color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
.side-jump:hover { background: rgba(242, 106, 31, 0.10); }
.side-jump.on { background: var(--paper); font-weight: 700; color: var(--orange-deep); box-shadow: var(--shadow-s); }
.side-jump b { background: var(--orange); color: #fff; border-radius: 99px; padding: 1px 8px; font-size: var(--fs-xs); }
.side-credit { font-size: var(--fs-xs); color: var(--ink-3); }
.side .disclaimer { margin: 0; padding: 0; text-align: left; }

/* ---------- brand ---------- */
.wordmark { font: 800 1.5rem/1 var(--f-display); color: var(--orange); letter-spacing: -0.02em; }
.wordmark-xl { font-size: 3.2rem; color: #fff; }
.splash { position: absolute; inset: 0; background: var(--orange); display: grid; place-items: center; }

/* ---------- tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: var(--paper); border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 5; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--ink-3); font: 600 0.7rem/1.1 var(--f-body); }
.tab.on { color: var(--orange); }
.tab-ic { display: grid; place-items: center; width: 40px; height: 30px; border-radius: 99px; }
.tab.on .tab-ic { background: rgba(242, 106, 31, 0.12); }
.tab-center .tab-ic { width: 58px; height: 58px; margin-top: -30px; background: var(--orange); color: #fff; border: 5px solid var(--paper); box-shadow: 0 4px 12px rgba(242, 106, 31, 0.35); }
.tab-center .tab-ic .ms { font-size: 28px; }
.tab-center.on .tab-ic { background: var(--orange-deep); }

/* ---------- page transitions ---------- */
@keyframes in-fwd { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes in-back { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes in-fade { from { opacity: 0; } to { opacity: 1; } }
.page.dir-fwd { animation: in-fwd .26s ease-out; }
.page.dir-back { animation: in-back .26s ease-out; }
.page.dir-none { animation: in-fade .2s ease-out; }

/* ---------- sheet ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(31, 26, 23, 0.42); animation: in-fade .2s ease-out; }
.sheet { position: relative; background: var(--paper); border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 90%; display: flex; flex-direction: column; animation: sheet-up .28s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15); }
@keyframes sheet-up { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-grab { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 8px auto 0; flex: none; position: absolute; left: 0; right: 0; top: 0; z-index: 2; }
.sheet-x { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(255, 255, 255, 0.92); box-shadow: var(--shadow-s); }
.sheet-scroll { overflow-y: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-body .sheet-art { height: 180px; border-radius: 0; }
.sheet-pad { padding: 18px var(--gutter) 8px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- toast + burst ---------- */
.toast { position: absolute; left: 16px; right: 16px; top: 46px; z-index: 30; background: var(--ink); color: #fff; border-radius: var(--r-m); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: var(--fs-s); box-shadow: var(--shadow); animation: toast-in .25s ease-out; }
.toast .ms { color: var(--sun); }
@keyframes toast-in { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.burst { position: absolute; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 50%, rgba(255, 248, 241, 0.95) 0, rgba(255, 248, 241, 0.8) 28%, rgba(255, 248, 241, 0) 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; animation: burst-fade 1.7s ease-in forwards; }
.burst-star { color: var(--sun); filter: drop-shadow(0 6px 14px rgba(242, 106, 31, 0.4)); animation: burst-pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.burst-n { font: 800 3.4rem/1 var(--f-display); color: var(--orange); text-shadow: 0 3px 0 #fff, 0 8px 24px rgba(242, 106, 31, 0.35); animation: burst-pop .5s .05s cubic-bezier(.2, 1.6, .4, 1) both; }
.burst-l { margin-top: 6px; font-weight: 700; color: var(--ink); background: rgba(255, 255, 255, 0.9); padding: 4px 12px; border-radius: 99px; }
@keyframes burst-pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes burst-fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- layout helpers for screens ---------- */
.screen { padding: 0 var(--gutter) 28px; display: flex; flex-direction: column; gap: 20px; }
.screen-flush { padding-bottom: 28px; display: flex; flex-direction: column; gap: 20px; }
.screen-flush > .pad { padding-inline: var(--gutter); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.hstack { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: var(--paper); border-radius: var(--r-l); box-shadow: var(--shadow-s); padding: 16px; }
.card-flat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; }
.h1 { font: 800 var(--fs-2xl)/1.08 var(--f-display); letter-spacing: -0.02em; color: var(--ink); }
.h1-orange { color: var(--orange); }
.h2 { font: 700 var(--fs-xl)/1.15 var(--f-display); letter-spacing: -0.01em; }
.h3 { font: 700 var(--fs-l)/1.2 var(--f-display); }
.lede { color: var(--ink-2); font-size: var(--fs-m); }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-s); }
.eyebrow { font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--orange-deep); }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.bullets { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }

/* ---------- headers ---------- */
.hdr { position: sticky; top: 0; z-index: 4; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; padding: 8px 10px; margin-inline: calc(-1 * var(--gutter)); background: rgba(255, 248, 241, 0.94); backdrop-filter: blur(8px); }
.screen-flush > .hdr { margin-inline: 0; }
.hdr-clear { background: transparent; backdrop-filter: none; }
.hdr-title { text-align: center; min-width: 0; }
.hdr-t { font: 700 var(--fs-l)/1.2 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-s { font-size: var(--fs-xs); color: var(--ink-2); }
.hdr-right { display: flex; justify-content: flex-end; }
.hdr-spacer { width: 44px; height: 44px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px var(--gutter) 6px; }
.screen > .topbar { margin-inline: calc(-1 * var(--gutter)); }
.topbar-title { flex: 1; font: 700 var(--fs-l)/1.2 var(--f-display); text-align: center; }
.pts-pill { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--orange); color: #fff; font: 800 var(--fs-m)/1 var(--f-display); padding: 8px 12px 8px 10px; border-radius: 99px; box-shadow: 0 3px 10px rgba(242, 106, 31, 0.3); font-variant-numeric: tabular-nums; }
.pts-pill .ms { color: var(--sun); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-m); padding: 14px 20px; font: 700 var(--fs-m)/1.1 var(--f-body); min-height: 50px; transition: transform .12s, background .15s; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--orange); color: #fff; box-shadow: 0 4px 12px rgba(242, 106, 31, 0.3); }
.btn-primary:hover { background: var(--orange-deep); }
.btn-soft { background: var(--peach); color: var(--orange-deep); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-white { background: #fff; color: var(--orange-deep); }
.btn-full { width: 100%; }
.btn-small { min-height: 38px; padding: 8px 14px; font-size: var(--fs-s); border-radius: var(--r-s); }
.btn:disabled { opacity: .45; box-shadow: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 99px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); }
.iconbtn:hover { background: rgba(31, 26, 23, 0.06); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: var(--r-s); padding: 9px 14px; font: 600 var(--fs-s)/1.1 var(--f-body); white-space: nowrap; }
.chip.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-inline: var(--gutter); margin-inline: calc(-1 * var(--gutter)); }
.chips-scroll::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--peach); border-radius: var(--r-m); padding: 4px; gap: 4px; }
.seg-o { flex: 1; border: 0; background: transparent; border-radius: 12px; padding: 9px 10px; font: 700 var(--fs-s)/1 var(--f-body); color: var(--orange-deep); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg-o.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-s); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-l { font: 700 var(--fs-s)/1.2 var(--f-body); }
.field-i { width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: var(--r-s); padding: 12px 14px; font-size: 16px; resize: vertical; }
.field-i:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 3px rgba(242, 106, 31, 0.18); }
.field-h { font-size: var(--fs-xs); color: var(--ink-3); }

/* ---------- content blocks ---------- */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sec-t { font: 700 var(--fs-l)/1.2 var(--f-display); }
.sec-s { font-size: var(--fs-s); color: var(--ink-2); margin-top: 2px; }
.sec-a { border: 0; background: none; color: var(--orange-deep); font-weight: 700; font-size: var(--fs-s); padding: 4px 0; white-space: nowrap; }
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px var(--gutter) 10px; margin-inline: calc(-1 * var(--gutter)); scroll-padding-inline: var(--gutter); }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: none; }
.art { position: relative; overflow: hidden; border-radius: var(--r-m); }
.art > svg { display: block; width: 100%; height: 100%; }
.tile { position: relative; display: block; border: 0; padding: 0; border-radius: var(--r-l); overflow: hidden; text-align: left; background: var(--peach); box-shadow: var(--shadow); color: #fff; }
.tile .art { position: absolute; inset: 0; border-radius: 0; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 14, 10, 0) 38%, rgba(20, 14, 10, 0.72) 100%); }
.tile-m { width: 168px; height: 196px; }
.tile-l { width: 100%; height: 190px; }
.tile-s { width: 132px; height: 132px; }
.tile-pts, .tile-badge { position: absolute; top: 10px; z-index: 2; font: 800 var(--fs-xs)/1 var(--f-body); padding: 6px 9px; border-radius: 99px; }
.tile-pts { right: 10px; background: rgba(255, 255, 255, 0.95); color: var(--orange-deep); }
.tile-badge { left: 10px; background: var(--ink); color: #fff; }
.tile-txt { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; display: flex; flex-direction: column; gap: 3px; }
.tile-t { font: 800 var(--fs-l)/1.1 var(--f-display); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.25); }
.tile-sub { font-size: var(--fs-xs); line-height: 1.3; opacity: .95; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: var(--paper); border-radius: var(--r-m); padding: 10px 12px 10px 10px; text-align: left; box-shadow: var(--shadow-s); }
.row:disabled { cursor: default; }
.row-art { width: 54px; height: 54px; flex: none; border-radius: 12px; }
.row-ic { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--peach); color: var(--orange-deep); display: grid; place-items: center; }
.row-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-t { font-weight: 700; line-height: 1.25; }
.row-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.3; }
.row-r { flex: none; font-weight: 800; color: var(--orange-deep); font-variant-numeric: tabular-nums; }
.ptsb { display: inline-flex; align-items: baseline; gap: 4px; font: 800 var(--fs-s)/1 var(--f-body); color: var(--orange-deep); background: var(--peach); padding: 6px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.ptsb small { font-weight: 600; color: var(--ink-2); }
.ptsb-green { color: var(--leaf); background: #DDEFE1; }
.avatar { display: inline-grid; place-items: center; border-radius: 99px; font-family: var(--f-display); font-weight: 800; flex: none; }
.prog { height: 8px; border-radius: 99px; background: var(--peach); overflow: hidden; }
.prog > span { display: block; height: 100%; background: var(--orange); border-radius: 99px; transition: width .5s ease; }
.stars { display: flex; gap: 4px; }
.star { border: 0; background: none; padding: 2px; color: var(--line); }
.star .ms { font-size: 34px; }
.star.on { color: var(--orange); }
.qr { background: #fff; padding: 8px; border-radius: 12px; }
.qr svg { display: block; width: 100%; height: auto; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 36px 20px; color: var(--ink-2); }
.empty > .ms { color: var(--orange); }
.empty-t { font: 700 var(--fs-l)/1.2 var(--f-display); color: var(--ink); }
.note { font-size: var(--fs-s); color: var(--ink-2); background: var(--peach); border-radius: var(--r-m); padding: 12px 14px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 700 0.7rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .06em; padding: 5px 8px; border-radius: 99px; background: var(--peach); color: var(--orange-deep); }
.tag-concept { background: #E4DAF0; color: #4E2F63; }
.tag-nature { background: #DDEFE1; color: #2D6B41; }
.tag-quiet { background: #DCEBF2; color: #1F5670; }
.tag-dark { background: var(--ink); color: #fff; }
.disclaimer { font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.4; text-align: center; padding: 0 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .burst { animation: none; }
}

/* status bar follows full-bleed coloured screens in the desktop frame */
.device:has(.page[data-screen="ticket"]) > .statusbar { background: var(--orange); color: #fff; }

/* ---- earnuse.css ---- */
/* OnsAms beta: earnuse module (Earn, ticket, Use, chat, done). Every class is prefixed eu-.
   The only selectors outside the prefix are scoped to this module's own routes or wrappers. */

/* Full-height routes: let the route root fill the viewport so orange / chat backgrounds reach the bottom. */
.page[data-screen="ticket"], .page[data-screen="chat"], .page[data-screen="done"] { display: flex; flex-direction: column; }
.eu-fill { flex: 1 0 auto; }
.eu-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shared bits ---------- */
.eu-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.eu-host { display: flex; gap: 12px; align-items: center; }
.eu-host-t { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.eu-host .h2 { font-size: 1.32rem; }
.eu-host-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.3; }
.eu-meta { list-style: none; margin: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--cream); border-radius: var(--r-m); }
.eu-meta li { display: flex; align-items: flex-start; gap: 10px; font-size: var(--fs-s); font-weight: 600; color: var(--ink); line-height: 1.3; }
.eu-meta .ms { font-size: 20px; color: var(--orange); }
.eu-helps { display: flex; flex-direction: column; gap: 6px; }
.eu-helps-t { font-weight: 800; }
.eu-cta { position: sticky; bottom: -16px; z-index: 2; margin: 2px calc(-1 * var(--gutter)) -8px; padding: 18px var(--gutter) 16px;
  background: linear-gradient(rgba(255, 255, 255, 0), #fff 16px); display: flex; flex-direction: column; gap: 10px; }
.eu-pricebar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.eu-price { font-weight: 700; color: var(--ink-2); font-size: var(--fs-s); }
.eu-earnbig { font: 800 1.05rem/1 var(--f-display); color: var(--ink); white-space: nowrap; }
.eu-earnbig b { color: var(--orange); font-size: 2.1rem; margin-left: 4px; letter-spacing: -0.02em; }
.eu-btnrow { display: flex; gap: 10px; }
.eu-btnrow .btn { flex: 1; }
.eu-btnrow .eu-save { flex: 0 0 auto; padding-inline: 16px; }
.eu-balline { font-size: var(--fs-s); color: var(--ink-2); text-align: center; }
.eu-balline b { color: var(--ink); font-variant-numeric: tabular-nums; }
.eu-short { display: flex; gap: 10px; align-items: flex-start; background: #FDECEA; color: #7A1F18; padding: 12px 14px; border-radius: var(--r-m); font-size: var(--fs-s); line-height: 1.35; }
.eu-short .ms { color: var(--danger); font-size: 20px; }
.eu-ratebox { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border: 2px solid var(--peach); border-radius: var(--r-m); padding: 8px 10px 8px 14px; }
.eu-ratebox-t { font-weight: 800; }
.eu-ratebox .star .ms { font-size: 28px; }
.eu-code { display: block; font: 700 var(--fs-s)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; color: var(--ink-2); }
.eu-foot { font-size: var(--fs-xs); color: var(--ink-3); text-align: center; }
.eu-none { font-size: var(--fs-s); color: var(--ink-2); background: var(--paper); border-radius: var(--r-m); padding: 14px; text-align: center; }
.eu-chips { padding-block: 2px; }

/* tiles: state badges (shared by Earn grid and Use rails) */
.eu-tile .tile-badge { display: inline-flex; align-items: center; gap: 3px; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eu-tile .tile-badge .ms { font-size: 14px; }
.eu-is-booked .tile-badge { background: var(--orange); }
.eu-is-done .tile-badge { background: var(--leaf); }
.eu-is-done .art { filter: saturate(0.7); }
.eu-is-concept .tile-badge { background: #4E2F63; }
.eu-is-host .tile-badge { background: var(--ink); }
.eu-is-quiet .tile-badge { background: #1F5670; }
/* on rails the badge sits under the points so long labels never collide with them */
.eu-tile .tile-badge { top: 40px; left: auto; right: 10px; }

/* ---------- Earn ---------- */
.eu-intro { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.eu-earned-pill { display: inline-flex; align-items: center; gap: 6px; background: #DDEFE1; color: #2D6B41; font: 700 var(--fs-s)/1.2 var(--f-body); padding: 7px 12px; border-radius: 99px; }
.eu-steps { list-style: none; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--paper); border-radius: var(--r-l); padding: 14px 10px 12px; box-shadow: var(--shadow-s); }
.eu-step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; font: 700 var(--fs-xs)/1.2 var(--f-body); color: var(--ink-2); }
.eu-step-ic { position: relative; z-index: 1; width: 42px; height: 42px; border-radius: 99px; background: var(--peach); color: var(--orange-deep); display: grid; place-items: center; }
.eu-step + .eu-step::before { content: ""; position: absolute; top: 20px; right: calc(50% + 26px); width: calc(100% - 44px); border-top: 2px dashed var(--line); }
.eu-row-go { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-s); }

.eu-feature { position: relative; display: flex; flex-direction: column; width: 100%; padding: 0; border: 0; text-align: left; background: var(--paper);
  border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow); color: var(--ink); }
.eu-feature-art { height: 150px; border-radius: 0; }
.eu-feature-pts { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 3px; background: rgba(255, 255, 255, 0.95); color: var(--orange-deep);
  font: 800 var(--fs-s)/1 var(--f-body); padding: 7px 11px; border-radius: 99px; }
.eu-feature-body { display: flex; flex-direction: column; gap: 7px; padding: 14px 16px 16px; }
.eu-feature-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.eu-feature-t { font: 800 var(--fs-xl)/1.1 var(--f-display); letter-spacing: -0.01em; }
.eu-feature-s { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.eu-feature-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 600 var(--fs-xs)/1.3 var(--f-body); color: var(--ink-2); }
.eu-feature-meta span { display: inline-flex; align-items: center; gap: 4px; }
.eu-feature-meta .ms { color: var(--orange); }
.eu-feature-go { display: inline-flex; align-items: center; gap: 4px; color: var(--orange-deep); font-weight: 800; font-size: var(--fs-s); margin-top: 2px; }

.eu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.eu-grid .tile-m { width: 100%; height: 212px; }
.eu-grid .tile-t { font-size: 1.02rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- Ticket (Lin's orange screen) ---------- */
.eu-ticket { background: var(--orange); padding: 0 var(--gutter) 24px; display: flex; flex-direction: column; gap: 16px; color: #fff; }
.eu-ticket .hdr { background: transparent; backdrop-filter: none; }
.eu-ticket .hdr .iconbtn { color: #fff; }
.eu-ticket .hdr .iconbtn:hover { background: rgba(255, 255, 255, 0.16); }
.eu-tk { align-self: center; width: 100%; max-width: 340px; background: #fff; color: var(--ink); border-radius: var(--r-xl); box-shadow: 0 18px 40px rgba(110, 40, 5, 0.32); overflow: hidden; animation: eu-pop .35s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes eu-pop { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.eu-tk-top { padding: 20px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.eu-hooray { font: 700 var(--fs-m)/1.1 var(--f-display); color: var(--orange); }
.eu-tk-h { font: 800 2.1rem/1.02 var(--f-display); letter-spacing: -0.02em; margin-bottom: 10px; }
.eu-tk .qr { box-shadow: 0 0 0 1.5px var(--line); }
.eu-tk-top .eu-code { margin-top: 10px; }
.eu-perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 20px; }
.eu-perf::before, .eu-perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 99px; background: var(--orange); }
.eu-perf::before { left: -31px; }
.eu-perf::after { right: -31px; }
.eu-tk-info { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.eu-tk-t { font: 800 var(--fs-l)/1.2 var(--f-display); }
.eu-tk-grid { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.eu-tk-grid dt { font: 700 0.68rem/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.eu-tk-grid dd { margin: 4px 0 0; font-weight: 700; font-size: var(--fs-s); line-height: 1.3; }
.eu-tk-pts { color: var(--orange-deep); }
.eu-ticket-hint { text-align: center; font-size: var(--fs-s); line-height: 1.4; color: rgba(255, 255, 255, 0.95); max-width: 32ch; align-self: center; }
.eu-ticket-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; width: 100%; max-width: 340px; align-self: center; }
.eu-earned { padding: 24px 20px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.eu-earned-ic { color: var(--leaf); margin-bottom: 4px; }
.eu-earned-k { font: 700 var(--fs-l)/1.1 var(--f-display); margin-top: 8px; }
.eu-earned-n { font: 800 3.8rem/1 var(--f-display); color: var(--orange); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.eu-earned-s { font-size: var(--fs-s); color: var(--ink-2); max-width: 30ch; margin-top: 6px; }
.eu-rate { padding: 16px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

/* ---------- Use ---------- */
.eu-bal { position: relative; overflow: hidden; background: var(--orange); color: #fff; border-radius: var(--r-l); padding: 18px 18px 16px; box-shadow: 0 8px 22px rgba(242, 106, 31, 0.3); }
.eu-bal-deco { position: absolute; right: -6px; bottom: -30px; color: rgba(255, 255, 255, 0.13); transform: rotate(-14deg); pointer-events: none; }
.eu-bal-k { position: relative; font: 700 var(--fs-xs)/1 var(--f-body); text-transform: uppercase; letter-spacing: .1em; opacity: .92; }
.eu-bal-n { position: relative; font: 800 3.1rem/1 var(--f-display); letter-spacing: -0.03em; margin-top: 8px; }
.eu-bal-s { position: relative; font-size: var(--fs-s); line-height: 1.4; opacity: .95; margin-top: 8px; max-width: 34ch; }
.eu-anchor { scroll-margin-top: 8px; }
.rail .tile-m.eu-ctile { width: 216px; }
.eu-ctile-top { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.eu-bar { display: block; width: 100%; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.8); overflow: hidden; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
.eu-bar > span { display: block; height: 100%; background: var(--orange); border-radius: 99px; transition: width .6s ease; }
.eu-ctile-r { font: 800 var(--fs-xs)/1 var(--f-body); background: rgba(255, 255, 255, 0.95); color: var(--orange-deep); padding: 6px 9px; border-radius: 99px; }
.eu-loop { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px; }
.eu-loop-ic { width: 44px; height: 44px; flex: none; border-radius: 12px; background: #E4DAF0; color: #4E2F63; display: grid; place-items: center; }
.eu-loop-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-s); color: var(--ink-2); line-height: 1.35; }
.eu-loop-txt b { color: var(--ink); font-size: var(--fs-m); }
.eu-loop .btn { flex: none; }

/* reward sheet confirm */
.eu-confirm { border: 2px solid var(--orange); border-radius: var(--r-l); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #FFF4EA; animation: eu-pop .25s ease-out; }
.eu-confirm-t { font: 800 var(--fs-l)/1.2 var(--f-display); }
.eu-confirm-row { display: flex; justify-content: space-between; font-size: var(--fs-s); color: var(--ink-2); }
.eu-confirm-row b { color: var(--ink); }
.eu-confirm-go { margin-top: 4px; }

/* cause sheet */
.eu-raise { background: var(--cream); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.eu-raise-n { font: 800 var(--fs-xl)/1 var(--f-display); color: var(--orange-deep); }
.eu-raise .prog { height: 10px; }
.eu-mine { color: var(--orange-deep); }
.eu-amt-l { font-weight: 800; }
.eu-amts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.eu-amt { min-height: 52px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 800 var(--fs-l)/1 var(--f-display);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: background .15s, border-color .15s; }
.eu-amt small { font: 600 0.68rem/1 var(--f-body); color: var(--ink-3); }
.eu-amt.on { border-color: var(--orange); background: var(--orange); color: #fff; }
.eu-amt.on small { color: rgba(255, 255, 255, 0.88); }
.eu-amt:disabled { opacity: .4; }

/* ---------- Chat ---------- */
.eu-chat { display: flex; flex-direction: column; background: var(--cream); }
.eu-chat > .hdr { margin-inline: 0; border-bottom: 1px solid var(--line); }
.eu-chat-offer { display: flex; align-items: center; gap: 12px; margin: 12px var(--gutter) 0; background: var(--paper); border-radius: var(--r-m); padding: 8px 12px 8px 8px; box-shadow: var(--shadow-s); }
.eu-chat-art { width: 48px; height: 48px; flex: none; border-radius: 12px; }
.eu-chat-offer-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-s); line-height: 1.3; }
.eu-chat-offer-t span { color: var(--ink-2); font-size: var(--fs-xs); }
.eu-msgs { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px var(--gutter) 16px; }
.eu-day { align-self: center; font: 700 var(--fs-xs)/1 var(--f-body); color: var(--ink-3); background: rgba(31, 26, 23, 0.05); padding: 5px 10px; border-radius: 99px; }
.eu-msg { max-width: 82%; padding: 10px 14px 8px; border-radius: 18px; font-size: var(--fs-m); line-height: 1.4; box-shadow: var(--shadow-s); animation: eu-msg-in .22s ease-out; overflow-wrap: anywhere; }
@keyframes eu-msg-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.eu-msg-host { align-self: flex-start; background: #FFE9D6; border-bottom-left-radius: 6px; }
.eu-msg-me { align-self: flex-end; background: var(--sun); border-bottom-right-radius: 6px; }
.eu-msg-time { display: block; font-size: 0.68rem; color: rgba(31, 26, 23, 0.55); margin-top: 3px; text-align: right; }
.eu-typing { align-self: flex-start; display: inline-flex; gap: 5px; padding: 14px 16px; background: #FFE9D6; border-radius: 18px; border-bottom-left-radius: 6px; }
.eu-typing i { width: 7px; height: 7px; border-radius: 99px; background: var(--orange-deep); animation: eu-dot 1s infinite ease-in-out; }
.eu-typing i:nth-child(2) { animation-delay: .15s; }
.eu-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes eu-dot { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: .95; } }
.eu-sugs { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 4px; }
.eu-sugs-l { font: 700 var(--fs-xs)/1 var(--f-body); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.eu-sug { max-width: 86%; min-height: 42px; border: 1.5px solid var(--orange); background: var(--paper); color: var(--orange-deep); border-radius: 18px; border-bottom-right-radius: 6px;
  padding: 9px 14px; font-weight: 700; font-size: var(--fs-s); text-align: right; }
.eu-sug:hover { background: #FFF4EA; }
.eu-chat-foot { position: sticky; bottom: 0; z-index: 3; background: var(--paper); border-top: 1px solid var(--line); padding: 10px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 18px rgba(87, 45, 14, 0.06); }
.eu-compose { display: flex; gap: 8px; align-items: center; margin: 0; }
.eu-compose input { flex: 1; min-width: 0; height: 46px; border: 1.5px solid var(--line); border-radius: 99px; padding: 0 16px; font-size: 16px; background: var(--cream); }
.eu-compose input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242, 106, 31, 0.18); }
.eu-send { width: 46px; height: 46px; flex: none; border-radius: 99px; border: 0; background: var(--orange); color: #fff; display: grid; place-items: center; }
.eu-send:disabled { background: var(--line); color: var(--ink-3); }

/* ---------- Done (Lin's "All done!" card) ---------- */
.eu-done { padding: 0 var(--gutter) 24px; display: flex; flex-direction: column; gap: 16px; }
.eu-done-card { border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow); background: var(--paper); animation: eu-pop .35s cubic-bezier(.2, 1.3, .4, 1); }
.eu-done-hero { position: relative; height: 140px; }
.eu-done-hero .art { position: absolute; inset: 0; border-radius: 0; }
.eu-done-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 14, 10, 0.05) 20%, rgba(20, 14, 10, 0.7) 100%); }
.eu-done-h { position: absolute; left: 16px; bottom: 14px; z-index: 2; display: flex; align-items: center; gap: 8px; color: #fff; font: 800 2.1rem/1 var(--f-display); letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25); }
.eu-done-pay { display: flex; justify-content: space-between; gap: 12px; background: var(--orange); color: #fff; padding: 12px 18px 14px; }
.eu-done-pay span { display: block; font-size: var(--fs-s); opacity: .92; }
.eu-done-pay b { display: block; font: 800 2.1rem/1.05 var(--f-display); letter-spacing: -0.02em; }
.eu-done-r { text-align: right; }
.eu-done-what { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-s); color: var(--ink-2); }
.eu-done-t { font: 800 var(--fs-l)/1.2 var(--f-display); color: var(--ink); }
.eu-voucher { display: flex; align-items: center; gap: 14px; }
.eu-voucher .qr { flex: none; padding: 5px; box-shadow: 0 0 0 1.5px var(--line); }
.eu-voucher > div:last-child { display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--ink); }
.eu-ratecard { border: 2.5px solid var(--orange); border-radius: var(--r-l); padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--paper); text-align: center; }
.eu-ratecard-t { font: 800 var(--fs-m)/1.2 var(--f-display); }
.eu-ratecard .star .ms { font-size: 36px; }
.eu-done-actions { margin-top: auto; }

/* Short phones: keep the ticket and its Check in button on one screen. */
@media (max-height: 780px) {
  .eu-ticket { gap: 12px; padding-bottom: 16px; }
  .eu-tk-top { padding: 14px 18px 12px; }
  .eu-tk-h { font-size: 1.75rem; margin-bottom: 6px; }
  .eu-tk .qr { width: 136px !important; }
  .eu-tk-top .eu-code { margin-top: 6px; }
  .eu-tk-info { padding: 12px 18px 14px; gap: 8px; }

/* ---- explore.css ---- */

.ex-chips .chip.on { background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: 0 3px 10px rgba(242, 106, 31, 0.28); }

/* ---------- the map ---------- */

  border-block: 1px solid #E2DED8; }

/* labels keep their screen size at any zoom (counter-scaled by --k) */

/* filtered-out items: small dots, as in Lin's map */
